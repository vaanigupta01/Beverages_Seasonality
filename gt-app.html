const icon = (name, cls = '') =>
  raw(`<svg class="icon ${cls}" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[name] ?? ''}</svg>`);

// ---- components -----------------------------------------------------------

/** Top bar: optional back link, title (+ subtitle), an optional action, and the language button. */
function appBar({ title, sub = '', back = null, action = null, heading = true }) {
  const titleTag = heading ? raw('h1') : raw('p');
  return html`<header class="app-bar">
    ${back ? html`<a class="app-bar-back" href="${back}">${icon('back')}<span>${t('common.back')}</span></a>` : ''}
    <div class="app-bar-titles ${back ? '' : 'is-flush'}">
      <${titleTag} class="app-bar-title">${title}</${titleTag}>
      ${sub ? html`<p class="app-bar-sub">${sub}</p>` : ''}
    </div>
    ${action ?? ''}
    ${langButton()}
  </header>`;
}

/** Opens the language sheet (handled in main.js). Shows the current language's short name. */
function langButton() {
  const current = LANGS.find((l) => l.code === lang());
  return html`<button type="button" class="lang-btn" data-lang-open aria-label="${t('common.language')}: ${current.label}">${icon('globe')}<span>${current.short}</span></button>`;
}

/** English · मराठी · हिंदी as a segmented control (Login). */
function langSwitch() {
  return html`<div class="lang-seg" role="group" aria-label="${t('common.language')}">
    ${LANGS.map((l) => html`<button type="button" class="lang-seg-btn" data-lang="${l.code}" aria-pressed="${String(l.code === lang())}">${l.label}</button>`)}
  </div>`;
}

/** Pill with a tone: info · caution · neutral · ok · thin · warn. Colour is never alone: text (and often an icon) too. */
const pill = (text, tone = 'neutral', iconName = null) =>
  html`<span class="pill pill-${tone}">${iconName ? icon(iconName) : ''}<span>${text}</span></span>`;

const tierBadge = (outlet, { visits = false } = {}) =>
  html`<span class="pill pill-tier" data-tier="${outlet.tier}"><span class="tier-gem" aria-hidden="true"></span><span>${label('tier', outlet.tier)}${visits && outlet.visitsPerMonth ? ` · ${t('n.visitsMonth', { n: outlet.visitsPerMonth })}` : ''}</span></span>`;

/** Muted demo aid so the panel can pick outlets on purpose. */
function personaTag(outlet) {
  const p = outlet.persona;
  if (!p) return '';
  return html`<span class="persona-tag" title="${t('persona.tip')}">${t('persona.tag', { no: String(p.no).padStart(2, '0'), label: String(p.label).replace(/^The /, '') })}</span>`;
}

/**
 * A scheme's status for an outlet, from schemes.statusFor(). Each state looks different:
 * Enrolled = solid green (already receiving it) · Applicable = blue tag (can be used) ·
 * used up this month = grey · not applicable = dashed, with the reason.
 */
function schemePill(st) {
  switch (st.kind) {
    case 'enrolled': return html`<span class="pill pill-enrolled">${icon('check')}<span>${t('scheme.enrolled')}</span></span>`;
    case 'applicable': return html`<span class="pill pill-applicable">${icon('tag')}<span>${t('scheme.applicable')}</span></span>`;
    case 'used': return html`<span class="pill pill-used"><span>${t('scheme.usedUp', { used: st.used, cap: st.cap })}</span></span>`;
    default: return html`<span class="pill pill-off"><span>${st.reason}</span></span>`;
  }
}

const emptyState = ({ icon: name = 'box', title, body = '', action = null, compact = false }) =>
  html`<div class="empty ${compact ? 'is-compact' : ''}">
    <span class="empty-icon">${icon(name)}</span>
    <p class="empty-title">${title}</p>
    ${body ? html`<p class="empty-body">${body}</p>` : ''}
    ${action ?? ''}
  </div>`;

/**
 * A place for the feature. Empty and hidden until feature code fills it on 'screen:rendered'.
 * Names: landing-top, route-badge, outlet-brief, booking-live, sku-hint, review-check.
 */
function slot(name, { tag = 'section', attrs = {} } = {}) {
  const extra = Object.entries(attrs).map(([k, v]) => ` ${esc(k)}="${esc(v)}"`).join('');
  return raw(`<!-- FEATURE SLOT: ${esc(name)} --><${tag} class="slot" data-slot="${esc(name)}"${extra} hidden></${tag}>`);
}

// ---- bottom sheet (in-app confirmations, never browser pop-ups) -------------
let closeActive = null;

/**
 * openSheet({ title, body, actions: [{ key, label, tone }], dismissKey }) → Promise<key>
 * Backdrop tap and Escape resolve with `dismissKey`. A route change resolves with 'route-change'.
 */
function openSheet({ title, body, actions, dismissKey = null }) {
  closeSheets();
  return new Promise((resolve) => {
    const prevFocus = document.activeElement;
    const wrap = document.createElement('div');
    wrap.className = 'sheet-wrap';
    wrap.innerHTML = String(html`<div class="sheet-backdrop" data-dismiss></div>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
        <span class="sheet-handle" aria-hidden="true"></span>
        <h2 class="sheet-title" id="sheet-title">${title}</h2>
        <div class="sheet-body">${body}</div>
        <div class="sheet-actions">${actions.map((a) => html`<button type="button" class="btn btn-block btn-${a.tone ?? 'secondary'}" data-key="${a.key}">${a.label}</button>`)}</div>
      </div>`);

    const buttons = () => [...wrap.querySelectorAll('button')];
    const onKey = (e) => {
      if (e.key === 'Escape') close(dismissKey);
      if (e.key === 'Tab') {
        const list = buttons();
        const i = list.indexOf(document.activeElement);
        const next = e.shiftKey ? (i <= 0 ? list.length - 1 : i - 1) : (i + 1) % list.length;
        list[next]?.focus();
        e.preventDefault();
      }
    };
    function close(key) {
      if (closeActive !== close) return;
      closeActive = null;
      document.removeEventListener('keydown', onKey);
      document.body.classList.remove('has-sheet');
      wrap.classList.add('is-leaving');
      setTimeout(() => wrap.remove(), 160);
      if (key !== 'route-change') prevFocus?.focus?.({ preventScroll: true });
      resolve(key);
    }
    wrap.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-key]');
      if (btn) close(btn.dataset.key);
      else if (e.target.closest('[data-dismiss]')) close(dismissKey);
    });

    closeActive = close;
    document.addEventListener('keydown', onKey);
    document.body.append(wrap);
    document.body.classList.add('has-sheet');
    requestAnimationFrame(() => buttons()[0]?.focus());
  });
}

function closeSheets() {
  closeActive?.('route-change');
}

// ---- toast ----------------------------------------------------------------
let toastTimer = null;

function toast(message, iconName = 'check') {
  const el = document.getElementById('toast');
  if (!el) return;
  el.innerHTML = String(html`${icon(iconName)}<span>${message}</span>`);
  el.hidden = false;
  requestAnimationFrame(() => el.classList.add('is-in'));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    el.classList.remove('is-in');
    toastTimer = setTimeout(() => { el.hidden = true; }, 220);
  }, 3200);
}

return { esc, raw, html, mount, fresh, icon, appBar, langButton, langSwitch, pill, tierBadge, personaTag, schemePill, emptyState, slot, openSheet, closeSheets, toast };
})();

        <div>

          <h1 class="display login-title">GT App <span class="proto-tag">${t('login.proto')}</span></h1>
        </div>
      </div>
      <p class="login-lede">${t('login.lede', { distributor: cfg.distributor?.name ?? '' })}</p>

      <form class="card login-form" novalidate>
        <label class="field">
          <span class="field-label">${t('login.username')}</span>
          <input class="input" name="username" placeholder="${t('login.usernamePh')}" autocomplete="username" autocapitalize="words" spellcheck="false" enterkeyhint="next" aria-describedby="err-username">
          <span class="field-error" id="err-username" hidden>${icon('alert')}<span>${t('login.errUser')}</span></span>
        </label>
        <label class="field">
          <span class="field-label">${t('login.password')}</span>
          <input class="input" name="password" type="password" autocomplete="current-password" enterkeyhint="go" aria-describedby="err-password">
          <span class="field-error" id="err-password" hidden>${icon('alert')}<span>${t('login.errPass')}</span></span>
        </label>
        <button class="btn btn-primary btn-block" type="submit">${t('login.submit')}</button>
        <p class="hint">${icon('info')}<span>${t('login.hint')}</span></p>
      </form>

      <p class="login-foot">
        <span>${t('login.demoDate')}</span> <strong>${fmt.date(cfg.demoDate, { long: true })}</strong><br>
        <span>${label('repRole', cfg.rep?.role)} · ${cfg.distributor?.name ?? ''}</span>
      </p>
    </div>`);

  const form = view.querySelector('form');
  const fields = ['username', 'password'].map((name) => ({
    input: form.elements[name],
    error: view.querySelector(`#err-${name}`),
  }));

  const check = ({ input, error }) => {
    const ok = input.value.trim() !== '';
    error.hidden = ok;
    input.setAttribute('aria-invalid', String(!ok));
    return ok;
  };

  fields.forEach((f) => f.input.addEventListener('input', () => { if (!f.error.hidden) check(f); }));

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const results = fields.map(check);
    const firstBad = fields[results.indexOf(false)];
    if (firstBad) return firstBad.input.focus();
    session.signIn(fields[0].input.value.trim());
    router.go('#/home');
  });
}

return { render };
})();

modules['screens/home'] = (() => {
// Landing page: the rep's day — who (the signed-in name), when, today's route and progress.

const { session } = modules['app'];
const data = modules['data'];
const orders = modules['orders'];
const { cart } = modules['cart'];
const fmt = modules['format'];
const { t, label } = modules['i18n'];
const { html, mount, fresh, icon, appBar, pill, tierBadge, slot, emptyState } = modules['ui'];

function render(root) {
  const view = fresh(root);
  const cfg = data.config();
  const today = data.demoDate();
  const route = data.route();
  const rows = route.map((o) => ({ outlet: o, saved: orders.demoOrdersOn(o.id, today) }));

  const todays = orders.demoOrders().filter((o) => o.date === today);
  const bookedCases = todays.reduce((n, o) => n + orders.paidCases(o), 0);
  const bookedValue = todays.reduce((n, o) => n + o.netValue, 0);
  const done = route.length > 0 && visited === route.length;

        <p class="display hero-title">${t('home.hi', { name: firstName })}</p>
        <p class="hero-sub">${[name, label('repRole', cfg.rep?.role), cfg.distributor?.name].filter(Boolean).join(' · ')}</p>

        <div class="progress-head">
          <p class="progress-title"><strong>${t('home.today', { outlets: t('n.outlet', { n: route.length }) })}</strong> · ${t('home.visited', { n: visited })}</p>
          ${done ? pill(t('home.routeDone'), 'ok', 'check') : ''}
        </div>
        <div class="progress-track" role="progressbar" aria-label="${t('home.progress')}" aria-valuemin="0" aria-valuemax="${route.length}" aria-valuenow="${visited}">
          ${rows.map((r) => html`<span class="progress-seg ${r.saved.length ? 'is-on' : ''}"></span>`)}
        </div>
        <dl class="stats">
          <div><dt>${t('home.orders')}</dt><dd>${fmt.num(todays.length)}</dd></div>
          <div><dt>${t('home.cases')}</dt><dd>${fmt.num(bookedCases)}</dd></div>
          <div><dt>${t('home.value')}</dt><dd>${fmt.rupees(bookedValue)}</dd></div>
        </dl>

      ${slot('landing-top')}

      <h2 class="section-title">${icon('route')}<span>${t('home.route', { region })}</span></h2>
      ${route.length
        ? html`<ol class="list route-list">${rows.map(routeRow)}</ol>`

      <a class="btn btn-secondary page-end" href="#/outlets">${icon('store')}<span>${t('home.seeAll')}</span></a>
    </div>`);
}

function routeRow({ outlet, saved }) {
  const stop = data.visits(outlet.id)?.routeOrder;
  const inProgress = cart.outletId === outlet.id && !cart.isEmpty();
  let status;
  if (saved.length) {
    const cases = fmt.casesText(saved.reduce((n, o) => n + orders.paidCases(o), 0));
    const value = fmt.rupees(saved.reduce((n, o) => n + o.netValue, 0));
    status = pill(saved.length > 1 ? t('status.savedN', { n: saved.length, cases, value }) : t('status.saved', { cases, value }), 'ok', 'check');

    status = pill(t('status.inProgress', { cases: fmt.casesText(cart.totalCases()) }), 'caution', 'note');

    status = pill(t('status.toVisit'), 'neutral');

  return html`<li>
    <a class="row route-row ${saved.length ? 'is-done' : ''}" href="#/outlet/${outlet.id}">

        <span class="row-meta">${label('area', outlet.area)} · ${label('ch', outlet.channel)}</span>

        ${slot('route-badge', { tag: 'div', attrs: { 'data-outlet-id': outlet.id } })}
      </span>
      ${icon('chevron', 'row-chev')}
    </a>
  </li>`;
}

return { render };
})();

modules['screens/outlets'] = (() => {
// Outlet list: search plus filter chips (All · Today's route · by channel).

const data = modules['data'];
const orders = modules['orders'];
const { t, label } = modules['i18n'];
const { html, mount, fresh, icon, appBar, pill, tierBadge, personaTag, emptyState } = modules['ui'];

// Kept while the app is open, so coming back restores the list as the rep left it.
let query = '';
let filter = 'all';

function render(root) {
  const view = fresh(root);
  const today = data.demoDate();
  const all = data.outlets();
  const onRoute = new Set(data.route().map((o) => o.id));
  const channels = [...new Set(all.map((o) => o.channel))];
  const filters = [
    { key: 'all', label: t('outlets.all'), test: () => true },
    { key: 'route', label: t('outlets.route'), test: (o) => onRoute.has(o.id) },
    ...channels.map((ch) => ({ key: `ch:${ch}`, label: label('ch', ch), test: (o) => o.channel === ch })),
  ];
  if (!filters.some((f) => f.key === filter)) filter = 'all';

  mount(view, html`
    ${appBar({ title: t('outlets.title'), back: '#/home' })}
    <div class="toolbar">
      <div class="search">
        ${icon('search')}
        <input class="search-input" type="search" data-q value="${query}" placeholder="${t('outlets.search')}" aria-label="${t('outlets.searchLabel')}" autocomplete="off" enterkeyhint="search">
        <button type="button" class="search-clear" data-clear ${query ? '' : 'hidden'}>${t('common.clear')}</button>
      </div>
      <div class="chips" role="group" aria-label="${t('outlets.filters')}">
        ${filters.map((f) => html`<button type="button" class="chip" data-filter="${f.key}" aria-pressed="${String(f.key === filter)}">${f.label}<span class="chip-count">${all.filter(f.test).length}</span></button>`)}
      </div>
    </div>
    <div class="page">
      <p class="list-count" data-count aria-live="polite"></p>
      <ul class="list outlet-list">${all.map((o) => row(o, onRoute.has(o.id), today))}</ul>
      <div data-empty></div>
    </div>`);

  const input = view.querySelector('[data-q]');
  const clearBtn = view.querySelector('[data-clear]');
  const items = [...view.querySelectorAll('[data-outlet]')];
  const count = view.querySelector('[data-count]');
  const empty = view.querySelector('[data-empty]');

  function apply() {
    query = input.value;
    clearBtn.hidden = !query;
    const tokens = query.trim().toLowerCase().split(/\s+/).filter(Boolean);
    const test = filters.find((f) => f.key === filter).test;
    let shown = 0;
    items.forEach((li) => {
      const o = data.outlet(li.dataset.outlet);
      const hit = test(o) && tokens.every((tk) => li.dataset.search.includes(tk));
      li.hidden = !hit;
      if (hit) shown += 1;
    });
    const total = t('n.outlet', { n: all.length });
    count.textContent = shown === all.length ? total : t('outlets.count', { shown, total });
    count.hidden = shown === 0;
    if (shown) {
      empty.replaceChildren();
    } else if (query.trim()) {
      mount(empty, emptyState({
        icon: 'search',
        title: t('outlets.noMatch', { q: query.trim() }),
        body: filter === 'all' ? t('outlets.noMatchAll') : t('outlets.noMatchFilter'),
        action: html`<button type="button" class="btn btn-secondary" data-clear>${t('outlets.clearSearch')}</button>`,
      }));
    } else {
      mount(empty, emptyState({
        icon: 'store',
        title: t('outlets.noneInFilter'),
        action: html`<button type="button" class="btn btn-secondary" data-filter="all">${t('outlets.showAll')}</button>`,
      }));
    }
  }

  input.addEventListener('input', apply);
  view.addEventListener('click', (e) => {
    const chip = e.target.closest('[data-filter]');
    if (chip) {
      filter = chip.dataset.filter;
      view.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed', String(c.dataset.filter === filter)));
      apply();
      return;
    }
    if (e.target.closest('[data-clear]')) {
      input.value = '';
      apply();
      input.focus();
    }
  });
  apply();
}

function row(o, onRoute, today) {
  const saved = orders.demoOrdersOn(o.id, today);
  // Searchable in English and in the current language.
  const search = [o.name, o.area, label('area', o.area), o.address, o.channel, label('ch', o.channel), o.shopType,
    label('shop', o.shopType), o.tier, label('tier', o.tier), o.id, o.persona?.label].filter(Boolean).join(' ').toLowerCase();
  const type = o.shopType && o.shopType !== o.channel ? ` · ${label('shop', o.shopType)}` : '';
  return html`<li data-outlet="${o.id}" data-search="${search}">
    <a class="row outlet-row" href="#/outlet/${o.id}">
      <span class="row-main">
        <span class="row-title">${o.name}</span>
        <span class="row-meta">${label('area', o.area)} · ${label('ch', o.channel)}${type}</span>
        <span class="row-tags">
          ${tierBadge(o, { visits: true })}
          ${saved.length ? pill(saved.length > 1 ? t('status.savedShortN', { n: saved.length }) : t('status.savedShort'), 'ok', 'check') : ''}
          ${onRoute ? '' : pill(t('outlets.notOnRoute'), 'neutral')}
        </span>
        ${personaTag(o)}
      </span>
      ${icon('chevron', 'row-chev')}
    </a>
  </li>`;
}

return { render };
})();

modules['screens/outlet'] = (() => {
// Outlet details: who the outlet is, what it ordered, what it owes, which schemes apply.

const { nav } = modules['app'];
const data = modules['data'];
const orders = modules['orders'];
const schemes = modules['schemes'];
const { cart } = modules['cart'];
const fmt = modules['format'];
const { t, label } = modules['i18n'];
const { html, mount, fresh, icon, appBar, pill, tierBadge, personaTag, schemePill, slot, emptyState } = modules['ui'];

/**
 * Google Maps directions to the outlet (two-wheeler, as reps ride motorbikes). Uses exact
 * coordinates when the data has outlets[].geo { lat, lng }; otherwise the address.
 */
function directionsUrl(o) {
  const region = data.config().region ?? {};
  const address = o.area && !String(o.address ?? '').includes(o.area) ? `${o.address}, ${o.area}` : o.address;
  const destination = o.geo?.lat != null && o.geo?.lng != null
    ? `${o.geo.lat},${o.geo.lng}`
    : [address, region.city, region.state].filter(Boolean).join(', ');
  return `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(destination)}&travelmode=two-wheeler`;
}

function render(root, { id }) {
  const view = fresh(root);
  const o = data.outlet(id);
  if (!o) return notFound(view, id);

  const today = data.demoDate();
  const v = data.visits(o.id);
  const all = orders.allOrdersFor(o.id);
  const savedToday = orders.demoOrdersOn(o.id, today);
  const inCart = cart.outletId === o.id && !cart.isEmpty();
  const address = o.area && !String(o.address ?? '').includes(o.area) ? `${o.address}, ${o.area}` : o.address;
  const typeLabel = o.shopType && o.shopType !== o.channel ? `${label('ch', o.channel)} · ${label('shop', o.shopType)}` : label('ch', o.channel);
  const closures = (o.closures ?? []).filter((c) => c.to >= today).sort((a, b) => (a.from < b.from ? -1 : 1));

  const bookLabel = inCart ? t('outlet.continue', { cases: fmt.casesText(cart.totalCases()) }) : savedToday.length ? t('outlet.bookAnother') : t('outlet.book');

  mount(view, html`
    ${appBar({ title: t('outlet.title'), back: nav.hub, heading: false })}
    <div class="page">
      <header class="outlet-head">
        ${personaTag(o)}
        <h1 class="display outlet-name">${o.name}</h1>
        <p class="outlet-addr">${address}${o.locationContext ? html` <span class="muted">· ${o.locationContext}</span>` : ''}</p>
        <div class="row-tags">
          ${tierBadge(o, { visits: true })}
          ${pill(typeLabel, 'neutral')}
          ${v?.todayOnRoute ? pill(t('outlet.stop', { n: v.routeOrder }), 'info', 'route') : pill(t('outlets.notOnRoute'), 'neutral')}
        </div>
        <div class="outlet-actions">
          ${o.owner?.name ? html`<p class="outlet-owner">${o.owner.role ? label('role', o.owner.role) : t('outlet.owner')}: ${o.owner.name}</p>` : html`<span></span>`}
          <a class="btn btn-secondary btn-compact" href="${directionsUrl(o)}" target="_blank" rel="noopener noreferrer" aria-label="${t('outlet.directionsLabel', { name: o.name })}">${icon('map')}<span>${t('outlet.directions')}</span></a>
        </div>
      </header>

      ${slot('outlet-brief')}

      ${savedToday.length ? html`<section class="callout callout-ok">
        ${icon('check')}
        <div>
          <p class="callout-title">${savedToday.length > 1 ? t('outlet.savedTodayN', { n: savedToday.length }) : t('outlet.savedToday')}</p>
          ${savedToday.map((s) => html`<p>${fmt.casesText(orders.paidCases(s))}${orders.freeCases(s) ? ` ${t('kv.plusFree', { n: orders.freeCases(s) })}` : ''} · ${fmt.rupees(s.netValue)} <span class="mono muted">${s.id}</span></p>`)}
        </div>
      </section>` : ''}

      ${closures.map((c) => html`<section class="callout callout-caution">
        ${icon('calendarX')}
        <div>
          <p class="callout-title">${t('outlet.closed', { range: fmt.dateRange(c.from, c.to, today) })} · ${c.from > today ? t('outlet.closedStarts', { rel: fmt.relative(c.from, today) }) : t('outlet.closedNow')}</p>
          <p>${c.reason}</p>
        </div>
      </section>`)}

      ${lastOrderCard(all, v, today, savedToday.length > 0)}
      ${paymentCard(o, today)}
      ${schemesCard(o, all, today)}
      ${historyCard(all, today)}
      ${coolerCard(o, today)}
      ${bookingsCard(o, today)}
      ${notesCard(v, today)}
    </div>
    <div class="bottom-bar">
      <a class="btn btn-primary btn-block" href="#/book/${o.id}">${bookLabel}</a>
    </div>`);
}

function notFound(view, id) {
  mount(view, html`
    ${appBar({ title: t('outlet.title'), back: nav.hub })}
    <div class="page">${emptyState({
      icon: 'store',
      title: t('outlet.notFound'),
      body: t('outlet.notFoundBody', { id: id ?? '' }),
      action: html`<a class="btn btn-primary" href="#/outlets">${t('outlet.openList')}</a>`,
    })}</div>`);
}

const card = (iconName, title, body, cls = '') =>
  html`<section class="card ${cls}"><h2 class="card-title">${icon(iconName)}<span>${title}</span></h2>${body}</section>`;

function lastOrderCard(all, v, today, visitedToday) {
  const last = all[0];
  // A demo order today counts as today's visit (visits.json only holds past visits).
  const lastVisit = visitedToday
    ? { date: today, minutes: null }
    : (v?.visits ?? []).filter((x) => x.done && x.date <= today).sort((a, b) => (a.date < b.date ? 1 : -1))[0];
  return card('calendar', t('card.lastOrder'), html`<dl class="kv">
    ${last
      ? html`<div><dt>${t('kv.lastOrder')}</dt><dd>${fmt.shortDate(last.date)} <span class="muted">· ${fmt.relative(last.date, today)}</span></dd></div>
        <div><dt>${t('kv.cases')}</dt><dd>${fmt.casesText(orders.paidCases(last))}${orders.freeCases(last) ? ` ${t('kv.plusFree', { n: orders.freeCases(last) })}` : ''}</dd></div>
        <div><dt>${t('kv.value')}</dt><dd>${fmt.rupees(last.netValue)}</dd></div>`
      : html`<div><dt>${t('kv.lastOrder')}</dt><dd class="muted">${t('kv.noOrders')}</dd></div>`}
    <div><dt>${t('kv.lastVisit')}</dt><dd>${lastVisit ? html`${fmt.shortDate(lastVisit.date)} <span class="muted">· ${fmt.relative(lastVisit.date, today)}${lastVisit.minutes ? ` · ${t('kv.minutes', { n: lastVisit.minutes })}` : ''}</span>` : html`<span class="muted">${t('kv.noVisits')}</span>`}</dd></div>
    ${v?.nextVisitAfterToday ? html`<div><dt>${t('kv.nextVisit')}</dt><dd>${fmt.shortDate(v.nextVisitAfterToday)} <span class="muted">· ${fmt.relative(v.nextVisitAfterToday, today)}</span></dd></div>` : ''}
  </dl>`);
}

function paymentCard(o, today) {
  const c = o.credit ?? {};
  const overdue = c.overdue ?? 0;
  return card('wallet', t('card.payment'), html`<dl class="kv">
    <div><dt>${t('kv.creditLimit')}</dt><dd>${fmt.rupees(c.limit ?? 0)}</dd></div>
    <div><dt>${t('kv.outstanding')}</dt><dd>${fmt.rupees(c.outstanding ?? 0)}</dd></div>
    <div class="${overdue > 0 ? 'is-warn' : ''}"><dt>${t('kv.overdue')}</dt><dd>${overdue > 0 ? html`${icon('alert')}<span>${t('kv.overdueAmt', { amt: fmt.rupees(overdue) })}</span>` : fmt.rupees(0)}</dd></div>
    <div><dt>${t('kv.lastPayment')}</dt><dd>${c.lastPaymentDate ? html`${fmt.shortDate(c.lastPaymentDate)} <span class="muted">· ${fmt.relative(c.lastPaymentDate, today)}</span>` : html`<span class="muted">${t('kv.noneYet')}</span>`}</dd></div>
  </dl>`);
}

const ORDER = { enrolled: 0, applicable: 1, used: 2, not: 3 };

function schemesCard(o, all, today) {
  const hasCooler = o.cooler?.type === 'bottler';
  const list = schemes.activeSchemes(today)
    .filter((s) => s.type !== 'program' || hasCooler)
    .map((s) => ({ s, st: schemes.statusFor(s, o, today, all) }))
    .sort((a, b) => ORDER[a.st.kind] - ORDER[b.st.kind]);
  if (!list.length) return card('tag', t('card.schemes'), emptyState({ icon: 'tag', title: t('scheme.none'), compact: true }));

  const month = fmt.monthName(today, true);
  return card('tag', t('card.schemes'), html`<ul class="scheme-list">${list.map(({ s, st }) => html`<li>
      <a class="scheme-row st-${st.kind}" href="#/scheme/${s.id}/${o.id}">
        <span class="scheme-row-main">
          <span class="scheme-head">
            <span class="scheme-name">${s.name}</span>
            ${schemePill(st)}
          </span>
          <span class="scheme-offer">${schemes.offerText(s)}</span>
          <span class="scheme-meta">${s.validTo ? t('common.till', { date: fmt.shortDate(s.validTo) }) : t('common.ongoing')}${st.cap && st.kind !== 'not' ? html` · <span class="${st.used >= st.cap ? 'text-warn' : ''}">${t('scheme.usesTaken', { used: st.used, cap: st.cap, month })}</span>` : ''}</span>
        </span>
        ${icon('chevron', 'row-chev')}
      </a>
    </li>`)}</ul>
    <p class="fine scheme-legend">${t('scheme.legend')}</p>`);
}

function historyCard(all, today) {
  if (!all.length) {
    return card('history', t('card.history'), emptyState({ icon: 'box', title: t('history.empty'), body: t('history.emptyBody'), compact: true }));
  }
  const oldest = all.at(-1);
  const shown = Math.min(3, all.length);
  return card('history', t('card.history'), html`
    ${monthStrip(all, today)}
    <h3 class="sub-title">${t('history.last', { n: shown })}</h3>
    <ul class="mini-list">${all.slice(0, 3).map((x) => html`<li>
      <span>${fmt.shortDate(x.date)}${x.source === 'demo' ? html` ${pill(t('demo.tag'), 'thin')}` : ''}</span>
      <span>${fmt.casesText(orders.paidCases(x))}</span>
      <span class="num">${fmt.rupees(x.netValue)}</span>
    </li>`)}</ul>
    <p class="fine">${t('history.since', { orders: t('n.order', { n: all.length }), date: fmt.date(oldest.date, { weekday: false }) })}</p>`);
}

function monthStrip(all, today) {
  const end = fmt.monthKey(today);
  const months = Array.from({ length: 13 }, (_, i) => fmt.addMonths(end, i - 12));
  const totals = new Map(months.map((m) => [m, 0]));
  all.forEach((x) => {
    const k = fmt.monthKey(x.date);
    if (totals.has(k)) totals.set(k, totals.get(k) + orders.paidCases(x));
  });
  const max = Math.max(1, ...totals.values());
  const aria = `${t('history.stripAria')} ${months.map((m) => `${fmt.monthName(m)} ${m.slice(0, 4)}: ${totals.get(m)}`).join('; ')}`;
  const first = months[0];
  return html`<figure class="strip" role="img" aria-label="${aria}">
    <div class="strip-bars">${months.map((m) => {
      const val = totals.get(m);
      return html`<span class="strip-col ${m === end ? 'is-current' : ''} ${val ? '' : 'is-zero'}">
        <span class="strip-val">${val ? fmt.num(val) : ''}</span>
        <span class="strip-bar" style="height:${val ? Math.max(3, Math.round((val / max) * 52)) : 2}px"></span>
      </span>`;
    })}</div>
    <div class="strip-labels" aria-hidden="true">${months.map((m) => html`<span class="${m === end ? 'is-current' : ''}">${fmt.monthTiny(m)}</span>`)}</div>
    <figcaption class="fine">${t('history.strip', {
      from: `${fmt.monthName(first)} ${first.slice(0, 4)}`,
      to: `${fmt.monthName(end)} ${end.slice(0, 4)}`,
      month: fmt.monthName(end),
      date: fmt.date(today, { weekday: false, year: false }),
    })}</figcaption>
  </figure>`;
}

/** Collapsed by default; the summary row still shows what cooler it is and flags a bad audit. */
function coolerCard(o, today) {
  const c = o.cooler ?? { type: 'none' };
  const a = c.lastAudit;
  let summary;
  let body;
  let warn = false;
  if (c.type === 'bottler') {
    summary = t('cooler.company', { count: c.count, litres: c.litres });
    warn = Boolean(a && (!a.pure || a.tempC > 6)) || Boolean(c.afternoonOutage);
    body = html`<dl class="kv">
      ${a ? html`<div><dt>${t('cooler.lastAudit')}</dt><dd>${fmt.shortDate(a.date)} <span class="muted">· ${fmt.relative(a.date, today)}</span></dd></div>
        <div><dt>${t('cooler.onlyOurs')}</dt><dd>${a.pure ? t('cooler.yes') : html`<span class="text-warn">${icon('alert')}<span>${t('cooler.otherBrands')}</span></span>`}</dd></div>
        <div><dt>${t('cooler.fillTemp')}</dt><dd>${a.fillPct}% · ${a.tempC > 6 ? html`<span class="text-warn">${icon('alert')}<span>${t('cooler.warm', { t: a.tempC })}</span></span>` : `${a.tempC}°C`}</dd></div>`
      : html`<div><dt>${t('cooler.lastAudit')}</dt><dd class="muted">${t('cooler.noAudit')}</dd></div>`}
    </dl>
    ${c.afternoonOutage ? html`<p class="inline-note">${icon('alert')}<span>${t('cooler.outage')}</span></p>` : ''}`;
  } else {
    summary = { 'own-fridge': `${t('cooler.ownFridge')}${c.litres ? ` · ${c.litres} L` : ''}`, 'ice-box': t('cooler.iceBox'), none: t('cooler.none') }[c.type] ?? c.type;
    body = html`<dl class="kv"><div><dt>${t('cooler.label')}</dt><dd>${summary}</dd></div></dl>`;
  }
  if (o.empties?.cratesHeld != null) {
    body = html`${body}<dl class="kv"><div><dt>${t('cooler.crates')}</dt><dd>${fmt.num(o.empties.cratesHeld)}</dd></div></dl>`;
  }
  return html`<details class="card collapse">
    <summary class="collapse-head">
      <span class="card-title">${icon('cooler')}<span>${t('card.cooler')}</span></span>
      <span class="collapse-sum ${warn ? 'text-warn' : ''}">${warn ? icon('alert') : ''}<span>${summary}</span></span>
      ${icon('chevron', 'collapse-chev')}
    </summary>
    <div class="collapse-body">${body}</div>
  </details>`;
}

function bookingsCard(o, today) {
  const upcoming = (o.bookings ?? []).filter((b) => b.date >= today).sort((a, b) => (a.date < b.date ? -1 : 1));
  if (!upcoming.length) return '';
  const total = upcoming.reduce((n, b) => n + (b.expectedCases ?? 0), 0);
  return card('calendar', t('card.bookings'), html`
    <ul class="mini-list">${upcoming.slice(0, 3).map((b) => html`<li>
      <span>${fmt.shortDate(b.date)}</span>
      <span>${b.event}</span>
      <span class="num">${b.expectedCases != null ? `~${fmt.casesText(b.expectedCases)}` : ''}</span>
    </li>`)}</ul>
    <p class="fine">${upcoming.length > 3 ? `${t('bookings.next', { n: upcoming.length, date: fmt.shortDate(upcoming.at(-1).date), cases: fmt.casesText(total) })} ` : ''}${t('bookings.note')}</p>`);
}

function notesCard(v, today) {
  const notes = (v?.visits ?? []).filter((x) => x.note && x.date <= today).sort((a, b) => (a.date < b.date ? 1 : -1)).slice(0, 2);
  return card('note', t('card.notes'), notes.length
    ? html`<ul class="notes">${notes.map((n) => html`<li><p class="note-date">${fmt.shortDate(n.date)}</p><p>${n.note}</p></li>`)}</ul>`
    : emptyState({ icon: 'note', title: t('notes.empty'), compact: true }));
}

return { directionsUrl, render };
})();

modules['screens/book'] = (() => {
// Order booking: find SKUs (search + category), set quantities, see schemes, running total.
// The screen renders once; cart changes update only the affected row and the footer, so
// feature code in the slots isn't wiped on every tap.
// Tapping an applicable scheme chip adds that scheme's quantity of the product (e.g. +10).

const { app, router } = modules['app'];
const data = modules['data'];
const orders = modules['orders'];
const schemes = modules['schemes'];
const { cart, MAX_CASES } = modules['cart'];
const fmt = modules['format'];
const { t, label, lang } = modules['i18n'];
const { html, mount, fresh, icon, appBar, slot, emptyState, openSheet, toast } = modules['ui'];

const lcFirst = (s) => (lang() === 'en' ? s.charAt(0).toLowerCase() + s.slice(1) : s);

function render(root, { id }) {
  const o = data.outlet(id);
  if (!o) {
    const view = fresh(root);
    mount(view, html`${appBar({ title: t('book.title'), back: '#/outlets' })}
      <div class="page">${emptyState({ icon: 'store', title: t('outlet.notFound'), body: t('outlet.notFoundBody', { id: id ?? '' }), action: html`<a class="btn btn-primary" href="#/outlets">${t('outlet.openList')}</a>` })}</div>`);
    return null;
  }

  let inner = null;
  const cleanup = () => inner?.();

  if (!cart.isEmpty() && cart.outletId && cart.outletId !== o.id) {
    askSwitch(root, o, () => {
      cart.start(o.id);
      inner = renderBooking(root, o);
      app.emit('screen:rendered', { screen: 'book', outletId: o.id, root });
    });
    return cleanup;
  }
  if (cart.outletId !== o.id) cart.start(o.id);
  inner = renderBooking(root, o);
  return cleanup;
}

/** Another outlet's order isn't submitted: keep editing it, or discard it and start here. */
function askSwitch(root, o, startHere) {
  const other = data.outlet(cart.outletId);
  const view = fresh(root);
  const otherName = other?.name ?? cart.outletId;
  const p = other ? schemes.price(cart.lines(), other, data.demoDate(), orders.allOrdersFor(other.id)) : null;
  const cases = fmt.casesText(cart.totalCases());

  mount(view, html`${appBar({ title: t('book.title'), sub: o.name, back: `#/outlet/${o.id}` })}
    <div class="page">${emptyState({
      icon: 'note',
      title: t('book.openTitle'),
      body: t('book.openBody', { name: otherName, cases }),
      action: html`<button type="button" class="btn btn-primary" data-ask>${t('book.choose')}</button>`,
    })}</div>`);

  const ask = async () => {
    const key = await openSheet({
      title: t('book.unsavedTitle'),
      body: html`<p>${t('book.unsavedBody', { name: otherName, cases, value: p ? fmt.rupees(p.net) : '' })}</p>
        <p>${t('book.unsavedQ', { name: o.name })}</p>`,
      actions: [
        { key: 'keep', label: t('book.keep', { name: otherName }), tone: 'primary' },
        { key: 'discard', label: t('book.discard'), tone: 'danger-quiet' },
      ],
      dismissKey: 'dismiss',
    });
    if (key === 'keep') router.go(`#/book/${cart.outletId}`);
    if (key === 'discard') startHere();
  };
  view.querySelector('[data-ask]').addEventListener('click', ask);
  ask();
}

function renderBooking(root, o) {
  const view = fresh(root);
  const today = data.demoDate();
  const pastAndDemo = orders.allOrdersFor(o.id);
  const products = data.products();
  const orderLevel = schemes.activeSchemes(today)
    .filter((s) => s.type === 'first-order')
    .filter((s) => schemes.eligibility(s, o, today, pastAndDemo).eligible);

  mount(view, html`
    ${appBar({ title: t('book.title'), sub: o.name, back: `#/outlet/${o.id}` })}
    <div class="toolbar">
      <div class="search">
        ${icon('search')}
        <input class="search-input" type="search" data-q placeholder="${t('book.search')}" aria-label="${t('book.search')}" autocomplete="off" enterkeyhint="search">
        <button type="button" class="search-clear" data-clear hidden>${t('common.clear')}</button>
      </div>
      <div class="chips" role="group" aria-label="${t('book.category')}">
        <button type="button" class="chip" data-cat="" aria-pressed="true">${t('book.all')}</button>
        ${data.categories().map((c) => html`<button type="button" class="chip" data-cat="${c}" aria-pressed="false">${label('cat', c)}</button>`)}
      </div>
    </div>

    ${slot('booking-live')}

    <div class="page page-book">
      ${orderLevel.map((s) => html`<p class="inline-note inline-note-info">${icon('tag')}<span>${t('book.firstOrder', { name: s.name, offer: schemes.chipText(s) })}</span></p>`)}
      <ul class="sku-list">${products.map((p) => skuRow(p, o, today, pastAndDemo))}</ul>
      <div data-empty></div>
    </div>

    <footer class="cart-bar">
      <div class="cart-sum" aria-live="polite">
        <p class="cart-main"><strong data-cases></strong><span class="cart-sep" aria-hidden="true">·</span><span data-value></span></p>
        <p class="cart-extra" data-extra></p>
      </div>
      <button type="button" class="btn btn-primary" data-review>${t('book.review')}${icon('chevron')}</button>
    </footer>`);

  const rows = new Map([...view.querySelectorAll('.sku')].map((li) => [li.dataset.sku, li]));
  const q = view.querySelector('[data-q]');
  const clearBtn = view.querySelector('[data-clear]');
  const empty = view.querySelector('[data-empty]');
  const footer = {
    cases: view.querySelector('[data-cases]'),
    value: view.querySelector('[data-value]'),
    extra: view.querySelector('[data-extra]'),
    review: view.querySelector('[data-review]'),
  };
  let category = '';
  const lastValid = new WeakMap();   // quantity field → its last accepted text
  const afterSeparator = new WeakSet();   // quantity fields where a non-digit ("." "," "-") was just refused
  const hintTimers = new WeakMap();

  function showHint(li, text) {
    const hint = li.querySelector('[data-qty-hint]');
    hint.textContent = text;
    hint.hidden = false;
    clearTimeout(hintTimers.get(hint));
    hintTimers.set(hint, setTimeout(() => { hint.hidden = true; }, 2500));
  }

  function syncRow(sku) {
    const li = rows.get(sku);
    if (!li) return;
    const n = cart.get(sku);
    const input = li.querySelector('.qty');
    if (document.activeElement !== input) input.value = String(n);
    li.classList.toggle('has-qty', n > 0);
    li.querySelector('[data-step="-1"]').disabled = n <= 0;
    li.querySelector('[data-step="1"]').disabled = n >= MAX_CASES;
    const quick = li.querySelector('[data-quick]');
    if (quick) quick.disabled = n >= MAX_CASES;
  }

  function syncFooter() {
    const p = schemes.price(cart.lines(), o, today, pastAndDemo);
    footer.cases.textContent = fmt.casesText(p.paidCases);
    footer.value.textContent = fmt.rupees(p.net);
    const extras = [];
    if (p.freeCases) extras.push(`+${t('n.freeCase', { n: p.freeCases })}`);
    if (p.discount) extras.push(t('book.off', { amt: fmt.rupees(p.discount) }));
    footer.extra.textContent = extras.length ? extras.join(' · ') : p.paidCases ? t('book.noScheme') : t('book.cartEmpty');
    footer.extra.classList.toggle('is-quiet', !extras.length);
    footer.review.disabled = p.paidCases === 0;
  }

  function applyFilter() {
    clearBtn.hidden = !q.value;
    const tokens = q.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    let shown = 0;
    rows.forEach((li) => {
      const hit = (!category || li.dataset.category === category) && tokens.every((tk) => li.dataset.search.includes(tk));
      li.hidden = !hit;
      if (hit) shown += 1;
    });
    if (shown) return empty.replaceChildren();
    const cat = label('cat', category);
    mount(empty, q.value.trim()
      ? emptyState({ icon: 'search', title: t('book.noMatch', { q: q.value.trim() }), body: category ? t('book.noMatchIn', { cat }) : t('book.noMatchBody'), action: html`<button type="button" class="btn btn-secondary" data-clear>${t('outlets.clearSearch')}</button>` })
      : emptyState({ icon: 'box', title: t('book.noneIn', { cat }) }));
  }

  const unsubscribe = cart.subscribe((e) => {
    if (e.sku) syncRow(e.sku);
    else rows.forEach((_, sku) => syncRow(sku));
    syncFooter();
  });
  rows.forEach((_, sku) => syncRow(sku));
  syncFooter();

  view.addEventListener('click', (e) => {
    const step = e.target.closest('[data-step]');
    if (step) {
      const sku = step.closest('.sku').dataset.sku;
      if (step.dataset.step === '1') cart.add(sku);
      else cart.remove(sku);
      return;
    }
    // A scheme chip adds the scheme's quantity of this product (buy 10 → +10, 5+ cases → +5).
    const quick = e.target.closest('[data-quick]');
    if (quick) {
      const li = quick.closest('.sku');
      const p = data.product(li.dataset.sku);
      const s = schemes.activeSchemes(today).find((x) => x.id === quick.dataset.scheme);
      const n = Math.min(Number(quick.dataset.quick), MAX_CASES - cart.get(p.sku));
      if (n > 0) {
        cart.add(p.sku, n);
        toast(t('book.added', { cases: fmt.unitsText(n, p.caseLabel), name: p.name, scheme: s?.name ?? '' }), 'plus');
      }
      return;
    }
    const chip = e.target.closest('.chip[data-cat]');
    if (chip) {
      category = chip.dataset.cat;
      view.querySelectorAll('.chip[data-cat]').forEach((c) => c.setAttribute('aria-pressed', String(c === chip)));
      applyFilter();
      return;
    }
    if (e.target.closest('[data-clear]')) {
      q.value = '';
      applyFilter();
      q.focus();
      return;
    }
    if (e.target.closest('[data-review]') && !cart.isEmpty()) router.go(`#/review/${o.id}`);
  });

  view.addEventListener('input', (e) => {
    if (e.target === q) return applyFilter();
    if (e.target.matches('.qty')) {
      // Whole cases 0–999 only. Anything else ("12.5", "1,200", "-5", a 4th digit) is refused:
      // the field keeps its last valid value and a small hint says why.
      const input = e.target;
      const li = input.closest('.sku');
      const value = input.value;
      const prev = lastValid.get(input) ?? String(cart.get(li.dataset.sku));
      // Digits typed right after a refused character belong to it (the ".5" of "12.5", the "5"
      // of "-5"): ignore them too, until the rep deletes or taps the field again.
      if (afterSeparator.has(input) && value.startsWith(prev) && /^\d+$/.test(value.slice(prev.length))) {
        input.value = prev;
        showHint(li, t('book.hintWhole'));
        return;
      }
      if (/^\d*$/.test(value) && (value === '' || Number(value) <= MAX_CASES)) {
        const clean = value === '' ? '' : String(Number(value));   // "045" → "45"
        if (clean !== value) input.value = clean;
        afterSeparator.delete(input);
        lastValid.set(input, clean);
        cart.set(li.dataset.sku, clean === '' ? 0 : Number(clean));
        return;
      }
      input.value = prev;
      const tooBig = /^\d+$/.test(value);
      if (!tooBig) afterSeparator.add(input);
      showHint(li, tooBig ? t('book.hintMax', { max: MAX_CASES }) : t('book.hintWhole'));
    }
  });
  view.addEventListener('focusin', (e) => {
    if (!e.target.matches('.qty')) return;
    lastValid.set(e.target, e.target.value);
    afterSeparator.delete(e.target);
    e.target.select();
  });
  view.addEventListener('focusout', (e) => {
    if (!e.target.matches('.qty')) return;
    afterSeparator.delete(e.target);
    e.target.value = String(cart.get(e.target.closest('.sku').dataset.sku));
  });
  view.addEventListener('keydown', (e) => { if (e.target.matches('.qty') && e.key === 'Enter') e.target.blur(); });

  return unsubscribe;
}

function skuRow(p, o, today, pastAndDemo) {
  const unit = t(p.caseLabel === 'crate' ? 'unit.crate' : 'unit.case');
  const size = p.pack?.ml >= 1000 ? `${p.pack.ml / 1000} L` : `${p.pack?.ml} ml`;
  const pack = `${p.unitsPerCase} ${t(`pack.${p.pack?.type}`) === `pack.${p.pack?.type}` ? t('pack.units') : t(`pack.${p.pack?.type}`)} × ${size}${p.returnable ? ` · ${t('book.returnable')}` : ''}`;
  const search = [p.name, p.sku, p.category, label('cat', p.category), p.flavour, p.pack?.type, `${p.pack?.ml}`].filter(Boolean).join(' ').toLowerCase();
  const chips = schemes.schemesForSku(p.sku, today).map((s) => {
    const st = schemes.statusFor(s, o, today, pastAndDemo);
    if (st.kind === 'not') return html`<span class="scheme-chip is-off">${s.name} · ${lcFirst(st.reason)}</span>`;
    if (st.kind === 'used') {
      return html`<span class="scheme-chip is-used">${icon('tag')}${t('book.capUsed', { chip: schemes.chipText(s), cap: st.cap, month: fmt.monthName(today) })}</span>`;
    }
    const n = schemes.quickAdd(s);
    return html`<button type="button" class="scheme-chip is-add" data-quick="${n}" data-scheme="${s.id}" aria-label="${t('book.chipAdd', { n, unit, name: p.name, scheme: s.name })}">${icon('tag')}<span>${schemes.chipText(s)}</span><span class="chip-plus" aria-hidden="true">+${n}</span></button>`;
  });

  return html`<li class="sku" data-sku="${p.sku}" data-category="${p.category}" data-search="${search}">
    <div class="sku-text">
      <p class="sku-name">${p.name}</p>
      <p class="sku-pack">${pack}</p>
      <p class="sku-rate"><strong>${t('book.rate', { rate: fmt.rupees(p.ptrPerCase), unit })}</strong>${p.returnable ? t('book.deposit') : ''} · ${t('book.mrp', { mrp: fmt.rupees(p.mrpPerUnit) })}</p>
    </div>
    <div class="stepper">
      <button type="button" class="step" data-step="-1" aria-label="${t('book.fewer', { unit, name: p.name })}">−</button>
      <input class="qty" type="text" inputmode="numeric" pattern="[0-9]*" value="0" aria-label="${t('book.qty', { unit, name: p.name })}" autocomplete="off">
      <button type="button" class="step" data-step="1" aria-label="${t('book.more', { unit, name: p.name })}">+</button>
    </div>
    <p class="qty-hint" data-qty-hint role="status" hidden></p>
    ${chips.length ? html`<div class="sku-chips">${chips}</div>` : ''}
    ${slot('sku-hint', { tag: 'div', attrs: { 'data-sku': p.sku } })}
  </li>`;
}

return { render };
})();

/* ==================== js/screens/review.js ==================== */
modules['screens/review'] = (() => {
// Order review: lines, free cases, discounts, totals; edit or submit.

const { app, router } = modules['app'];
const data = modules['data'];
const orders = modules['orders'];
const schemes = modules['schemes'];
const { cart } = modules['cart'];
const fmt = modules['format'];
const { t, label } = modules['i18n'];
const { html, mount, fresh, icon, appBar, pill, tierBadge, slot, emptyState, toast } = modules['ui'];

function render(root, { id }) {
  const o = data.outlet(id);
  let unsubscribe = null;

  const draw = () => {
    const view = fresh(root);
    if (!o) {
      mount(view, html`${appBar({ title: t('review.title'), back: '#/outlets' })}
        <div class="page">${emptyState({ icon: 'store', title: t('outlet.notFound'), body: t('outlet.notFoundBody', { id: id ?? '' }), action: html`<a class="btn btn-primary" href="#/outlets">${t('outlet.openList')}</a>` })}</div>`);
      return;
    }
    if (cart.outletId !== o.id || cart.isEmpty()) {
      mount(view, html`${appBar({ title: t('review.title'), sub: o.name, back: `#/outlet/${o.id}` })}
        <div class="page">${emptyState({ icon: 'box', title: t('review.nothing'), body: t('review.nothingBody', { name: o.name }), action: html`<a class="btn btn-primary" href="#/book/${o.id}">${t('review.goBook')}</a>` })}</div>`);
      return;
    }
    drawReview(view, o);
  };

  function drawReview(view, o) {
    const today = data.demoDate();
    const cfg = data.config();
    const pastAndDemo = orders.allOrdersFor(o.id);
    const p = schemes.price(cart.lines(), o, today, pastAndDemo);
    const delivery = fmt.addDays(today, cfg.distributor?.deliveryLeadDays ?? 1);
    const notes = schemeNotes(p);

    mount(view, html`
      ${appBar({ title: t('review.title'), sub: o.name, back: `#/book/${o.id}` })}
      <div class="page">
        <section class="card review-head">
          <p class="review-outlet">${o.name}</p>
          <p class="muted">${label('area', o.area)} · ${label('ch', o.channel)}</p>
          <div class="row-tags">${tierBadge(o)}${pill(t('review.delivery', { date: fmt.shortDate(delivery), rel: fmt.relative(delivery, today) }), 'info', 'truck')}</div>
        </section>

        <section class="card">
          <h2 class="card-title">${icon('box')}<span>${t('n.line', { n: p.lines.filter((l) => l.cases).length })}</span></h2>
          <ul class="lines">${p.lines.map((l) => html`<li class="line">
            ${l.cases ? html`<div class="line-main">
              <p class="line-name">${l.product.name}</p>
              <p class="line-qty">${t('review.qtyRate', { qty: fmt.unitsText(l.cases, l.product.caseLabel), rate: fmt.rupees(l.rate) })}</p>
            </div>
            <p class="line-value num">${fmt.rupees(l.gross)}</p>` : ''}
            ${l.freeCases ? html`<p class="line-free">${icon('check')}<span>${t('review.free', { n: l.freeCases, name: l.product.name })}</span></p>` : ''}
          </li>`)}</ul>
          <a class="btn btn-ghost btn-block" href="#/book/${o.id}">${t('review.edit')}</a>
        </section>

        ${notes.length ? html`<section class="card">
          <h2 class="card-title">${icon('tag')}<span>${t('review.schemes')}</span></h2>
          <ul class="scheme-notes">${notes}</ul>
        </section>` : ''}

        <section class="card">
          <h2 class="card-title">${icon('wallet')}<span>${t('review.totals')}</span></h2>
          <dl class="kv totals">
            <div><dt>${t('review.gross')}</dt><dd>${fmt.rupees(p.gross)}</dd></div>
            ${p.discount ? html`<div><dt>${t('review.discounts')}</dt><dd>${fmt.rupees(-p.discount)}</dd></div>` : ''}
            <div class="kv-total"><dt>${t('review.net')}</dt><dd>${fmt.rupees(p.net)}</dd></div>
            <div><dt>${t('review.totalCases')}</dt><dd>${fmt.num(p.totalCases)}${p.freeCases ? html` <span class="muted">${t('review.paidFree', { paid: fmt.num(p.paidCases), free: fmt.num(p.freeCases) })}</span>` : ''}</dd></div>
          </dl>
        </section>

        ${slot('review-check')}
      </div>
      <div class="bottom-bar bottom-bar-split">
        <a class="btn btn-secondary" href="#/book/${o.id}">${t('review.editShort')}</a>
        <button type="button" class="btn btn-primary" data-submit>${t('review.submit', { net: fmt.rupees(p.net) })}</button>
      </div>`);

    let busy = false;
    view.querySelector('[data-submit]').addEventListener('click', (e) => {
      if (busy) return;          // a double tap saves once
      busy = true;
      e.currentTarget.disabled = true;
      e.currentTarget.textContent = t('review.saving');
      unsubscribe?.();
      unsubscribe = null;
      const final = schemes.price(cart.lines(), o, today, orders.allOrdersFor(o.id));
      const saved = orders.saveOrder({
        outletId: o.id,
        lines: final.lines.map((l) => ({ sku: l.sku, cases: l.cases, freeCases: l.freeCases })),
        grossValue: final.gross,
        discountValue: final.discount,
        netValue: final.net,
        schemeIds: final.schemeIds,
      });
      cart.clear();
      toast(t('review.toast', { name: o.name }));
      router.go(`#/saved/${saved.id}`, { replace: true });
    });
  }

  draw();
  // If anything (e.g. the feature) edits the cart while review is open, redraw and let slots refill.
  unsubscribe = cart.subscribe(() => {
    draw();
    app.emit('screen:rendered', { screen: 'review', outletId: id, root });
  });
  return () => unsubscribe?.();
}

/** Plain lines about each scheme that touches the cart. No "add N more" nudges here. */
function schemeNotes(p) {
  return p.schemes.map((x) => {
    const s = x.scheme;
    if (!x.eligible) {
      if (s.type === 'first-order') return '';
      return html`<li class="scheme-note is-off">${icon('info')}<span>${t('rn.off', { name: s.name, reason: x.reason })}</span></li>`;
    }
    if (x.kind === 'free') {
      if (x.granted > 0) {
        const sku = data.product(x.freeSku)?.name ?? x.freeSku;
        const text = t('rn.free', { name: s.name, free: t('n.freeCase', { n: x.granted }), sku })
          + (x.cap ? t('rn.cap', { used: x.usedAfter, cap: x.cap }) : '') + (x.capHit ? t('rn.capReached') : '');
        return html`<li class="scheme-note is-on">${icon('check')}<span>${text}</span></li>`;
      }
      if (x.cap && x.usedBefore >= x.cap) {
        return html`<li class="scheme-note is-warn">${icon('alert')}<span>${t('rn.capFull', { name: s.name, used: x.usedBefore, cap: x.cap })}</span></li>`;
      }
      return '';
    }
    if (x.amount > 0) {
      const key = s.type === 'first-order' ? 'rn.pctFirst' : 'rn.pct';
      return html`<li class="scheme-note is-on">${icon('check')}<span>${t(key, { name: s.name, pct: s.rule.percent, amt: fmt.rupees(-x.amount) })}</span></li>`;
    }
    return '';
  }).filter(Boolean);
}

return { render };
})();

modules['feature/talking-points'] = (() => {
// Talking points: short, data-backed things the rep can raise with the owner at this visit —
// the closure or bookings ahead, the weather, what sold last year in these same days,
// schemes worth using, what's coming up locally, stock limits, the cooler — plus a few
// points "for you only" (dues, cash terms) kept apart because the owner may see the screen.
//
// Fills two feature slots: `outlet-brief` on Outlet details (the card) and `booking-live`
// on Order booking (a button that opens the same points in a sheet).
// Everything is computed from the data and the demo date; nothing is typed in.

const { app } = modules['app'];
const data = modules['data'];
const orders = modules['orders'];
const schemes = modules['schemes'];
const fmt = modules['format'];
const { t } = modules['i18n'];
const { html, mount, icon, openSheet } = modules['ui'];

const VISIBLE = 3;          // points shown before "Show more"
const MAX_POINTS = 6;       // one visit, a few points: the most useful first
const HORIZON_DAYS = 21;    // how far ahead dated events are mentioned
const RECENT_DAYS = 84;     // what "the outlet buys" means: ordered in the last 12 weeks

function install() {
  app.on('screen:rendered', ({ screen, outletId, root }) => {
    const o = outletId ? data.outlet(outletId) : null;
    if (!o) return;
    if (screen === 'outlet') fillCard(root, o);
    if (screen === 'book') fillBookingButton(root, o);
  });
}

// ---- rendering -------------------------------------------------------------

function fillCard(root, o) {
  const slot = root.querySelector('[data-slot="outlet-brief"]');
  if (!slot) return;
  const P = pointsFor(o);
  mount(slot, html`<section class="tp" aria-labelledby="tp-title">
    <header class="tp-head">
      <span class="tp-mark">${icon('chat')}</span>
      <div>
        <h2 class="tp-title" id="tp-title">${t('tp.title')}</h2>
        <p class="tp-sub">${t('tp.sub', { date: fmt.shortDate(P.cover.nextVisit) })}</p>
      </div>
    </header>
    ${listHtml(P)}
  </section>`);
  slot.hidden = false;
  slot.addEventListener('click', (e) => {
    const more = e.target.closest('[data-tp-more]');
    if (!more) return;
    const open = slot.querySelector('.tp-list').classList.toggle('is-open');
    more.textContent = open ? t('tp.less') : t('tp.more', { n: Number(more.dataset.n) });
    more.setAttribute('aria-expanded', String(open));
  });
}

function fillBookingButton(root, o) {
  const slot = root.querySelector('[data-slot="booking-live"]');
  if (!slot) return;
  const P = pointsFor(o);
  const n = P.owner.length + P.rep.length;
  if (!n) return;
  mount(slot, html`<button type="button" class="tp-open" data-tp-open>
    <span class="tp-open-mark">${icon('chat')}</span>
    <span>${t('tp.open', { n: P.owner.length })}</span>
    ${icon('chevron', 'tp-open-chev')}
  </button>`);
  slot.hidden = false;
  slot.querySelector('[data-tp-open]').addEventListener('click', () => openSheet({
    title: t('tp.title'),
    body: html`<p class="tp-sub">${t('tp.sub', { date: fmt.shortDate(P.cover.nextVisit) })}</p>${listHtml(P, { all: true })}`,
    actions: [{ key: 'close', label: t('common.close'), tone: 'secondary' }],
    dismissKey: 'close',
  }));
}

function listHtml(P, { all = false } = {}) {
  const extra = all ? 0 : Math.max(0, P.owner.length - VISIBLE);
  return html`
    ${P.owner.length
      ? html`<ol class="tp-list">${P.owner.map((p, i) => itemHtml(p, !all && i >= VISIBLE))}</ol>`
      : html`<p class="tp-empty">${t('tp.none')}</p>`}
    ${extra ? html`<button type="button" class="tp-more" data-tp-more data-n="${extra}" aria-expanded="false">${t('tp.more', { n: extra })}</button>` : ''}
    ${P.rep.length ? html`<details class="tp-rep">
      <summary>${icon('lock')}<span class="tp-rep-title">${t('tp.forYou')}</span><span class="tp-rep-note">${t('tp.forYouNote')}</span>${icon('chevron', 'collapse-chev')}</summary>
      <ol class="tp-list is-open">${P.rep.map((p) => itemHtml(p))}</ol>
    </details>` : ''}`;
}

function itemHtml(p, extra = false) {
  return html`<li class="tp-item tone-${p.tone} ${extra ? 'tp-extra' : ''}">
    <span class="tp-icon">${icon(p.icon)}</span>
    <div class="tp-text">
      <p class="tp-cat">${t(`tp.cat.${p.cat}`)}</p>
      <p class="tp-point">${p.title}</p>
      ${p.body ? html`<p class="tp-detail">${p.body}</p>` : ''}
      <p class="tp-src">${p.source}${p.href ? html` · <a href="${p.href}">${t('tp.seeScheme')}</a>` : ''}</p>
    </div>
  </li>`;
}

// ---- the points ------------------------------------------------------------

/** → { owner: [point], rep: [point], cover: { today, delivery, nextVisit } }, most useful first. */
function pointsFor(o) {
  const today = data.demoDate();
  const cfg = data.config();
  const nextVisit = data.visits(o.id)?.nextVisitAfterToday ?? fmt.addDays(today, 7);
  const delivery = fmt.addDays(today, cfg.distributor?.deliveryLeadDays ?? 1);
  const cover = { today, delivery, nextVisit };
  const all = orders.allOrdersFor(o.id);
  const past = all.filter((x) => x.source !== 'demo' && x.date < today);
  const bought = boughtSkus(past, cover);
  const cal = data.calendar() ?? {};
  const closure = (o.closures ?? []).filter((c) => c.to >= today && c.from <= nextVisit).sort((a, b) => (a.from < b.from ? -1 : 1))[0];

  // Most useful first; schemes, stock and events take turns so the top few cover different things.
  // Before a closure, don't talk the owner into buying more: no scheme or stock pushes.
  const [sch = [], stk = [], evt = []] = closure
    ? [[], [], eventPoints(o, cal, cover, true)]
    : [schemePoints(o, all, bought, cover), stockPoints(bought), eventPoints(o, cal, cover, false)];
  const owner = [
    closure && closurePoint(closure, cover),
    bookingsPoint(o, cover),
    !closure && weatherPoint(o, cal, cover),
    !closure && lastYearPoint(past, cover),
    sch[0], stk[0], evt[0],
    sch[1], stk[1], evt[1],
    peersPoint(o, past, cover),
    coolerPoint(o),
    emptiesPoint(o, bought),
  ].filter(Boolean).slice(0, MAX_POINTS);
  const rep = [paymentPoint(o)].filter(Boolean);
  return { owner, rep, cover };
}

const paidOf = (list) => list.reduce((n, x) => n + orders.paidCases(x), 0);
const inRange = (x, from, to) => x.date >= from && x.date < to;
const productName = (sku) => data.product(sku)?.name ?? sku;

/** SKUs the outlet bought in the last 12 weeks, or in the same days last year. */
function boughtSkus(past, { today, nextVisit }) {
  const from = fmt.addDays(today, -RECENT_DAYS);
  const lyFrom = fmt.addDays(today, -364);
  const lyTo = fmt.addDays(nextVisit, -364);
  const set = new Set();
  past.filter((x) => inRange(x, from, today) || inRange(x, lyFrom, lyTo))
    .forEach((x) => x.lines.forEach((l) => { if (l.cases > 0) set.add(l.sku); }));
  return set;
}

function topSkus(list, count = 2) {
  const tally = new Map();
  list.forEach((x) => x.lines.forEach((l) => tally.set(l.sku, (tally.get(l.sku) ?? 0) + (l.cases || 0))));
  return [...tally.entries()].sort((a, b) => b[1] - a[1]).slice(0, count).map(([sku]) => productName(sku));
}

const joinNames = (names) => (names.length > 1 ? `${names.slice(0, -1).join(', ')} ${t('common.and')} ${names.at(-1)}` : names[0] ?? '');

function closurePoint(c, { today, delivery }) {
  const range = fmt.dateRange(c.from, c.to, today);
  const sellingDays = fmt.daysBetween(delivery, c.from);
  return {
    cat: 'closure', icon: 'calendarX', tone: 'warn',
    title: t('tp.closure.title', { range }),
    body: c.from > today && sellingDays > 0
      ? t('tp.closure.soon', { n: sellingDays })
      : t('tp.closure.now', { date: fmt.shortDate(fmt.addDays(c.to, 1)) }),
    source: t('tp.src.calendar'),
  };
}

function bookingsPoint(o, { today, nextVisit }) {
  const list = (o.bookings ?? []).filter((b) => b.date >= today && b.date < nextVisit);
  if (!list.length) return null;
  const cases = list.reduce((n, b) => n + (b.expectedCases ?? 0), 0);
  const big = [...list].sort((a, b) => (b.expectedCases ?? 0) - (a.expectedCases ?? 0))[0];
  return {
    cat: 'bookings', icon: 'calendar', tone: 'ok',
    title: t('tp.bookings.title', { functions: t('n.function', { n: list.length }), cases: fmt.casesText(cases) }),
    body: t('tp.bookings.body', { date: fmt.shortDate(big.date), event: big.event }),
    source: t('tp.src.bookings'),
  };
}

function weatherPoint(o, cal, { today, delivery, nextVisit }) {
  const periods = (cal.forecast?.periods ?? []).filter((p) => p.from <= nextVisit && p.to >= delivery && Array.isArray(p.maxC));
  if (!periods.length) return null;
  const lo = Math.min(...periods.map((p) => p.maxC[0]));
  const hi = Math.max(...periods.map((p) => p.maxC[1] ?? p.maxC[0]));
  if (hi < 35) return null;
  const until = periods.at(-1).to < nextVisit ? periods.at(-1).to : nextVisit;
  const dry = periods.every((p) => p.rainChance === 'none');
  const onsetMd = cal.climatology?.normalOnsetPune;
  const onset = onsetMd ? fmt.date(`${today.slice(0, 4)}-${onsetMd}`, { weekday: false, year: false }) : '';
  const cold = ['bottler', 'own-fridge', 'ice-box'].includes(o.cooler?.type);
  return {
    cat: 'weather', icon: 'sun', tone: 'sun',
    title: t(dry ? 'tp.heat.title' : 'tp.heat.titleShower', { date: fmt.shortDate(until), min: lo, max: hi }),
    body: t(cold ? 'tp.heat.chilled' : 'tp.heat.takehome', { onset }),
    source: t('tp.src.forecast', { date: fmt.shortDate(cal.forecast.asOf ?? today) }),
  };
}

/** The same days last year (364 days back keeps the weekdays), against the same span just gone. */
function lastYearPoint(past, { today, nextVisit }) {
  const days = fmt.daysBetween(today, nextVisit);
  if (days <= 0) return null;
  const ly = past.filter((x) => inRange(x, fmt.addDays(today, -364), fmt.addDays(nextVisit, -364)));
  const lyCases = paidOf(ly);
  if (!lyCases) return null;
  const recent = paidOf(past.filter((x) => inRange(x, fmt.addDays(today, -days), today)));
  const skus = joinNames(topSkus(ly));
  return {
    cat: 'history', icon: 'history', tone: 'thin',
    title: t('tp.ly.title', { days, cases: fmt.casesText(lyCases) }),
    body: recent ? t('tp.ly.body', { days, recent: fmt.casesText(recent), skus }) : t('tp.ly.bodyNoRecent', { skus }),
    source: t('tp.src.orders'),
  };
}

function schemePoints(o, all, bought, { today, nextVisit }) {
  const month = fmt.monthName(today, true);
  const out = [];
  for (const s of schemes.activeSchemes(today)) {
    if (s.type === 'program') continue;
    const relevant = s.type === 'first-order' || (Array.isArray(s.skus) && s.skus.some((k) => bought.has(k)));
    if (!relevant) continue;
    const st = schemes.statusFor(s, o, today, all);
    const base = { cat: 'scheme', icon: 'tag', tone: 'info', source: t('tp.src.scheme'), href: `#/scheme/${s.id}/${o.id}` };
    const names = schemes.listNames(s.skus);
    if (st.kind === 'applicable' && s.type === 'first-order') {
      const until = fmt.addDays(o.registeredOn, s.rule?.withinDaysOfRegistration ?? 90);
      out.push({ ...base, rank: 0, title: `${s.name}: ${schemes.chipText(s)}`, body: t('tp.scheme.first', { date: fmt.shortDate(until) }) });
    } else if (st.kind === 'applicable' && s.type === 'free-goods' && st.cap) {
      const left = st.cap - st.used;
      out.push({ ...base, rank: 1, title: `${s.name}: ${schemes.chipText(s)}`,
        body: s.skus.length > 1 ? t('tp.scheme.left', { left, cap: st.cap, skus: names }) : t('tp.scheme.leftSingle', { left, cap: st.cap }) });
    } else if (st.kind === 'used' && s.validTo >= nextVisit && fmt.monthKey(nextVisit) !== fmt.monthKey(today)) {
      out.push({ ...base, rank: 2, title: t('tp.scheme.usedTitle', { name: s.name, month }),
        body: t('tp.scheme.nextMonth', { cap: st.cap, month, date: fmt.shortDate(nextVisit) }) });
    } else if (st.kind === 'applicable' && s.type === 'percent-off') {
      out.push({ ...base, rank: 3, title: `${s.name}: ${schemes.chipText(s)}`, body: t('tp.scheme.pct', { skus: names, date: fmt.shortDate(s.validTo) }) });
    } else if (st.kind === 'applicable' && s.type === 'free-goods') {
      out.push({ ...base, rank: 4, title: `${s.name}: ${schemes.chipText(s)}`, body: s.validTo ? t('tp.scheme.till', { date: fmt.shortDate(s.validTo) }) : '' });
    }
  }
  return out.sort((a, b) => a.rank - b.rank).slice(0, 2);
}

const eventApplies = (e, o) => {
  const ch = e.appliesTo?.channels ?? [];
  const tags = e.appliesTo?.tags ?? [];
  return (!ch.length || ch.includes(o.channel)) && (!tags.length || tags.some((x) => (o.tags ?? []).includes(x)));
};

function eventPoints(o, cal, { today }, hasClosure) {
  const horizon = fmt.addDays(today, HORIZON_DAYS);
  return (cal.events ?? [])
    .filter((e) => e.from <= horizon && e.to >= today && eventApplies(e, o))
    .map((e) => {
      const m = e.multiplier;
      const hi = Array.isArray(m) ? m[1] : m;
      const lo = Array.isArray(m) ? m[0] : m;
      if (hi == null) return null;
      const up = hi > 1;
      if (!up && hasClosure) return null;   // the closure point already says it
      const pct = up ? (lo !== hi ? `${Math.round((lo - 1) * 100)}–${Math.round((hi - 1) * 100)}%` : `${Math.round((hi - 1) * 100)}%`) : '';
      const when = e.from === e.to ? fmt.shortDate(e.from) : fmt.dateRange(e.from, e.to, today);
      const packs = Array.isArray(e.packs) && e.packs.length ? t('tp.event.packs', { packs: joinNames(e.packs.map(productName)) }) : '';
      return {
        cat: 'event', icon: 'calendar', tone: up ? 'ok' : 'warn',
        title: `${e.name} · ${when}`,
        body: (up ? t('tp.event.up', { pct }) : t('tp.event.down')) + packs,
        source: t('tp.src.calendar'),
        from: e.from,
      };
    })
    .filter(Boolean)
    .sort((a, b) => (a.from < b.from ? -1 : 1))
    .slice(0, 2);
}

function stockPoints(bought) {
  const report = data.stock();
  if (!report) return [];
  const asOf = fmt.shortDate(report.asOf);
  return report.items
    .filter((it) => it.status !== 'ok' && bought.has(it.sku))
    .map((it) => {
      const p = data.product(it.sku);
      if (!p) return null;
      let body = t('tp.stock.body', { date: asOf });
      if (it.status === 'out') {
        const alt = data.products().find((q) => q.sku !== p.sku && q.flavour === p.flavour && q.category === p.category && data.stockFor(q.sku)?.status === 'ok');
        if (alt) body += t('tp.stock.alt', { alt: alt.name });
      }
      return {
        cat: 'stock', icon: 'box', tone: 'warn',
        title: it.status === 'out' ? t('tp.stock.out', { sku: p.name }) : t('tp.stock.rationed', { sku: p.name, max: it.maxCasesPerOutlet }),
        body,
        source: t('tp.src.stock', { date: asOf }),
      };
    })
    .filter(Boolean);
}

/** For outlets with little history: what similar shops on the route sell this week. */
function peersPoint(o, past, { today }) {
  const recentOrders = past.filter((x) => x.date >= fmt.addDays(today, -RECENT_DAYS)).length;
  if (recentOrders >= 3) return null;
  const coolerKey = o.cooler?.type ?? 'none';
  const groups = data.peers()?.groups ?? [];
  const g = groups.find((x) => x.channel === o.channel && x.tier === o.tier && (x.cooler ?? 'none') === coolerKey)
    ?? groups.find((x) => x.channel === o.channel && x.tier === o.tier);
  if (!g) return null;
  const week = fmt.isoWeek(today);
  const rows = Object.entries(g.weeklyCasesBySku ?? {}).map(([sku, w]) => [sku, w?.[week] ?? 0]).filter((r) => r[1] > 0).sort((a, b) => b[1] - a[1]);
  const total = rows.reduce((n, r) => n + r[1], 0);
  if (!total) return null;
  return {
    cat: 'peers', icon: 'store', tone: 'thin',
    title: t('tp.peers.title', { n: total.toFixed(1) }),
    body: t('tp.peers.body', { skus: joinNames(rows.slice(0, 2).map(([sku]) => productName(sku))) }),
    source: t('tp.src.peers', { n: g.outletsInGroup }),
  };
}

function coolerPoint(o) {
  const c = o.cooler;
  if (c?.type !== 'bottler') return null;
  const a = c.lastAudit;
  if (a && (a.tempC > 6 || a.fillPct < 70)) {
    return {
      cat: 'cooler', icon: 'cooler', tone: 'warn',
      title: t('tp.cooler.fixTitle', { fill: a.fillPct, temp: a.tempC, date: fmt.shortDate(a.date) }),
      body: (a.tempC > 6 ? t('tp.cooler.warm') : t('tp.cooler.fill')) + (c.afternoonOutage ? t('tp.cooler.outage') : ''),
      source: t('tp.src.audit', { date: fmt.shortDate(a.date) }),
    };
  }
  const program = schemes.activeSchemes().find((s) => s.type === 'program' && s.requiresBottlerCooler);
  if (!program || !a?.pure) return null;
  return {
    cat: 'cooler', icon: 'cooler', tone: 'ok',
    title: t('tp.cooler.rewardTitle', { amt: schemes.payoutAmount(program) }),
    body: t('tp.cooler.rewardBody'),
    source: t('tp.src.audit', { date: fmt.shortDate(a.date) }),
    href: `#/scheme/${program.id}/${o.id}`,
  };
}

function emptiesPoint(o, bought) {
  const n = o.empties?.cratesHeld;
  const buysGlass = [...bought].some((sku) => data.product(sku)?.returnable);
  if (!n || !buysGlass) return null;
  return {
    cat: 'empties', icon: 'box', tone: 'neutral',
    title: t('tp.empties.title', { n }),
    body: t('tp.empties.body'),
    source: t('tp.src.account'),
  };
}

/** Rep only: money the owner owes, or the cash/credit split. */
function paymentPoint(o) {
  const c = o.credit ?? {};
  if ((c.overdue ?? 0) > 0) {
    return {
      cat: 'payment', icon: 'wallet', tone: 'warn',
      title: t('tp.pay.overdue', { amt: fmt.rupees(c.overdue) }),
      body: t('tp.pay.overdueBody', { left: fmt.rupees(Math.max(0, (c.limit ?? 0) - (c.outstanding ?? 0))), date: c.lastPaymentDate ? fmt.shortDate(c.lastPaymentDate) : t('kv.noneYet') }),
      source: t('tp.src.account'),
    };
  }
  if (c.paymentMode === 'cash-and-credit') {
    return {
      cat: 'payment', icon: 'wallet', tone: 'neutral',
      title: t('tp.pay.cash', { limit: fmt.rupees(c.limit ?? 0) }),
      body: t('tp.pay.cashBody'),
      source: t('tp.src.account'),
    };
  }
  return null;
}

return { install, pointsFor };
})();

/* ==================== js/main.js ==================== */
modules['main'] = (() => {
// Boot, hash router, demo bar, language and "Reset demo".
// Routes: #/login · #/home · #/outlets · #/outlet/OUT-01 · #/book/OUT-01 · #/review/OUT-01
//         #/saved/DEMO-01-1 · #/scheme/SCH-SS26/OUT-01

const { app, session, nav, router } = modules['app'];
const data = modules['data'];
const { cart } = modules['cart'];
const orders = modules['orders'];
const schemes = modules['schemes'];
const fmt = modules['format'];
const i18n = modules['i18n'];
const { html, mount, icon, openSheet, closeSheets, toast } = modules['ui'];

const login = modules['screens/login'];
const home = modules['screens/home'];
const outlets = modules['screens/outlets'];
const outlet = modules['screens/outlet'];
const book = modules['screens/book'];
const review = modules['screens/review'];
const saved = modules['screens/saved'];
const scheme = modules['screens/scheme'];
const talkingPoints = modules['feature/talking-points'];

const { t, label } = i18n;
const SCREENS = { login, home, outlets, outlet, book, review, saved, scheme };
const screenEl = document.getElementById('screen');
let cleanup = null;

function parseHash() {
  const [name = '', id = null, sub = null] = router.current().replace(/^#\/?/, '').split('/').map(decodeURIComponent);
  return { name, id, sub };
}

function redirect(hash) {
  router.go(hash, { replace: true });
}

function renderRoute() {
  const { name, id, sub } = parseHash();
  const signedIn = Boolean(session.user());
  if (!signedIn && name !== 'login') return redirect('#/login');
  if (signedIn && (name === 'login' || !SCREENS[name])) return redirect('#/home');

  closeSheets();
  if (typeof cleanup === 'function') {
    try { cleanup(); } catch (err) { console.error(err); }
  }
  if (name === 'home' || name === 'outlets') nav.hub = `#/${name}`;

  screenEl.dataset.screen = name;
  cleanup = SCREENS[name].render(screenEl, { id, sub }) ?? null;
  window.scrollTo(0, 0);
  screenEl.focus({ preventScroll: true });
  const outletId = name === 'scheme' ? sub : name === 'saved' ? null : id;
  app.emit('screen:rendered', { screen: name, outletId, root: screenEl });
}

function renderDemoBar() {
  const bar = document.getElementById('demo-bar');
  const cfg = data.config();
  mount(bar, html`
    <p class="demo-bar-text">
      <span class="demo-bar-tag">${t('demo.tag')}</span>
      <span class="demo-bar-date">${fmt.date(cfg.demoDate)}</span>
      <span class="demo-bar-region">· ${label('region', cfg.region.name)}</span>
      ${data.isStub() ? html`<span class="demo-bar-stub" title="data/ still holds the stub dataset">${t('demo.stub')}</span>` : ''}
    </p>
    <button type="button" class="demo-bar-reset" data-reset>${t('demo.reset')}</button>`);
  bar.hidden = false;
  bar.querySelector('[data-reset]').addEventListener('click', confirmReset);
}

async function confirmReset() {
  const n = orders.demoOrders().length;
  const key = await openSheet({
    title: t('demo.resetTitle'),
    body: html`<p>${n ? t('demo.resetBody', { orders: t('n.order', { n }) }) : t('demo.resetBodyNone')}</p>
      <p class="muted">${t('demo.resetNote')}</p>`,
    actions: [
      { key: 'reset', label: t('demo.reset'), tone: 'danger' },
      { key: 'cancel', label: t('common.cancel'), tone: 'secondary' },
    ],
    dismissKey: 'cancel',
  });
  if (key !== 'reset') return;
  orders.resetDemo();
  cart.clear();
  session.signOut();
  redirect('#/login');
  toast(t('demo.resetDone'));
}

async function chooseLanguage() {
  const key = await openSheet({
    title: t('common.chooseLanguage'),
    body: '',
    actions: i18n.LANGS.map((l) => ({ key: l.code, label: l.code === i18n.lang() ? `✓ ${l.label}` : l.label, tone: l.code === i18n.lang() ? 'primary' : 'secondary' })),
    dismissKey: null,
  });
  if (key) i18n.setLang(key);
}

function renderFatal(err) {
  mount(screenEl, html`<div class="view"><div class="page fatal">
    <div class="card">
      <p class="fatal-icon">${icon('alert')}</p>
      <h1 class="display">${t(data.SERVED ? 'fatal.served' : 'fatal.local')}</h1>
      ${err ? html`<p><code>${err.message ?? String(err)}</code></p>` : ''}
      <p>${t(data.SERVED ? 'fatal.servedHelp' : 'fatal.localHelp')}</p>
    </div>
  </div></div>`);
}

async function boot() {
  i18n.applyLang();
  // Opened without a server, only the single-file build works: it carries the data inside.
  if (!data.SERVED && !data.hasEmbedded()) return renderFatal();
  try {
    await data.loadData();
  } catch (err) {
    console.error(err);
    return renderFatal(err);
  }
  renderDemoBar();

  // Every cart change is logged, so the subscribe hook can be checked in the console.
  cart.subscribe(({ type, sku, cases, cart: c }) =>
    console.log(`[cart] ${type}${sku ? ` ${sku} → ${cases}` : ''} · ${c.totalCases} cases · ${c.outletId ?? 'no outlet'}`));

  // Language: the app-bar button opens a sheet; the Login screen has a segmented control.
  document.addEventListener('click', (e) => {
    if (e.target.closest('[data-lang-open]')) chooseLanguage();
    const pick = e.target.closest('[data-lang]');
    if (pick) i18n.setLang(pick.dataset.lang);
  });
  app.on('lang:changed', () => {
    renderDemoBar();
    renderRoute();
  });

  talkingPoints.install();

  // Handles for feature code and the console.
  window.gtApp = { app, router, cart, data, orders, schemes, fmt, i18n, talkingPoints };

  router.start(renderRoute);
  if (!location.hash) redirect(session.user() ? '#/home' : '#/login');
  else renderRoute();
}

boot();

return {  };
})();
</script>
