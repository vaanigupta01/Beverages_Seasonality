    </div>
    ${action ?? ''}
    ${langButton()}
  </header>`;
}

/** Opens the language sheet (handled in main.js). Shows the current language's short name. */
function langButton() {
  const current = LANGS.find((l) => l.code === lang());
  return html`<button type="button" class="lang-btn" data-lang-open aria-label="${t('common.language')}: ${current.label}">${icon('globe')}<span>${current.short}</span></button>`;
}

/** English · मराठी · हिंदी as a segmented control (Login). */
function langSwitch() {
  return html`<div class="lang-seg" role="group" aria-label="${t('common.language')}">
    ${LANGS.map((l) => html`<button type="button" class="lang-seg-btn" data-lang="${l.code}" aria-pressed="${String(l.code === lang())}">${l.label}</button>`)}
  </div>`;
}

/** Pill with a tone: info · caution · neutral · ok · thin · warn. Colour is never alone: text (and often an icon) too. */
const pill = (text, tone = 'neutral', iconName = null) =>
  html`<span class="pill pill-${tone}">${iconName ? icon(iconName) : ''}<span>${text}</span></span>`;

const tierBadge = (outlet, { visits = false } = {}) =>
  html`<span class="pill pill-tier" data-tier="${outlet.tier}"><span class="tier-gem" aria-hidden="true"></span><span>${label('tier', outlet.tier)}${visits && outlet.visitsPerMonth ? ` · ${t('n.visitsMonth', { n: outlet.visitsPerMonth })}` : ''}</span></span>`;

/** Muted demo aid so the panel can pick outlets on purpose. */
function personaTag(outlet) {
  const p = outlet.persona;
  if (!p) return '';
  return html`<span class="persona-tag" title="${t('persona.tip')}">${t('persona.tag', { no: String(p.no).padStart(2, '0'), label: String(p.label).replace(/^The /, '') })}</span>`;
}

/**
 * A scheme's status for an outlet, from schemes.statusFor(). Each state looks different:
 * Enrolled = solid green (already receiving it) · Applicable = blue tag (can be used) ·
 * used up this month = grey · not applicable = dashed, with the reason.
 */
function schemePill(st) {
  switch (st.kind) {
    case 'enrolled': return html`<span class="pill pill-enrolled">${icon('check')}<span>${t('scheme.enrolled')}</span></span>`;
    case 'applicable': return html`<span class="pill pill-applicable">${icon('tag')}<span>${t('scheme.applicable')}</span></span>`;
    case 'used': return html`<span class="pill pill-used"><span>${t('scheme.usedUp', { used: st.used, cap: st.cap })}</span></span>`;
    default: return html`<span class="pill pill-off"><span>${st.reason}</span></span>`;
  }
}

const emptyState = ({ icon: name = 'box', title, body = '', action = null, compact = false }) =>
  html`<div class="empty ${compact ? 'is-compact' : ''}">
    <span class="empty-icon">${icon(name)}</span>
    <p class="empty-title">${title}</p>
    ${body ? html`<p class="empty-body">${body}</p>` : ''}
    ${action ?? ''}
  </div>`;

/**
 * A place for the feature. Empty and hidden until feature code fills it on 'screen:rendered'.
 * Names: landing-top, route-badge, outlet-brief, booking-live, sku-hint, review-check.
 */
function slot(name, { tag = 'section', attrs = {} } = {}) {
  const extra = Object.entries(attrs).map(([k, v]) => ` ${esc(k)}="${esc(v)}"`).join('');
  return raw(`<!-- FEATURE SLOT: ${esc(name)} --><${tag} class="slot" data-slot="${esc(name)}"${extra} hidden></${tag}>`);
}

// ---- bottom sheet (in-app confirmations, never browser pop-ups) -------------
let closeActive = null;

/**
 * openSheet({ title, body, actions: [{ key, label, tone }], dismissKey, onOpen(sheetEl) }) → Promise<key>
 * onOpen runs once the sheet is in the page (e.g. to focus a text box or wire a voice button).
 * Backdrop tap and Escape resolve with `dismissKey`. A route change resolves with 'route-change'.
 */
function openSheet({ title, body, actions, dismissKey = null, onOpen = null }) {
  closeSheets();
  return new Promise((resolve) => {
    const prevFocus = document.activeElement;
    const wrap = document.createElement('div');
    wrap.className = 'sheet-wrap';
    wrap.innerHTML = String(html`<div class="sheet-backdrop" data-dismiss></div>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
        <span class="sheet-handle" aria-hidden="true"></span>
        <h2 class="sheet-title" id="sheet-title">${title}</h2>
        <div class="sheet-body">${body}</div>
        <div class="sheet-actions">${actions.map((a) => html`<button type="button" class="btn btn-block btn-${a.tone ?? 'secondary'}" data-key="${a.key}">${a.label}</button>`)}</div>
      </div>`);

    const buttons = () => [...wrap.querySelectorAll('button')];
    const onKey = (e) => {
      if (e.key === 'Escape') close(dismissKey);
      if (e.key === 'Tab') {
        const list = buttons();
        const i = list.indexOf(document.activeElement);
        const next = e.shiftKey ? (i <= 0 ? list.length - 1 : i - 1) : (i + 1) % list.length;
        list[next]?.focus();
        e.preventDefault();
      }
    };
    function close(key) {
      if (closeActive !== close) return;
      closeActive = null;
      document.removeEventListener('keydown', onKey);
      document.body.classList.remove('has-sheet');
      wrap.classList.add('is-leaving');
      setTimeout(() => wrap.remove(), 160);
      if (key !== 'route-change') prevFocus?.focus?.({ preventScroll: true });
      resolve(key);
    }
    wrap.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-key]');
      if (btn) close(btn.dataset.key);
      else if (e.target.closest('[data-dismiss]')) close(dismissKey);
    });

    closeActive = close;
    document.addEventListener('keydown', onKey);
    document.body.append(wrap);
    document.body.classList.add('has-sheet');
    if (onOpen) onOpen(wrap.querySelector('.sheet'));
    else requestAnimationFrame(() => buttons()[0]?.focus());
  });
}

function closeSheets() {
  closeActive?.('route-change');
}

// ---- toast ----------------------------------------------------------------
let toastTimer = null;

function toast(message, iconName = 'check') {
  const el = document.getElementById('toast');
  if (!el) return;
  el.innerHTML = String(html`${icon(iconName)}<span>${message}</span>`);
  el.hidden = false;
  requestAnimationFrame(() => el.classList.add('is-in'));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    el.classList.remove('is-in');
    toastTimer = setTimeout(() => { el.hidden = true; }, 220);
  }, 3200);
}

return { esc, raw, html, mount, fresh, icon, appBar, langButton, langSwitch, pill, tierBadge, personaTag, schemePill, emptyState, slot, openSheet, closeSheets, toast };
})();

    input: form.elements[name],
    error: view.querySelector(`#err-${name}`),

  const check = ({ input, error }) => {
    const ok = input.value.trim() !== '';
    error.hidden = ok;

  fields.forEach((f) => f.input.addEventListener('input', () => { if (!f.error.hidden) check(f); }));

    if (firstBad) return firstBad.input.focus();
    session.signIn(fields[0].input.value.trim());
    router.go('#/home');

    const cases = fmt.casesText(saved.reduce((n, o) => n + orders.paidCases(o), 0));

    status = pill(saved.length > 1 ? t('status.savedN', { n: saved.length, cases, value }) : t('status.saved', { cases, value }), 'ok', 'check');
  } else if (inProgress) {
    status = pill(t('status.inProgress', { cases: fmt.casesText(cart.totalCases()) }), 'caution', 'note');
  } else {
    status = pill(t('status.toVisit'), 'neutral');
  }

  return html`<li>
    <a class="row route-row ${saved.length ? 'is-done' : ''}" href="#/outlet/${outlet.id}">
      <span class="route-stop" aria-hidden="true">${saved.length ? icon('check') : stop}</span>
      <span class="row-main">
        <span class="row-title">${outlet.name}</span>
        <span class="row-meta">${label('area', outlet.area)} · ${label('ch', outlet.channel)}</span>
        <span class="row-tags">${tierBadge(outlet)}${status}</span>
        ${slot('route-badge', { tag: 'div', attrs: { 'data-outlet-id': outlet.id } })}
      </span>
      ${icon('chevron', 'row-chev')}
    </a>
  </li>`;
}

return { render };
})();

modules['screens/outlets'] = (() => {
// Outlet list: search plus filter chips (All · Today's route · by channel).

const data = modules['data'];
const orders = modules['orders'];
const { t, label } = modules['i18n'];
const { html, mount, fresh, icon, appBar, pill, tierBadge, personaTag, emptyState } = modules['ui'];

// Kept while the app is open, so coming back restores the list as the rep left it.
let query = '';
let filter = 'all';

function render(root) {
  const view = fresh(root);
  const today = data.demoDate();
  const all = data.outlets();
  const onRoute = new Set(data.route().map((o) => o.id));
  const channels = [...new Set(all.map((o) => o.channel))];
  const filters = [
    { key: 'all', label: t('outlets.all'), test: () => true },
    { key: 'route', label: t('outlets.route'), test: (o) => onRoute.has(o.id) },
    ...channels.map((ch) => ({ key: `ch:${ch}`, label: label('ch', ch), test: (o) => o.channel === ch })),
  ];
  if (!filters.some((f) => f.key === filter)) filter = 'all';

  mount(view, html`
    ${appBar({ title: t('outlets.title'), back: '#/home' })}
    <div class="toolbar">
      <div class="search">
        ${icon('search')}
        <input class="search-input" type="search" data-q value="${query}" placeholder="${t('outlets.search')}" aria-label="${t('outlets.searchLabel')}" autocomplete="off" enterkeyhint="search">
        <button type="button" class="search-clear" data-clear ${query ? '' : 'hidden'}>${t('common.clear')}</button>
      </div>
      <div class="chips" role="group" aria-label="${t('outlets.filters')}">
        ${filters.map((f) => html`<button type="button" class="chip" data-filter="${f.key}" aria-pressed="${String(f.key === filter)}">${f.label}<span class="chip-count">${all.filter(f.test).length}</span></button>`)}
      </div>
    </div>
    <div class="page">
      <p class="list-count" data-count aria-live="polite"></p>
      <ul class="list outlet-list">${all.map((o) => row(o, onRoute.has(o.id), today))}</ul>
      <div data-empty></div>
    </div>`);

  const input = view.querySelector('[data-q]');
  const clearBtn = view.querySelector('[data-clear]');
  const items = [...view.querySelectorAll('[data-outlet]')];
  const count = view.querySelector('[data-count]');
  const empty = view.querySelector('[data-empty]');

  function apply() {
    query = input.value;
    clearBtn.hidden = !query;
    const tokens = query.trim().toLowerCase().split(/\s+/).filter(Boolean);
    const test = filters.find((f) => f.key === filter).test;
    let shown = 0;
    items.forEach((li) => {
      const o = data.outlet(li.dataset.outlet);
      const hit = test(o) && tokens.every((tk) => li.dataset.search.includes(tk));
      li.hidden = !hit;
      if (hit) shown += 1;
    });
    const total = t('n.outlet', { n: all.length });
    count.textContent = shown === all.length ? total : t('outlets.count', { shown, total });
    count.hidden = shown === 0;
    if (shown) {
      empty.replaceChildren();
    } else if (query.trim()) {
      mount(empty, emptyState({
        icon: 'search',
        title: t('outlets.noMatch', { q: query.trim() }),
        body: filter === 'all' ? t('outlets.noMatchAll') : t('outlets.noMatchFilter'),
        action: html`<button type="button" class="btn btn-secondary" data-clear>${t('outlets.clearSearch')}</button>`,
      }));
    } else {
      mount(empty, emptyState({
        icon: 'store',
        title: t('outlets.noneInFilter'),
        action: html`<button type="button" class="btn btn-secondary" data-filter="all">${t('outlets.showAll')}</button>`,
      }));
    }
  }

  input.addEventListener('input', apply);
  view.addEventListener('click', (e) => {
    const chip = e.target.closest('[data-filter]');
    if (chip) {
      filter = chip.dataset.filter;
      view.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed', String(c.dataset.filter === filter)));
      apply();
      return;
    }
    if (e.target.closest('[data-clear]')) {
      input.value = '';
      apply();
      input.focus();
    }
  });
  apply();
}

function row(o, onRoute, today) {
  const saved = orders.demoOrdersOn(o.id, today);
  // Searchable in English and in the current language.
  const search = [o.name, o.area, label('area', o.area), o.address, o.channel, label('ch', o.channel), o.shopType,
    label('shop', o.shopType), o.tier, label('tier', o.tier), o.id, o.persona?.label].filter(Boolean).join(' ').toLowerCase();
  const type = o.shopType && o.shopType !== o.channel ? ` · ${label('shop', o.shopType)}` : '';
  return html`<li data-outlet="${o.id}" data-search="${search}">
    <a class="row outlet-row" href="#/outlet/${o.id}">
      <span class="row-main">
        <span class="row-title">${o.name}</span>
        <span class="row-meta">${label('area', o.area)} · ${label('ch', o.channel)}${type}</span>
        <span class="row-tags">
          ${tierBadge(o, { visits: true })}
          ${saved.length ? pill(saved.length > 1 ? t('status.savedShortN', { n: saved.length }) : t('status.savedShort'), 'ok', 'check') : ''}
          ${onRoute ? '' : pill(t('outlets.notOnRoute'), 'neutral')}
        </span>
        ${personaTag(o)}
      </span>
      ${icon('chevron', 'row-chev')}
    </a>
  </li>`;
}

return { render };
})();

/* ==================== js/feature/store.js ==================== */
modules['feature/store'] = (() => {
// What the rep records during the demo, kept in this browser only: clock-in sessions,
// outlet notes, retailer issues and which Landing alerts were already opened.
// One localStorage key; "Reset demo" clears it (with the demo orders).
//
// Times of day (clock in/out, when a note was written) use the device clock. The date
// always comes from config.demoDate, so the demo stays on Tue 28 Apr 2026.

const KEY = 'gtapp.field.v1';
const EMPTY = () => ({ clock: { sessions: [] }, notes: {}, issues: {}, seenAlerts: [] });
let memory = EMPTY();
let useMemory = false;

function read() {
  if (useMemory) return memory;
  try {
    const parsed = JSON.parse(localStorage.getItem(KEY) ?? 'null');
    return parsed ? { ...EMPTY(), ...parsed } : EMPTY();
  } catch {
    return memory;
  }
}

/** update((state) => { …mutate… }) → the saved state. */
function update(fn) {
  const state = read();
  fn(state);
  memory = state;
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch { useMemory = true; }
  return state;
}

function reset() {
  memory = EMPTY();
  useMemory = false;
  try { localStorage.removeItem(KEY); } catch { /* nothing stored */ }
}

/** "09:12" from the device clock. */
const timeNow = () => new Date().toTimeString().slice(0, 5);
const nowMs = () => Date.now();

// ---- clock in / out ----------------------------------------------------------

/** → { state: 'out'|'in'|'closed', since, sessions } for today. */
function clockState() {
  const { clock } = read();
  const open = clock.sessions.find((s) => !s.outAt);
  if (open) return { state: 'in', open, sessions: clock.sessions };
  return { state: clock.sessions.length ? 'closed' : 'out', sessions: clock.sessions };
}

const clockIn = () => update((s) => { s.clock.sessions.push({ inAt: nowMs(), inTime: timeNow(), outAt: null, outTime: null }); });
const clockOut = () => update((s) => {
  const open = s.clock.sessions.find((x) => !x.outAt);
  if (open) { open.outAt = nowMs(); open.outTime = timeNow(); }
});

/** Minutes on duty today, counting an open session up to now. */
const dutyMinutes = () => clockState().sessions
  .reduce((n, x) => n + Math.max(0, Math.round(((x.outAt ?? nowMs()) - x.inAt) / 60000)), 0);

// ---- notes and issues ------------------------------------------------------------

const notesFor = (outletId) => read().notes[outletId] ?? [];
const addNote = (outletId, text, via) => update((s) => {
  (s.notes[outletId] ??= []).unshift({ at: nowMs(), time: timeNow(), text, via });
});

const issuesFor = (outletId) => read().issues[outletId] ?? [];
const openIssues = (outletId) => issuesFor(outletId).filter((i) => i.status === 'open');
const addIssue = (outletId, issue) => update((s) => {
  (s.issues[outletId] ??= []).unshift({ id: `ISS-${nowMs().toString(36)}`, at: nowMs(), time: timeNow(), status: 'open', ...issue });
});
const resolveIssue = (outletId, id) => update((s) => {
  const it = (s.issues[outletId] ?? []).find((x) => x.id === id);
  if (it) { it.status = 'resolved'; it.resolvedTime = timeNow(); }
});

// ---- alerts ----------------------------------------------------------------------

const seen = (id) => read().seenAlerts.includes(id);
const markSeen = (id) => update((s) => { if (!s.seenAlerts.includes(id)) s.seenAlerts.push(id); });

return { read, update, reset, timeNow, nowMs, clockState, clockIn, clockOut, dutyMinutes, notesFor, addNote, issuesFor, openIssues, addIssue, resolveIssue, seen, markSeen };
})();

/* ==================== js/feature/outlet-tools.js ==================== */
modules['feature/outlet-tools'] = (() => {
// Outlet details tools: call before the visit, add a note (typed or spoken), report a
// retailer issue, see open issues, the other rep's territory, the last order's SKUs and the
// estimated stock on hand. Notes and issues are saved in this browser (feature/store.js).

const data = modules['data'];
const fmt = modules['format'];
const { t, lang } = modules['i18n'];
const { html, icon, pill, openSheet, toast } = modules['ui'];
const store = modules['feature/store'];

// Dialling is off in the demo: the dataset has no phone numbers, and a made-up number
// could belong to a real person. With real numbers in outlets[].phone, set this to true.
const CALL_ENABLED = false;

// ---- territory ------------------------------------------------------------------

/** The other rep when this outlet isn't in the signed-in rep's territory, else null. */
function otherRep(o) {
  const rep = data.repFor(o.id);
  return rep && rep.id !== data.myRepId() ? rep : null;
}

const territoryPill = (o) => {
  const rep = otherRep(o);
  return rep ? pill(t('f.terr.pill', { name: rep.name }), 'caution', 'flag') : '';
};

/** Asks before booking at another rep's outlet → true to go ahead. */
async function confirmCrossTerritory(o) {
  const rep = otherRep(o);
  if (!rep) return true;
  const pct = data.field().crossTerritory?.incentiveCreditPct ?? 50;
  const key = await openSheet({
    title: t('f.terr.title'),
    body: html`<p class="sheet-lede">${t('f.terr.body', { name: o.name, rep: rep.name, territory: rep.territory })}</p>
      <div class="warn-box">${icon('alert')}<p>${t('f.terr.incentive', { pct })}</p></div>`,
    actions: [
      { key: 'go', label: t('f.terr.go', { pct }), tone: 'primary' },
      { key: 'back', label: t('f.terr.back'), tone: 'secondary' },
    ],
    dismissKey: 'back',
  });
  return key === 'go';
}

// ---- header actions ----------------------------------------------------------------

const actionsRow = (o, directionsHref) => html`<div class="tools" role="group" aria-label="${t('f.tools.label')}">
  <button type="button" class="tool" data-tool="call">${icon('phone')}<span>${t('f.tools.call')}</span></button>
  <button type="button" class="tool" data-tool="note">${icon('mic')}<span>${t('f.tools.note')}</span></button>
  <button type="button" class="tool" data-tool="issue">${icon('flag')}<span>${t('f.tools.issue')}</span></button>
  <a class="tool" href="${directionsHref}" target="_blank" rel="noopener noreferrer">${icon('map')}<span>${t('outlet.directions')}</span></a>
</div>`;

function issuesBadge(o) {
  const n = store.openIssues(o.id).length;
  return n ? html`<button type="button" class="issue-badge" data-tool="issues">${icon('flag')}<span>${t('f.issue.badge', { n })}</span></button>` : '';
}

/** Wires the tool buttons inside `root`. `refresh(part)` redraws 'notes' or 'issues'. */
function wire(root, o, refresh) {
  root.addEventListener('click', async (e) => {
    const btn = e.target.closest('[data-tool]');
    if (!btn) return;
    const tool = btn.dataset.tool;
    if (tool === 'call') await callSheet(o, refresh);
    if (tool === 'note' && await noteSheet(o)) refresh('notes');
    if (tool === 'issue' && await issueSheet(o)) refresh('issues');
    if (tool === 'issues') { await issuesList(o); refresh('issues'); }
  });
}

// ---- call ------------------------------------------------------------------------

/** When the rep usually checks in here, from the last visits' check-in times. */
function usualTime(o) {
  const times = (data.visits(o.id)?.visits ?? []).filter((v) => v.done && v.checkIn).slice(-6).map((v) => v.checkIn).sort();
  return times.length ? times[Math.floor(times.length / 2)] : null;
}

async function callSheet(o, refresh) {
  const v = data.visits(o.id);
  const usual = usualTime(o);
  const owner = o.owner?.name ?? t('f.call.owner');
  const key = await openSheet({
    title: t('f.call.title', { name: o.name }),
    body: html`<p class="call-num">${icon('phone')}<span>${CALL_ENABLED && o.phone ? o.phone : t('f.call.demoNumber')}</span></p>
      <ul class="prep">
        <li>${icon('store')}<span>${t('f.call.ask', { owner })}</span></li>
        ${usual ? html`<li>${icon('clock')}<span>${t('f.call.usual', { time: usual })}</span></li>` : ''}
        ${v?.nextVisitAfterToday ? html`<li>${icon('calendar')}<span>${t('f.call.next', { date: fmt.shortDate(v.nextVisitAfterToday) })}</span></li>` : ''}
      </ul>
      <p class="fine">${t('f.call.log')}</p>`,
    actions: [
      { key: 'dial', label: CALL_ENABLED && o.phone ? t('f.call.dial') : t('f.call.dialDemo'), tone: 'success' },
      { key: 'present', label: t('f.call.present'), tone: 'secondary' },
      { key: 'closed', label: t('f.call.closed'), tone: 'secondary' },
      { key: 'later', label: t('f.call.later'), tone: 'secondary' },
    ],
    dismissKey: null,
  });
  if (key === 'dial') {
    if (CALL_ENABLED && o.phone) location.href = `tel:${o.phone.replace(/\s/g, '')}`;
    else toast(t('f.call.noNumber'), 'info');
  } else if (key && key !== 'route-change') {
    store.addNote(o.id, t(`f.call.note.${key}`), 'call');
    toast(t('f.note.saved'));
    refresh('notes');
  }
}

// ---- notes (typed or spoken) ----------------------------------------------------------

const Speech = typeof window !== 'undefined' ? (window.SpeechRecognition || window.webkitSpeechRecognition) : null;
const SPEECH_LANG = { en: 'en-IN', mr: 'mr-IN', hi: 'hi-IN' };

async function noteSheet(o) {
  let via = 'typed';
  let rec = null;
  let box = null;
  const key = await openSheet({
    title: t('f.note.title'),
    body: html`<label class="field"><span class="field-label">${t('f.note.label', { name: o.name })}</span>
        <textarea class="input textarea" rows="4" data-text placeholder="${t('f.note.ph')}"></textarea></label>
      ${Speech
        ? html`<button type="button" class="btn btn-secondary btn-block mic" data-mic aria-pressed="false">${icon('mic')}<span data-mic-label>${t('f.note.speak')}</span></button>`
        : html`<p class="fine">${icon('info')} ${t('f.note.noVoice')}</p>`}`,
    actions: [
      { key: 'save', label: t('f.note.save'), tone: 'primary' },
      { key: 'cancel', label: t('common.cancel'), tone: 'secondary' },
    ],
    dismissKey: 'cancel',
    onOpen(sheet) {
      box = sheet.querySelector('[data-text]');
      box.focus();
      const mic = sheet.querySelector('[data-mic]');
      if (!mic) return;
      mic.addEventListener('click', () => {
        if (rec) { rec.stop(); return; }
        rec = new Speech();
        rec.lang = SPEECH_LANG[lang()] ?? 'en-IN';
        rec.interimResults = true;
        const before = box.value ? `${box.value.trim()} ` : '';
        rec.onresult = (ev) => {
          box.value = before + [...ev.results].map((r) => r[0].transcript).join(' ');
          via = 'voice';
        };
        const done = () => { rec = null; mic.setAttribute('aria-pressed', 'false'); mic.classList.remove('is-on'); mic.querySelector('[data-mic-label]').textContent = t('f.note.speak'); };
        rec.onend = done;
        rec.onerror = (ev) => { done(); toast(ev.error === 'not-allowed' ? t('f.note.micBlocked') : t('f.note.micFail'), 'info'); };
        rec.start();
        mic.setAttribute('aria-pressed', 'true'); mic.classList.add('is-on');
        mic.querySelector('[data-mic-label]').textContent = t('f.note.listening');
      });
    },
  });
  rec?.stop();
  const text = box?.value.trim();
  if (key !== 'save' || !text) return false;
  store.addNote(o.id, text, via);
  toast(t('f.note.saved'));
  return true;
}

/** Notes recorded today (this browser) first, then the rep's notes from past visits. */
function notesList(o, v, today) {
  const mine = store.notesFor(o.id).map((n) => ({ date: today, time: n.time, text: n.text, via: n.via, fresh: true }));
  const past = (v?.visits ?? []).filter((x) => x.note && x.date <= today).sort((a, b) => (a.date < b.date ? 1 : -1)).slice(0, 3)
    .map((x) => ({ date: x.date, text: x.note }));
  return [...mine, ...past];
}

const notesHtml = (list) => html`<ul class="notes">${list.map((n) => html`<li class="${n.fresh ? 'is-fresh' : ''}">
  <p class="note-date">${fmt.shortDate(n.date)}${n.time ? ` · ${n.time}` : ''}${n.via === 'voice' ? html` · ${icon('mic')} ${t('f.note.voice')}` : ''}${n.via === 'call' ? html` · ${icon('phone')} ${t('f.note.call')}` : ''}</p>
  <p>${n.text}</p></li>`)}</ul>`;

// ---- issues ------------------------------------------------------------------------

/** Deterministic keyword classifier: the category with the most keyword hits, else "other".
 *  Keywords include common Hinglish / Marathi spellings reps type. */
const ISSUE_CATEGORIES = {
  scheme: ['scheme', 'claim', 'free case', 'free cases', 'settle', 'settlement', 'credit note', 'offer', 'not received', 'incentive', 'shelf strip', 'purity', 'payout', 'scheme ka'],
  quality: ['quality', 'taste', 'flat', 'no gas', 'gas', 'fizz', 'expired', 'expiry', 'expire', 'smell', 'fungus', 'dirty', 'cloudy', 'bad', 'kharab', 'kharaab', 'kharab maal', 'kachra'],
  delay: ['late', 'delay', 'delayed', 'not delivered', 'no delivery', 'pending', 'did not come', "didn't come", 'not come', 'next day', 'waiting', 'nahi aaya', 'nahi aya', 'aala nahi', 'ushir', 'der'],
  missing: ['missing', 'short', 'less', 'damaged', 'damage', 'broken', 'crushed', 'leak', 'leaking', 'torn', 'dent', 'kam', 'toota', 'phuta', 'futla'],
  billing: ['bill', 'billing', 'invoice', 'price', 'rate', 'overcharged', 'charged', 'mrp', 'gst', 'amount', 'extra money', 'margin', 'paisa', 'paise', 'jyada', 'jast'],
};

function classifyIssue(text) {
  const s = ` ${String(text).toLowerCase().replace(/[^a-z0-9ऀ-ॿ' ]+/g, ' ')} `;
  let best = 'other'; let top = 0;
  for (const [cat, words] of Object.entries(ISSUE_CATEGORIES)) {
    const hits = words.reduce((n, w) => n + (s.includes(` ${w} `) || (w.includes(' ') && s.includes(w)) ? 1 : 0), 0);
    if (hits > top) { best = cat; top = hits; }
  }
  return best;
}

const CATS = [...Object.keys(ISSUE_CATEGORIES), 'other'];

async function issueSheet(o) {
  let box = null;
  let chosen = null;      // set when the rep taps a category (overrides the guess)
  const key = await openSheet({
    title: t('f.issue.title'),
    body: html`<label class="field"><span class="field-label">${t('f.issue.label', { name: o.name })}</span>
        <textarea class="input textarea" rows="4" data-text placeholder="${t('f.issue.ph')}"></textarea></label>
      <p class="field-label">${t('f.issue.category')}</p>
      <div class="cat-chips" role="group">${CATS.map((c) => html`<button type="button" class="chip" data-cat-pick="${c}" aria-pressed="${c === 'other'}">${t(`f.issue.cat.${c}`)}</button>`)}</div>
      <p class="fine">${t('f.issue.auto')}</p>`,
    actions: [
      { key: 'save', label: t('f.issue.save'), tone: 'primary' },
      { key: 'cancel', label: t('common.cancel'), tone: 'secondary' },
    ],
    dismissKey: 'cancel',
    onOpen(sheet) {
      box = sheet.querySelector('[data-text]');
      const chips = [...sheet.querySelectorAll('[data-cat-pick]')];
      const show = (c) => chips.forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.catPick === c)));
      box.addEventListener('input', () => { if (!chosen) show(classifyIssue(box.value)); });
      chips.forEach((b) => b.addEventListener('click', () => { chosen = b.dataset.catPick; show(chosen); }));
      box.focus();
    },
  });
  const text = box?.value.trim();
  if (key !== 'save' || !text) return false;
  const category = chosen ?? classifyIssue(text);
  store.addIssue(o.id, { text, category, auto: !chosen });
  toast(t('f.issue.saved', { cat: t(`f.issue.cat.${category}`) }));
  return true;
}

async function issuesList(o) {
  const list = store.issuesFor(o.id);
  await openSheet({
    title: t('f.issue.listTitle', { name: o.name }),
    body: html`<ul class="issue-list">${list.map((i) => html`<li class="${i.status === 'open' ? 'is-open' : ''}">
      <p class="issue-meta">${pill(t(`f.issue.cat.${i.category}`), i.status === 'open' ? 'caution' : 'neutral')} <span class="muted">${i.time}${i.status === 'resolved' ? ` · ${t('f.issue.resolved')}` : ''}</span></p>
      <p>${i.text}</p>
      ${i.status === 'open' ? html`<button type="button" class="btn btn-ghost btn-compact" data-resolve="${i.id}">${icon('check')}<span>${t('f.issue.resolve')}</span></button>` : ''}
    </li>`)}</ul>`,
    actions: [{ key: 'close', label: t('common.close'), tone: 'secondary' }],
    dismissKey: 'close',
    onOpen(sheet) {
      sheet.addEventListener('click', (e) => {
        const b = e.target.closest('[data-resolve]');
        if (!b) return;
        store.resolveIssue(o.id, b.dataset.resolve);
        const li = b.closest('li');
        li.classList.remove('is-open');
        b.replaceWith(document.createTextNode(t('f.issue.resolved')));
      });
    },
  });
}

// ---- last order SKUs and stock on hand ---------------------------------------------------

/** The last order's lines: SKU, quantity, pack and value at today's rate. */
function orderLinesHtml(order) {
  const rows = order.lines.filter((l) => l.cases || l.freeCases).map((l) => {
    const p = data.product(l.sku);
    return { name: p?.name ?? l.sku, pack: p ? `${p.unitsPerCase} × ${p.pack.ml >= 1000 ? `${p.pack.ml / 1000} L` : `${p.pack.ml} ml`}` : '', cases: l.cases, free: l.freeCases, value: p ? l.cases * p.ptrPerCase : null, label: p?.caseLabel };
  });
  return html`<ul class="order-lines">${rows.map((r) => html`<li>
    <span class="ol-name">${r.name}<span class="ol-pack">${r.pack}</span></span>
    <span class="ol-qty num">${fmt.unitsText(r.cases, r.label)}${r.free ? html` <span class="muted">+${r.free}</span>` : ''}</span>
    <span class="ol-val num">${r.value != null ? fmt.rupees(r.value) : ''}</span>
  </li>`)}</ul>`;
}

const CONF = { high: 'ok', medium: 'info', low: 'caution' };

function stockOnHandCard(o) {
  const rows = data.onHand(o.id).slice().sort((a, b) => (b.repCountedCases ?? b.estimatedCasesOnHand) - (a.repCountedCases ?? a.estimatedCasesOnHand));
  const total = rows.reduce((n, r) => n + (r.repCountedCases ?? r.estimatedCasesOnHand), 0);
  const counted = rows.filter((r) => r.repCountedCases != null).length;
  return html`<details class="card collapse" data-card="onhand">
    <summary class="collapse-head">
      <span class="card-title">${icon('box')}<span>${t('f.soh.title')}</span></span>
      <span class="collapse-sum">${rows.length ? t('f.soh.sum', { n: fmt.num(Math.round(total)) }) : t('f.soh.none')}</span>
      ${icon('chevron', 'collapse-chev')}
    </summary>
    <div class="collapse-body">
      ${rows.length ? html`<ul class="soh">${rows.map((r) => {
        const p = data.product(r.sku);
        const val = r.repCountedCases ?? r.estimatedCasesOnHand;
        return html`<li>
          <span class="soh-name">${p?.name ?? r.sku}<span class="soh-meta">${t('f.soh.delivered', { n: r.lastDeliveredCases, date: fmt.shortDate(r.lastDeliveredOn) })}</span></span>
          <span class="soh-val"><span class="num">~${fmt.num(Math.round(val * 10) / 10)}</span>${r.repCountedCases != null ? pill(t('f.soh.counted'), 'ok') : pill(t(`f.soh.conf.${r.confidence}`), CONF[r.confidence] ?? 'neutral')}</span>
        </li>`;
      })}</ul>` : ''}
      <p class="fine">${t('f.soh.method', { counted })}</p>
    </div>
  </details>`;
}

return { otherRep, territoryPill, confirmCrossTerritory, actionsRow, issuesBadge, wire, notesList, notesHtml, ISSUE_CATEGORIES, classifyIssue, orderLinesHtml, stockOnHandCard };
})();

/* ==================== js/feature/sku-info.js ==================== */
modules['feature/sku-info'] = (() => {
// What the rep needs to know about one SKU when ordering it: distributor availability
// (morning sync; reliable for in/out, not for quantity), an alternative when it is out,
// shelf life, and adoption evidence for the newer packs.

const data = modules['data'];
const orders = modules['orders'];
const fmt = modules['format'];
const { t } = modules['i18n'];
const { html, icon } = modules['ui'];

const ADOPTION_WEEKS = 8;   // "nearby retailers increased orders": last 8 weeks vs the same 8 weeks last year

/** → { kind: 'available'|'limited'|'out', status, ration, note } from the morning sync. */
function stockStatus(sku) {
  const it = data.stockFor(sku);
  const status = it?.sourceStatus ?? (it?.status === 'out' ? 'out-of-stock' : it?.status === 'rationed' ? 'rationed' : 'available');
  const kind = status === 'out-of-stock' ? 'out' : status === 'available' ? 'available' : 'limited';
  return { kind, status, ration: it?.status === 'rationed' ? it.maxCasesPerOutlet : null, note: it?.note ?? '' };
}

const isOrderable = (sku) => stockStatus(sku).kind !== 'out';

/** Closest available SKU of the same flavour and category (nearest pack size), else null. */
function alternativeFor(sku) {
  const p = data.product(sku);
  if (!p) return null;
  return data.products()
    .filter((q) => q.sku !== sku && q.flavour === p.flavour && q.category === p.category && isOrderable(q.sku))
    .sort((a, b) => Math.abs(a.pack.ml - p.pack.ml) - Math.abs(b.pack.ml - p.pack.ml))[0] ?? null;
}

function statusTag(sku) {
  const s = stockStatus(sku);
  const text = s.kind === 'out' ? t('f.stock.s.out-of-stock')
    : s.ration ? t('f.sku.ration', { n: s.ration })
    : s.kind === 'limited' ? t(`f.stock.s.${s.status}`) : t('f.stock.s.available');
  return html`<span class="stock-tag is-${s.kind}"><span class="stock-dot" aria-hidden="true"></span>${text}</span>`;
}

/** Newer-SKU evidence: nearby retailers (same area) ordering it more than last year, plus the
 *  demo offtake figure from field.json (labelled as demo evidence). */
function newSkuEvidence(sku, outlet) {
  const entry = data.field().newSkus?.find((x) => x.sku === sku);
  if (!entry) return null;
  const today = data.demoDate();
  const from = fmt.addDays(today, -7 * ADOPTION_WEEKS);
  const lyFrom = fmt.addDays(from, -364); const lyTo = fmt.addDays(today, -364);
  const casesAt = (id, a, b) => orders.allOrdersFor(id).filter((x) => x.date >= a && x.date < b)
    .reduce((n, x) => n + x.lines.filter((l) => l.sku === sku).reduce((m, l) => m + l.cases, 0), 0);
  const nearby = data.outlets().filter((o) => o.area === outlet.area && o.id !== outlet.id);
  const buyers = nearby.filter((o) => casesAt(o.id, from, today) > 0);
  const grew = buyers.filter((o) => casesAt(o.id, from, today) > casesAt(o.id, lyFrom, lyTo));
  const cases = buyers.reduce((n, o) => n + casesAt(o.id, from, today), 0);
  return { entry, area: outlet.area, buyers: buyers.length, grew: grew.length, cases, weeks: ADOPTION_WEEKS };
}

const isNewer = (sku) => Boolean(data.field().newSkus?.some((x) => x.sku === sku));

/** The expandable detail under a SKU row. `extra` is filled by the order assistant. */
function detailHtml(p, outlet) {
  const s = stockStatus(p.sku);
  const ev = newSkuEvidence(p.sku, outlet);
  const alt = s.kind === 'out' ? alternativeFor(p.sku) : null;
  return html`<div class="sku-detail" data-detail hidden>
    <dl class="sku-facts">
      <div><dt>${t('f.sku.shelf')}</dt><dd>${t('f.sku.shelfDays', { n: p.shelfLifeDays })}</dd></div>
      <div><dt>${t('f.sku.dist')}</dt><dd>${statusTag(p.sku)}</dd></div>
      ${p.focus ? html`<div><dt>${t('f.sku.focus')}</dt><dd>${t('f.sku.focusYes')}</dd></div>` : ''}
    </dl>
    <p class="fine">${s.note ? `${s.note} ` : ''}${t('f.sku.syncNote')}</p>
    ${alt ? html`<p class="alt-line">${icon('info')}<span>${t('f.sku.alt', { name: alt.name })}</span></p>` : ''}
    ${ev ? html`<div class="evidence">
      <p class="evidence-title">${icon('trend')}<span>${t('f.sku.evTitle')}</span></p>
      <ul>
        ${ev.buyers ? html`<li><b>${ev.buyers}</b> ${t('f.sku.evBuyers', { area: ev.area, weeks: ev.weeks, cases: fmt.num(ev.cases) })}</li>` : ''}
        ${ev.grew ? html`<li><b>${ev.grew}</b> ${t('f.sku.evGrew')}</li>` : ''}
        <li><b>${fmt.num(ev.entry.offtake.units)}+</b> ${t('f.sku.evOfftake', { unit: ev.entry.offtake.unitLabel, region: ev.entry.offtake.region, weeks: ev.entry.offtake.weeks })} <span class="demo-flag">${t('f.sku.demoEv')}</span></li>
      </ul>
    </div>` : ''}
    <div data-assist-detail></div>
  </div>`;
}

return { stockStatus, isOrderable, alternativeFor, statusTag, newSkuEvidence, isNewer, detailHtml };
})();

modules['screens/book'] = (() => {
// Order booking: find SKUs (search + category), set quantities, see schemes, running total.
// The screen renders once; cart changes update only the affected row and the footer, so
// feature code in the slots isn't wiped on every tap.
// Tapping an applicable scheme chip adds that scheme's quantity of the product (e.g. +10).

const { app, router } = modules['app'];
const data = modules['data'];
const orders = modules['orders'];
const schemes = modules['schemes'];
const { cart, MAX_CASES } = modules['cart'];
const fmt = modules['format'];
const { t, label, lang } = modules['i18n'];
const { html, mount, fresh, icon, appBar, slot, emptyState, openSheet, toast } = modules['ui'];
const sku = modules['feature/sku-info'];
const { otherRep, confirmCrossTerritory } = modules['feature/outlet-tools'];

// Outlets where the rep already confirmed a cross-territory order this session.
const crossOk = new Set();

const lcFirst = (s) => (lang() === 'en' ? s.charAt(0).toLowerCase() + s.slice(1) : s);

function render(root, { id }) {
  const o = data.outlet(id);
  if (!o) {
    const view = fresh(root);
    mount(view, html`${appBar({ title: t('book.title'), back: '#/outlets' })}
      <div class="page">${emptyState({ icon: 'store', title: t('outlet.notFound'), body: t('outlet.notFoundBody', { id: id ?? '' }), action: html`<a class="btn btn-primary" href="#/outlets">${t('outlet.openList')}</a>` })}</div>`);
    return null;
  }

  let inner = null;
  const cleanup = () => inner?.();

  if (!cart.isEmpty() && cart.outletId && cart.outletId !== o.id) {
    askSwitch(root, o, () => {
      cart.start(o.id);
      inner = renderBooking(root, o);
      app.emit('screen:rendered', { screen: 'book', outletId: o.id, root });
    });
    return cleanup;
  }
  // Another rep's outlet: warn about the incentive split and ask before booking.
  if (otherRep(o) && !crossOk.has(o.id) && cart.outletId !== o.id) {
    fresh(root);
    confirmCrossTerritory(o).then((go) => {
      if (!go) return router.go(`#/outlet/${o.id}`, { replace: true });
      crossOk.add(o.id);
      cart.start(o.id);
      inner = renderBooking(root, o);
      app.emit('screen:rendered', { screen: 'book', outletId: o.id, root });
    });
    return cleanup;
  }
  if (cart.outletId !== o.id) cart.start(o.id);
  inner = renderBooking(root, o);
  return cleanup;
}

/** Another outlet's order isn't submitted: keep editing it, or discard it and start here. */
function askSwitch(root, o, startHere) {
  const other = data.outlet(cart.outletId);
  const view = fresh(root);
  const otherName = other?.name ?? cart.outletId;
  const p = other ? schemes.price(cart.lines(), other, data.demoDate(), orders.allOrdersFor(other.id)) : null;
  const cases = fmt.casesText(cart.totalCases());

  mount(view, html`${appBar({ title: t('book.title'), sub: o.name, back: `#/outlet/${o.id}` })}
    <div class="page">${emptyState({
      icon: 'note',
      title: t('book.openTitle'),
      body: t('book.openBody', { name: otherName, cases }),
      action: html`<button type="button" class="btn btn-primary" data-ask>${t('book.choose')}</button>`,
    })}</div>`);

  const ask = async () => {
    const key = await openSheet({
      title: t('book.unsavedTitle'),
      body: html`<p>${t('book.unsavedBody', { name: otherName, cases, value: p ? fmt.rupees(p.gross) : '' })}</p>
        <p>${t('book.unsavedQ', { name: o.name })}</p>`,
      actions: [
        { key: 'keep', label: t('book.keep', { name: otherName }), tone: 'primary' },
        { key: 'discard', label: t('book.discard'), tone: 'danger-quiet' },
      ],
      dismissKey: 'dismiss',
    });
    if (key === 'keep') router.go(`#/book/${cart.outletId}`);
    if (key === 'discard') startHere();
  };
  view.querySelector('[data-ask]').addEventListener('click', ask);
  ask();
}

function renderBooking(root, o) {
  const view = fresh(root);
  const today = data.demoDate();
  const pastAndDemo = orders.allOrdersFor(o.id);
  const products = data.products();
  const orderLevel = schemes.activeSchemes(today)
    .filter((s) => s.type === 'first-order')
    .filter((s) => schemes.eligibility(s, o, today, pastAndDemo).eligible);

  mount(view, html`
    ${appBar({ title: t('book.title'), sub: o.name, back: `#/outlet/${o.id}` })}
    <div class="toolbar">
      <div class="search">
        ${icon('search')}
        <input class="search-input" type="search" data-q placeholder="${t('book.search')}" aria-label="${t('book.search')}" autocomplete="off" enterkeyhint="search">
        <button type="button" class="search-clear" data-clear hidden>${t('common.clear')}</button>
      </div>
      <div class="chips" role="group" aria-label="${t('book.category')}">
        <button type="button" class="chip" data-cat="" aria-pressed="true">${t('book.all')}</button>
        ${data.categories().map((c) => html`<button type="button" class="chip" data-cat="${c}" aria-pressed="false">${label('cat', c)}</button>`)}
      </div>
    </div>

    ${slot('booking-season')}
    ${slot('booking-live')}

    <div class="page page-book">
      ${orderLevel.map((s) => html`<p class="inline-note inline-note-info">${icon('tag')}<span>${t('book.firstOrder', { name: s.name, offer: schemes.chipText(s) })}</span></p>`)}
      <ul class="sku-list">${products.map((p) => skuRow(p, o, today, pastAndDemo))}</ul>
      <div data-empty></div>
    </div>

    <footer class="cart-bar">
      <div class="cart-sum" aria-live="polite">
        <p class="cart-main"><strong data-cases></strong><span class="cart-sep" aria-hidden="true">·</span><span data-value></span></p>
        <p class="cart-extra" data-extra></p>
      </div>
      <button type="button" class="btn btn-primary" data-review>${t('book.review')}${icon('chevron')}</button>
    </footer>`);

  const rows = new Map([...view.querySelectorAll('.sku')].map((li) => [li.dataset.sku, li]));
  const q = view.querySelector('[data-q]');
  const clearBtn = view.querySelector('[data-clear]');
  const empty = view.querySelector('[data-empty]');
  const footer = {
    cases: view.querySelector('[data-cases]'),
    value: view.querySelector('[data-value]'),
    extra: view.querySelector('[data-extra]'),
    review: view.querySelector('[data-review]'),
  };
  let category = '';
  const lastValid = new WeakMap();   // quantity field → its last accepted text
  const afterSeparator = new WeakSet();   // quantity fields where a non-digit ("." "," "-") was just refused
  const hintTimers = new WeakMap();

  function showHint(li, text) {
    const hint = li.querySelector('[data-qty-hint]');
    hint.textContent = text;
    hint.hidden = false;
    clearTimeout(hintTimers.get(hint));
    hintTimers.set(hint, setTimeout(() => { hint.hidden = true; }, 2500));
  }

  function syncRow(sku_) {
    const li = rows.get(sku_);
    if (!li) return;
    const n = cart.get(sku_);
    const input = li.querySelector('.qty');
    if (document.activeElement !== input) input.value = String(n);
    li.classList.toggle('has-qty', n > 0);
    li.querySelector('[data-step="-1"]').disabled = n <= 0;
    const out = !sku.isOrderable(sku_);
    li.querySelector('[data-step="1"]').disabled = n >= MAX_CASES || out;
    li.querySelectorAll('[data-quick]').forEach((b) => { b.disabled = n >= MAX_CASES || out; });
    const ration = sku.stockStatus(sku_).ration;
    if (ration && n > ration) showHint(li, t('f.sku.overRation', { n: ration }));
  }

  function syncFooter() {
    const p = schemes.price(cart.lines(), o, today, pastAndDemo);
    footer.cases.textContent = fmt.casesText(p.paidCases);
    footer.value.textContent = fmt.rupees(p.gross);   // booked value; schemes are settled later
    const extras = [];
    if (p.freeCases) extras.push(t('book.estFree', { free: t('n.freeCase', { n: p.freeCases }) }));
    if (p.discount) extras.push(t('book.estOff', { amt: fmt.rupees(p.discount) }));
    footer.extra.textContent = extras.length ? extras.join(' · ') : p.paidCases ? t('book.noScheme') : t('book.cartEmpty');
    footer.extra.classList.toggle('is-quiet', !extras.length);
    footer.review.disabled = p.paidCases === 0;
  }

  function applyFilter() {
    clearBtn.hidden = !q.value;
    const tokens = q.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    let shown = 0;
    rows.forEach((li) => {
      // A category chip, or a feature tag on the row (e.g. "suggested" from the order assistant).
      const inCat = !category || li.dataset.category === category || (li.dataset.tags ?? '').split(' ').includes(category);
      const hit = inCat && tokens.every((tk) => li.dataset.search.includes(tk));
      li.hidden = !hit;
      if (hit) shown += 1;
    });
    if (shown) return empty.replaceChildren();
    const cat = label('cat', category);
    mount(empty, q.value.trim()
      ? emptyState({ icon: 'search', title: t('book.noMatch', { q: q.value.trim() }), body: category ? t('book.noMatchIn', { cat }) : t('book.noMatchBody'), action: html`<button type="button" class="btn btn-secondary" data-clear>${t('outlets.clearSearch')}</button>` })
      : emptyState({ icon: 'box', title: t('book.noneIn', { cat }) }));
  }

  const unsubscribe = cart.subscribe((e) => {
    if (e.sku) syncRow(e.sku);
    else rows.forEach((_, sku) => syncRow(sku));
    syncFooter();
  });
  rows.forEach((_, sku) => syncRow(sku));
  syncFooter();

  view.addEventListener('click', (e) => {
    const step = e.target.closest('[data-step]');
    if (step) {
      const sku = step.closest('.sku').dataset.sku;
      if (step.dataset.step === '1') cart.add(sku);
      else cart.remove(sku);
      return;
    }
    // A scheme chip adds the scheme's quantity of this product (buy 10 → +10, 5+ cases → +5).
    const quick = e.target.closest('[data-quick]');
    if (quick) {
      const li = quick.closest('.sku');
      const p = data.product(li.dataset.sku);
      const s = schemes.activeSchemes(today).find((x) => x.id === quick.dataset.scheme);
      const n = Math.min(Number(quick.dataset.quick), MAX_CASES - cart.get(p.sku));
      if (n > 0) {
        cart.add(p.sku, n);
        toast(t('book.added', { cases: fmt.unitsText(n, p.caseLabel), name: p.name, scheme: s?.name ?? '' }), 'plus');
      }
      return;
    }
    const more = e.target.closest('[data-more]');
    if (more) {
      const detail = more.closest('.sku').querySelector('[data-detail]');
      detail.hidden = !detail.hidden;
      more.setAttribute('aria-expanded', String(!detail.hidden));
      return;
    }
    const chip = e.target.closest('.chip[data-cat]');
    if (chip) {
      category = chip.dataset.cat;
      view.querySelectorAll('.chip[data-cat]').forEach((c) => c.setAttribute('aria-pressed', String(c === chip)));
      applyFilter();
      return;
    }
    if (e.target.closest('[data-clear]')) {
      q.value = '';
      applyFilter();
      q.focus();
      return;
    }
    if (e.target.closest('[data-review]') && !cart.isEmpty()) router.go(`#/review/${o.id}`);
  });

  view.addEventListener('input', (e) => {
    if (e.target === q) return applyFilter();
    if (e.target.matches('.qty')) {
      // Whole cases 0–999 only. Anything else ("12.5", "1,200", "-5", a 4th digit) is refused:
      // the field keeps its last valid value and a small hint says why.
      const input = e.target;
      const li = input.closest('.sku');
      const value = input.value;
      const prev = lastValid.get(input) ?? String(cart.get(li.dataset.sku));
      // Digits typed right after a refused character belong to it (the ".5" of "12.5", the "5"
      // of "-5"): ignore them too, until the rep deletes or taps the field again.
      if (afterSeparator.has(input) && value.startsWith(prev) && /^\d+$/.test(value.slice(prev.length))) {
        input.value = prev;
        showHint(li, t('book.hintWhole'));
        return;
      }
      if (Number(value) > 0 && !sku.isOrderable(li.dataset.sku)) {
        input.value = '0';
        showHint(li, t('f.sku.outHint'));
        return;
      }
      if (/^\d*$/.test(value) && (value === '' || Number(value) <= MAX_CASES)) {
        const clean = value === '' ? '' : String(Number(value));   // "045" → "45"
        if (clean !== value) input.value = clean;
        afterSeparator.delete(input);
        lastValid.set(input, clean);
        cart.set(li.dataset.sku, clean === '' ? 0 : Number(clean));
        return;
      }
      input.value = prev;
      const tooBig = /^\d+$/.test(value);
      if (!tooBig) afterSeparator.add(input);
      showHint(li, tooBig ? t('book.hintMax', { max: MAX_CASES }) : t('book.hintWhole'));
    }
  });
  view.addEventListener('focusin', (e) => {
    if (!e.target.matches('.qty')) return;
    lastValid.set(e.target, e.target.value);
    afterSeparator.delete(e.target);
    e.target.select();
  });
  view.addEventListener('focusout', (e) => {
    if (!e.target.matches('.qty')) return;
    afterSeparator.delete(e.target);
    e.target.value = String(cart.get(e.target.closest('.sku').dataset.sku));
  });
  view.addEventListener('keydown', (e) => { if (e.target.matches('.qty') && e.key === 'Enter') e.target.blur(); });

  return unsubscribe;
}

function skuRow(p, o, today, pastAndDemo) {
  const unit = t(p.caseLabel === 'crate' ? 'unit.crate' : 'unit.case');
  const size = p.pack?.ml >= 1000 ? `${p.pack.ml / 1000} L` : `${p.pack?.ml} ml`;
  const pack = `${p.unitsPerCase} ${t(`pack.${p.pack?.type}`) === `pack.${p.pack?.type}` ? t('pack.units') : t(`pack.${p.pack?.type}`)} × ${size}${p.returnable ? ` · ${t('book.returnable')}` : ''}`;
  const search = [p.name, p.sku, p.category, label('cat', p.category), p.flavour, p.pack?.type, `${p.pack?.ml}`].filter(Boolean).join(' ').toLowerCase();
  const chips = schemes.schemesForSku(p.sku, today).map((s) => {
    const st = schemes.statusFor(s, o, today, pastAndDemo);
    if (st.kind === 'not') return html`<span class="scheme-chip is-off">${s.name} · ${lcFirst(st.reason)}</span>`;
    if (st.kind === 'used') {
      return html`<span class="scheme-chip is-used">${icon('tag')}${t('book.capUsed', { chip: schemes.chipText(s), cap: st.cap, month: fmt.monthName(today) })}</span>`;
    }
    const n = schemes.quickAdd(s);
    return html`<button type="button" class="scheme-chip is-add" data-quick="${n}" data-scheme="${s.id}" aria-label="${t('book.chipAdd', { n, unit, name: p.name, scheme: s.name })}">${icon('tag')}<span>${schemes.chipText(s)}</span><span class="chip-plus" aria-hidden="true">+${n}</span></button>`;
  });

  return html`<li class="sku ${sku.isOrderable(p.sku) ? '' : 'is-out'}" data-sku="${p.sku}" data-category="${p.category}" data-search="${search}">
    <div class="sku-text">
      <p class="sku-name">${p.name}</p>
      <p class="sku-pack">${pack}</p>
      <p class="sku-rate"><strong>${t('book.rate', { rate: fmt.rupees(p.ptrPerCase), unit })}</strong>${p.returnable ? t('book.deposit') : ''} · ${t('book.mrp', { mrp: fmt.rupees(p.mrpPerUnit) })}</p>
      <p class="sku-status">${sku.statusTag(p.sku)}${sku.isNewer(p.sku) ? html`<span class="new-tag">${t('f.sku.newer')}</span>` : ''}<button type="button" class="sku-more" data-more aria-expanded="false">${t('f.sku.details')}</button></p>
    </div>
    <div class="stepper">
      <button type="button" class="step" data-step="-1" aria-label="${t('book.fewer', { unit, name: p.name })}">−</button>
      <input class="qty" type="text" inputmode="numeric" pattern="[0-9]*" value="0" aria-label="${t('book.qty', { unit, name: p.name })}" autocomplete="off">
      <button type="button" class="step" data-step="1" aria-label="${t('book.more', { unit, name: p.name })}">+</button>
    </div>
    <p class="qty-hint" data-qty-hint role="status" hidden></p>
    ${chips.length ? html`<div class="sku-chips">${chips}</div>` : ''}
    ${sku.detailHtml(p, o)}
    ${slot('sku-hint', { tag: 'div', attrs: { 'data-sku': p.sku } })}
  </li>`;
}

return { render };
})();

modules['screens/review'] = (() => {
// Order review: lines, totals and the scheme estimate; edit or submit.
//
// Schemes are informational (fa-data schemes.json → assumption): thresholds and benefits are
// settled later by the distributor, never applied at booking. So the order is booked and
// submitted at its full value, and scheme benefits are shown as an estimate beside it.

const { app, router } = modules['app'];
const data = modules['data'];
const orders = modules['orders'];
const schemes = modules['schemes'];
const { cart } = modules['cart'];
const fmt = modules['format'];
const { t, label } = modules['i18n'];
const { html, mount, fresh, icon, appBar, pill, tierBadge, slot, emptyState, toast } = modules['ui'];

function render(root, { id }) {
  const o = data.outlet(id);
  let unsubscribe = null;

  const draw = () => {
    const view = fresh(root);
    if (!o) {
      mount(view, html`${appBar({ title: t('review.title'), back: '#/outlets' })}
        <div class="page">${emptyState({ icon: 'store', title: t('outlet.notFound'), body: t('outlet.notFoundBody', { id: id ?? '' }), action: html`<a class="btn btn-primary" href="#/outlets">${t('outlet.openList')}</a>` })}</div>`);
      return;
    }

      mount(view, html`${appBar({ title: t('review.title'), sub: o.name, back: `#/outlet/${o.id}` })}
        <div class="page">${emptyState({ icon: 'box', title: t('review.nothing'), body: t('review.nothingBody', { name: o.name }), action: html`<a class="btn btn-primary" href="#/book/${o.id}">${t('review.goBook')}</a>` })}</div>`);

    }
    drawReview(view, o);
  };

  function drawReview(view, o) {
    const today = data.demoDate();
    const cfg = data.config();
    const pastAndDemo = orders.allOrdersFor(o.id);
    const p = schemes.price(cart.lines(), o, today, pastAndDemo);
    const delivery = fmt.addDays(today, cfg.distributor?.deliveryLeadDays ?? 1);
    const notes = schemeNotes(p);

    mount(view, html`
      ${appBar({ title: t('review.title'), sub: o.name, back: `#/book/${o.id}` })}
      <div class="page">
        <section class="card review-head">
          <p class="review-outlet">${o.name}</p>
          <p class="muted">${label('area', o.area)} · ${label('ch', o.channel)}</p>
          <div class="row-tags">${tierBadge(o)}${pill(t('review.delivery', { date: fmt.shortDate(delivery), rel: fmt.relative(delivery, today) }), 'info', 'truck')}</div>

        <section class="card">
          <h2 class="card-title">${icon('box')}<span>${t('n.line', { n: p.lines.filter((l) => l.cases).length })}</span></h2>

            ${l.cases ? html`<div class="line-main">
              <p class="line-name">${l.product.name}</p>
              <p class="line-qty">${t('review.qtyRate', { qty: fmt.unitsText(l.cases, l.product.caseLabel), rate: fmt.rupees(l.rate) })}</p>
            </div>
            <p class="line-value num">${fmt.rupees(l.gross)}</p>` : ''}
            ${l.freeCases ? html`<p class="line-free">${icon('check')}<span>${t('review.free', { n: l.freeCases, name: l.product.name })}</span></p>` : ''}
          </li>`)}</ul>
          <a class="btn btn-ghost btn-block" href="#/book/${o.id}">${t('review.edit')}</a>
        </section>

        ${notes.length ? html`<section class="card">
          <h2 class="card-title">${icon('tag')}<span>${t('review.schemes')}</span></h2>
          <ul class="scheme-notes">${notes}</ul>
        </section>` : ''}

        <section class="card">
          <h2 class="card-title">${icon('wallet')}<span>${t('review.totals')}</span></h2>
          <dl class="kv totals">
            <div class="kv-total"><dt>${t('review.booked')}</dt><dd>${fmt.rupees(p.gross)}</dd></div>
            <div><dt>${t('review.totalCases')}</dt><dd>${fmt.num(p.paidCases)}</dd></div>
          </dl>
          ${p.discount || p.freeCases ? html`<div class="est-box">
            <p class="est-title">${icon('tag')}<span>${t('review.estTitle')}</span></p>
            <dl class="kv">
              ${p.freeCases ? html`<div><dt>${t('review.estFree')}</dt><dd>${t('n.freeCase', { n: p.freeCases })}</dd></div>` : ''}
              ${p.discount ? html`<div><dt>${t('review.estOff')}</dt><dd>${fmt.rupees(p.discount)}</dd></div>` : ''}

            <p class="fine">${t('review.estNote')}</p>

        ${slot('review-check')}
      </div>
      <div class="bottom-bar bottom-bar-split">
        <a class="btn btn-secondary" href="#/book/${o.id}">${t('review.editShort')}</a>
        <button type="button" class="btn btn-primary" data-submit>${t('review.submit', { net: fmt.rupees(p.gross) })}</button>
      </div>`);

    let busy = false;
    view.querySelector('[data-submit]').addEventListener('click', (e) => {
      if (busy) return;          // a double tap saves once
      busy = true;
      e.currentTarget.disabled = true;
      e.currentTarget.textContent = t('review.saving');
      unsubscribe?.();
      unsubscribe = null;
      const final = schemes.price(cart.lines(), o, today, orders.allOrdersFor(o.id));
      const saved = orders.saveOrder({
        outletId: o.id,
        lines: final.lines.map((l) => ({ sku: l.sku, cases: l.cases, freeCases: l.freeCases })),
        grossValue: final.gross,
        discountValue: 0,
        netValue: final.gross,          // booked value; schemes are settled later
        schemeIds: final.schemeIds,
        schemeEstimate: { discount: final.discount, freeCases: final.freeCases, settledBy: 'distributor' },
      });
      cart.clear();
      toast(t('review.toast', { name: o.name }));
      router.go(`#/saved/${saved.id}`, { replace: true });
    });
  }

  draw();
  // If anything (e.g. the feature) edits the cart while review is open, redraw and let slots refill.
  unsubscribe = cart.subscribe(() => {
    draw();
    app.emit('screen:rendered', { screen: 'review', outletId: id, root });
  });
  return () => unsubscribe?.();
}

/** Plain lines about each scheme that touches the cart. No "add N more" nudges here. */
function schemeNotes(p) {
  return p.schemes.map((x) => {
    const s = x.scheme;
    if (!x.eligible) {
      if (s.type === 'first-order') return '';
      return html`<li class="scheme-note is-off">${icon('info')}<span>${t('rn.off', { name: s.name, reason: x.reason })}</span></li>`;
    }
    if (x.kind === 'free') {
      if (x.granted > 0) {
        const sku = data.product(x.freeSku)?.name ?? x.freeSku;
        const text = t('rn.free', { name: s.name, free: t('n.freeCase', { n: x.granted }), sku })
          + (x.cap ? t('rn.cap', { used: x.usedAfter, cap: x.cap }) : '') + (x.capHit ? t('rn.capReached') : '');
        return html`<li class="scheme-note is-on">${icon('check')}<span>${text}</span></li>`;
      }
      if (x.cap && x.usedBefore >= x.cap) {
        return html`<li class="scheme-note is-warn">${icon('alert')}<span>${t('rn.capFull', { name: s.name, used: x.usedBefore, cap: x.cap })}</span></li>`;
      }
      return '';
    }
    if (x.amount > 0) {
      const key = s.type === 'first-order' ? 'rn.pctFirst' : 'rn.pct';
      return html`<li class="scheme-note is-on">${icon('check')}<span>${t(key, { name: s.name, pct: s.rule.percent, amt: fmt.rupees(-x.amount) })}</span></li>`;
    }
    return '';
  }).filter(Boolean);
}

return { render };
})();

modules['feature/metrics'] = (() => {
// The rep's own numbers: pre-season placement, month progress, today's calls and the
// leaderboard figures. Always computed from orders.json + visits.json + the orders placed
// in the demo, so they move when the rep submits an order. Other reps' figures are the
// synthetic ones in data/field.json (labelled on screen).

const data = modules['data'];
const orders = modules['orders'];
const fmt = modules['format'];

const LOOKBACK = 30;   // "last 30 days" for calls and coverage

/** Outlets assigned to the signed-in rep. */
const myOutlets = () => data.outlets().filter((o) => (o.repId ?? data.myRepId()) === data.myRepId());
const isMine = (outletId) => (data.outlet(outletId)?.repId ?? data.myRepId()) === data.myRepId();

/** Every order the rep gets credit for: past orders at their outlets, plus demo orders
 *  (at another rep's outlet a demo order earns 50% credit, per field.crossTerritory). */
function creditedOrders() {
  const share = (data.field().crossTerritory?.incentiveCreditPct ?? 50) / 100;
  const past = myOutlets().flatMap((o) => data.pastOrders(o.id)).map((o) => ({ order: o, weight: 1 }));
  const demo = orders.demoOrders().map((o) => ({ order: o, weight: isMine(o.outletId) ? 1 : share }));
  return [...past, ...demo];
}

const casesIn = (list, { from, to, skus = null }) => list
  .filter(({ order }) => order.date >= from && order.date <= to)
  .reduce((n, { order, weight }) => n + weight * order.lines
    .filter((l) => !skus || skus.includes(l.sku))
    .reduce((m, l) => m + (l.cases || 0), 0), 0);

function progress(target, achieved, to) {
  const today = data.demoDate();
  const pct = target ? Math.round((achieved / target) * 100) : 0;
  const daysLeft = Math.max(0, fmt.daysBetween(today, to));
  const remaining = Math.max(0, Math.round(target - achieved));
  return { target, achieved: Math.round(achieved), remaining, pct, daysLeft, perDay: daysLeft ? Math.ceil(remaining / daysLeft) : remaining };
}

/** Pre-season placement: focus-SKU cases booked across the rep's outlets in the window. */
function preSeason() {
  const t = data.field().targets.preSeason;
  const to = t.to < data.demoDate() ? t.to : data.demoDate();
  return { ...t, ...progress(t.target, casesIn(creditedOrders(), { from: t.from, to, skus: t.skus }), t.to) };
}

function month() {
  const t = data.field().targets.month;
  return { ...t, ...progress(t.target, casesIn(creditedOrders(), { from: t.from, to: data.demoDate() }), t.to) };
}

/** Today's route work: visits with an order, focus SKUs placed. */
function today() {
  const d = data.demoDate();
  const route = data.route();
  const todays = orders.demoOrders().filter((o) => o.date === d);
  const visited = new Set(todays.map((o) => o.outletId));
  const focus = data.config().focusSkus;
  const withFocus = new Set(todays.filter((o) => o.lines.some((l) => focus.includes(l.sku) && l.cases)).map((o) => o.outletId));
  const focusCases = todays.reduce((n, o) => n + o.lines.filter((l) => focus.includes(l.sku)).reduce((m, l) => m + l.cases, 0), 0);
  const next = route.find((o) => !visited.has(o.id)) ?? null;
  return { routeCount: route.length, visited: visited.size, productive: todays.length ? visited.size : 0, withFocus: withFocus.size, focusCases, next };
}

/** The leaderboard metrics for the signed-in rep (definitions in field.json). */
function myMetrics() {
  const d = data.demoDate();
  const from = fmt.addDays(d, -LOOKBACK);
  const mine = myOutlets();
  const focus = data.config().focusSkus;
  const all = creditedOrders();
  const recent = all.filter(({ order }) => order.date >= from && order.date <= d);
  const active = new Set(recent.map(({ order }) => order.outletId));
  const withFocus = new Set(recent.filter(({ order }) => order.lines.some((l) => focus.includes(l.sku) && l.cases)).map(({ order }) => order.outletId));
  let calls = 0; let productive = 0;
  mine.forEach((o) => (data.visits(o.id)?.visits ?? []).forEach((v) => {
    if (v.date >= from && v.date < d && v.done) { calls += 1; if (v.outcome === 'order') productive += 1; }
  }));
  const todayOrders = orders.demoOrders().filter((o) => o.date === d);
  calls += new Set(todayOrders.map((o) => o.outletId)).size;
  productive += new Set(todayOrders.map((o) => o.outletId)).size;
  const pre = preSeason();
  return {
    repId: data.myRepId(), name: null, isMe: true, outlets: mine.length,
    preSeasonPct: pre.pct,
    productiveCallsPct: calls ? Math.round((productive / calls) * 100) : 0,
    activeOutletsPct: Math.round((active.size / mine.length) * 100),
    focusCoveragePct: active.size ? Math.round((withFocus.size / active.size) * 100) : 0,
    casesOrdered: Math.round(casesIn(all, { from: pre.from, to: d })),
    monthTargetPct: month().pct,
  };
}

/** → { rows (ranked), me, rank, total, metric } ranked by pre-season placement %, the priority metric. */
function leaderboard(name) {
  const lb = data.field().leaderboard;
  const me = { ...myMetrics(), name, territory: data.config().region.name };
  const rows = [...lb.reps.map((r) => ({ ...r, isMe: false })), me]
    .sort((a, b) => b.preSeasonPct - a.preSeasonPct || b.productiveCallsPct - a.productiveCallsPct);
  rows.forEach((r, i) => { r.rank = i + 1; });
  return { rows, me, rank: me.rank, total: rows.length, lb };
}

return { myOutlets, preSeason, month, today, myMetrics, leaderboard };
})();
