/* ==================== js/feature/sku-info.js ==================== */
modules['feature/sku-info'] = (() => {
// What the rep needs to know about one SKU when ordering it: distributor availability
// (morning sync; reliable for in/out, not for quantity), an alternative when it is out,
// shelf life, and adoption evidence for the newer packs.

const data = modules['data'];
const orders = modules['orders'];
const fmt = modules['format'];
const { t } = modules['i18n'];
const { html, icon } = modules['ui'];

const ADOPTION_WEEKS = 8;   // "nearby retailers increased orders": last 8 weeks vs the same 8 weeks last year

/** → { kind: 'available'|'limited'|'out', status, ration, note } from the morning sync. */
function stockStatus(sku) {
  const it = data.stockFor(sku);
  const status = it?.sourceStatus ?? (it?.status === 'out' ? 'out-of-stock' : it?.status === 'rationed' ? 'rationed' : 'available');
  const kind = status === 'out-of-stock' ? 'out' : status === 'available' ? 'available' : 'limited';
  return { kind, status, ration: it?.status === 'rationed' ? it.maxCasesPerOutlet : null, note: it?.note ?? '' };
}

const isOrderable = (sku) => stockStatus(sku).kind !== 'out';

/** Closest available SKU of the same flavour and category (nearest pack size), else null. */
function alternativeFor(sku) {
  const p = data.product(sku);
  if (!p) return null;
  return data.products()
    .filter((q) => q.sku !== sku && q.flavour === p.flavour && q.category === p.category && isOrderable(q.sku))
    .sort((a, b) => Math.abs(a.pack.ml - p.pack.ml) - Math.abs(b.pack.ml - p.pack.ml))[0] ?? null;
}

function statusTag(sku) {
  const s = stockStatus(sku);
  const text = s.kind === 'out' ? t('f.stock.s.out-of-stock')
    : s.ration ? t('f.sku.ration', { n: s.ration })
    : s.kind === 'limited' ? t(`f.stock.s.${s.status}`) : t('f.stock.s.available');
  return html`<span class="stock-tag is-${s.kind}"><span class="stock-dot" aria-hidden="true"></span>${text}</span>`;
}

/** The same status in two or three words, for the price line of a SKU row. */
function statusShort(sku) {
  const s = stockStatus(sku);
  const text = s.kind === 'out' ? t('f.sku.sOut')
    : s.ration ? t('f.sku.sMax', { n: s.ration })
    : s.status === 'rationed-against-empties' ? t('f.sku.sEmpties')
    : s.status === 'low' ? t('f.sku.sLow') : t('f.sku.sIn');
  return html`<span class="stock-mini is-${s.kind}">${text}</span>`;
}

/** Newer-SKU evidence: nearby retailers (same area) ordering it more than last year, plus the
 *  demo offtake figure from field.json (labelled as demo evidence). */
function newSkuEvidence(sku, outlet) {
  const entry = data.field().newSkus?.find((x) => x.sku === sku);
  if (!entry) return null;
  const today = data.demoDate();
  const from = fmt.addDays(today, -7 * ADOPTION_WEEKS);
  const lyFrom = fmt.addDays(from, -364); const lyTo = fmt.addDays(today, -364);
  const casesAt = (id, a, b) => orders.allOrdersFor(id).filter((x) => x.date >= a && x.date < b)
    .reduce((n, x) => n + x.lines.filter((l) => l.sku === sku).reduce((m, l) => m + l.cases, 0), 0);
  const nearby = data.outlets().filter((o) => o.area === outlet.area && o.id !== outlet.id);
  const buyers = nearby.filter((o) => casesAt(o.id, from, today) > 0);
  const grew = buyers.filter((o) => casesAt(o.id, from, today) > casesAt(o.id, lyFrom, lyTo));
  const cases = buyers.reduce((n, o) => n + casesAt(o.id, from, today), 0);
  return { entry, area: outlet.area, buyers: buyers.length, grew: grew.length, cases, weeks: ADOPTION_WEEKS };
}

const isNewer = (sku) => Boolean(data.field().newSkus?.some((x) => x.sku === sku));

/** The expandable detail under a SKU row. `extra` is filled by the order assistant. */
function detailHtml(p, outlet) {
  const s = stockStatus(p.sku);
  const ev = newSkuEvidence(p.sku, outlet);
  const alt = s.kind === 'out' ? alternativeFor(p.sku) : null;
  return html`<div class="sku-detail" data-detail hidden>
    <dl class="sku-facts">
      <div><dt>${t('f.sku.shelf')}</dt><dd>${t('f.sku.shelfDays', { n: p.shelfLifeDays })}</dd></div>
      ${p.focus ? html`<div><dt>${t('f.sku.focus')}</dt><dd>${t('f.sku.focusYes')}</dd></div>` : ''}
    </dl>
    ${s.note ? html`<p class="sku-note">${icon('truck')}<span>${s.note}</span></p>` : ''}
    ${alt ? html`<p class="alt-line">${icon('info')}<span>${t('f.sku.alt', { name: alt.name })}</span></p>` : ''}
    ${ev ? html`<div class="evidence">
      <p class="evidence-title">${icon('trend')}<span>${t('f.sku.evTitle')}</span></p>
      <ul>
        ${ev.buyers ? html`<li><b>${ev.buyers}</b> ${t('f.sku.evBuyers', { area: ev.area, weeks: ev.weeks, cases: fmt.num(ev.cases) })}</li>` : ''}
        ${ev.grew ? html`<li><b>${ev.grew}</b> ${t('f.sku.evGrew')}</li>` : ''}
        <li><b>${fmt.num(ev.entry.offtake.units)}+</b> ${t('f.sku.evOfftake', { unit: ev.entry.offtake.unitLabel, region: ev.entry.offtake.region, weeks: ev.entry.offtake.weeks })} <span class="demo-flag">${t('f.sku.demoEv')}</span></li>
      </ul>
    </div>` : ''}
    <div data-assist-detail></div>
  </div>`;
}

return { stockStatus, isOrderable, alternativeFor, statusTag, statusShort, newSkuEvidence, isNewer, detailHtml };
})();

/* ==================== js/screens/book.js ==================== */
modules['screens/book'] = (() => {
// Order booking: find SKUs (search + category), set quantities, see schemes, running total.
// The screen renders once; cart changes update only the affected row and the footer, so
// feature code in the slots isn't wiped on every tap.
// Tapping an applicable scheme chip adds that scheme's quantity of the product (e.g. +10).

const { app, router } = modules['app'];
const data = modules['data'];
const orders = modules['orders'];
const schemes = modules['schemes'];
const { cart, MAX_CASES } = modules['cart'];
const fmt = modules['format'];
const { t, label, lang } = modules['i18n'];
const { html, mount, fresh, icon, appBar, slot, emptyState, openSheet, toast } = modules['ui'];
const sku = modules['feature/sku-info'];
const { otherRep, confirmCrossTerritory } = modules['feature/outlet-tools'];

// Outlets where the rep already confirmed a cross-territory order this session.
const crossOk = new Set();

const lcFirst = (s) => (lang() === 'en' ? s.charAt(0).toLowerCase() + s.slice(1) : s);

function render(root, { id }) {
  const o = data.outlet(id);
  if (!o) {
    const view = fresh(root);
    mount(view, html`${appBar({ title: t('book.title'), back: '#/outlets' })}
      <div class="page">${emptyState({ icon: 'store', title: t('outlet.notFound'), body: t('outlet.notFoundBody', { id: id ?? '' }), action: html`<a class="btn btn-primary" href="#/outlets">${t('outlet.openList')}</a>` })}</div>`);
    return null;
  }

  let inner = null;
  const cleanup = () => inner?.();

  if (!cart.isEmpty() && cart.outletId && cart.outletId !== o.id) {
    askSwitch(root, o, () => {
      cart.start(o.id);
      inner = renderBooking(root, o);
      app.emit('screen:rendered', { screen: 'book', outletId: o.id, root });
    });
    return cleanup;
  }
  // Another rep's outlet: warn about the incentive split and ask before booking.
  if (otherRep(o) && !crossOk.has(o.id) && cart.outletId !== o.id) {
    fresh(root);
    confirmCrossTerritory(o).then((go) => {
      if (!go) return router.go(`#/outlet/${o.id}`, { replace: true });
      crossOk.add(o.id);
      cart.start(o.id);
      inner = renderBooking(root, o);
      app.emit('screen:rendered', { screen: 'book', outletId: o.id, root });
    });
    return cleanup;
  }
  if (cart.outletId !== o.id) cart.start(o.id);
  inner = renderBooking(root, o);
  return cleanup;
}

/** Another outlet's order isn't submitted: keep editing it, or discard it and start here. */
function askSwitch(root, o, startHere) {
  const other = data.outlet(cart.outletId);
  const view = fresh(root);
  const otherName = other?.name ?? cart.outletId;
  const p = other ? schemes.price(cart.lines(), other, data.demoDate(), orders.allOrdersFor(other.id)) : null;
  const cases = fmt.casesText(cart.totalCases());

  mount(view, html`${appBar({ title: t('book.title'), sub: o.name, back: `#/outlet/${o.id}` })}
    <div class="page">${emptyState({
      icon: 'note',
      title: t('book.openTitle'),
      body: t('book.openBody', { name: otherName, cases }),
      action: html`<button type="button" class="btn btn-primary" data-ask>${t('book.choose')}</button>`,
    })}</div>`);

  const ask = async () => {
    const key = await openSheet({
      title: t('book.unsavedTitle'),
      body: html`<p>${t('book.unsavedBody', { name: otherName, cases, value: p ? fmt.rupees(p.gross) : '' })}</p>
        <p>${t('book.unsavedQ', { name: o.name })}</p>`,
      actions: [
        { key: 'keep', label: t('book.keep', { name: otherName }), tone: 'primary' },
        { key: 'discard', label: t('book.discard'), tone: 'danger-quiet' },
      ],
      dismissKey: 'dismiss',
    });
    if (key === 'keep') router.go(`#/book/${cart.outletId}`);
    if (key === 'discard') startHere();
  };
  view.querySelector('[data-ask]').addEventListener('click', ask);
  ask();
}

function renderBooking(root, o) {
  const view = fresh(root);
  const today = data.demoDate();
  const pastAndDemo = orders.allOrdersFor(o.id);
  const products = data.products();
  const orderLevel = schemes.activeSchemes(today)
    .filter((s) => s.type === 'first-order')
    .filter((s) => schemes.eligibility(s, o, today, pastAndDemo).eligible);

  mount(view, html`
    ${appBar({ title: t('book.title'), sub: o.name, back: `#/outlet/${o.id}` })}
    <div class="toolbar">
      <div class="search">
        ${icon('search')}
        <input class="search-input" type="search" data-q placeholder="${t('book.search')}" aria-label="${t('book.search')}" autocomplete="off" enterkeyhint="search">
        <button type="button" class="search-clear" data-clear hidden>${t('common.clear')}</button>
      </div>
      <div class="chips" role="group" aria-label="${t('book.category')}">
        <button type="button" class="chip" data-cat="" aria-pressed="true">${t('book.all')}</button>
        ${data.categories().map((c) => html`<button type="button" class="chip" data-cat="${c}" aria-pressed="false">${label('cat', c)}</button>`)}
      </div>
    </div>

    ${slot('booking-season')}
    ${slot('booking-live')}

    <div class="page page-book">
      ${orderLevel.map((s) => html`<p class="inline-note inline-note-info">${icon('tag')}<span>${t('book.firstOrder', { name: s.name, offer: schemes.chipText(s) })}</span></p>`)}
      <ul class="sku-list">${products.map((p) => skuRow(p, o, today, pastAndDemo))}</ul>
      <div data-empty></div>
    </div>

    <footer class="cart-bar">
      <div class="cart-sum" aria-live="polite">
        <p class="cart-main"><strong data-cases></strong><span class="cart-sep" aria-hidden="true">·</span><span data-value></span></p>
        <p class="cart-extra" data-extra></p>
      </div>
      <button type="button" class="btn btn-primary" data-review>${t('book.review')}${icon('chevron')}</button>
    </footer>`);

  const rows = new Map([...view.querySelectorAll('.sku')].map((li) => [li.dataset.sku, li]));
  const q = view.querySelector('[data-q]');
  const clearBtn = view.querySelector('[data-clear]');
  const empty = view.querySelector('[data-empty]');
  const footer = {
    cases: view.querySelector('[data-cases]'),
    value: view.querySelector('[data-value]'),
    extra: view.querySelector('[data-extra]'),
    review: view.querySelector('[data-review]'),
  };
  let category = '';
  const lastValid = new WeakMap();   // quantity field → its last accepted text
  const afterSeparator = new WeakSet();   // quantity fields where a non-digit ("." "," "-") was just refused
  const hintTimers = new WeakMap();

  function showHint(li, text) {
    const hint = li.querySelector('[data-qty-hint]');
    hint.textContent = text;
    hint.hidden = false;
    clearTimeout(hintTimers.get(hint));
    hintTimers.set(hint, setTimeout(() => { hint.hidden = true; }, 2500));
  }

  function syncRow(sku_) {
    const li = rows.get(sku_);
    if (!li) return;
    const n = cart.get(sku_);
    const input = li.querySelector('.qty');
    if (document.activeElement !== input) input.value = String(n);
    li.classList.toggle('has-qty', n > 0);
    li.querySelector('[data-step="-1"]').disabled = n <= 0;
    const out = !sku.isOrderable(sku_);
    li.querySelector('[data-step="1"]').disabled = n >= MAX_CASES || out;
    li.querySelectorAll('[data-quick]').forEach((b) => { b.disabled = n >= MAX_CASES || out; });
    // Above the distributor's ration: a warning that stays until the quantity is back within it.
    const ration = sku.stockStatus(sku_).ration;
    const warn = li.querySelector('[data-ration]');
    warn.hidden = !(ration && n > ration);
    if (!warn.hidden) warn.lastElementChild.textContent = t('f.sku.overRation', { n: ration });
  }

  function syncFooter() {
    const p = schemes.price(cart.lines(), o, today, pastAndDemo);
    footer.cases.textContent = fmt.casesText(p.paidCases);
    footer.value.textContent = fmt.rupees(p.gross);   // booked value; schemes are settled later
    const extras = [];
    if (p.freeCases) extras.push(t('book.estFree', { free: t('n.freeCase', { n: p.freeCases }) }));
    if (p.discount) extras.push(t('book.estOff', { amt: fmt.rupees(p.discount) }));
    footer.extra.textContent = extras.length ? extras.join(' · ') : p.paidCases ? t('book.noScheme') : t('book.cartEmpty');
    footer.extra.classList.toggle('is-quiet', !extras.length);
    footer.review.disabled = p.paidCases === 0;
  }

  function applyFilter() {
    clearBtn.hidden = !q.value;
    const tokens = q.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    let shown = 0;
    rows.forEach((li) => {
      // A category chip, or a feature tag on the row (e.g. "suggested" from the order assistant).
      const inCat = !category || li.dataset.category === category || (li.dataset.tags ?? '').split(' ').includes(category);
      const hit = inCat && tokens.every((tk) => li.dataset.search.includes(tk));
      li.hidden = !hit;
      if (hit) shown += 1;
    });
    if (shown) return empty.replaceChildren();
    const cat = label('cat', category);
    mount(empty, q.value.trim()
      ? emptyState({ icon: 'search', title: t('book.noMatch', { q: q.value.trim() }), body: category ? t('book.noMatchIn', { cat }) : t('book.noMatchBody'), action: html`<button type="button" class="btn btn-secondary" data-clear>${t('outlets.clearSearch')}</button>` })
      : emptyState({ icon: 'box', title: t('book.noneIn', { cat }) }));
  }

  const unsubscribe = cart.subscribe((e) => {
    if (e.sku) syncRow(e.sku);
    else rows.forEach((_, sku) => syncRow(sku));
    syncFooter();
  });
  rows.forEach((_, sku) => syncRow(sku));
  syncFooter();

  view.addEventListener('click', (e) => {
    const step = e.target.closest('[data-step]');
    if (step) {
      const sku = step.closest('.sku').dataset.sku;
      if (step.dataset.step === '1') cart.add(sku);
      else cart.remove(sku);
      return;
    }
    // A scheme chip adds the scheme's quantity of this product (buy 10 → +10, 5+ cases → +5).
    const quick = e.target.closest('[data-quick]');
    if (quick) {
      const li = quick.closest('.sku');
      const p = data.product(li.dataset.sku);
      const s = schemes.activeSchemes(today).find((x) => x.id === quick.dataset.scheme);
      const n = Math.min(Number(quick.dataset.quick), MAX_CASES - cart.get(p.sku));
      if (n > 0) {
        cart.add(p.sku, n);
        toast(t('book.added', { cases: fmt.unitsText(n, p.caseLabel), name: p.name, scheme: s?.name ?? '' }), 'plus');
      }
      return;
    }
    const more = e.target.closest('[data-more]');
    if (more) {
      const detail = more.closest('.sku').querySelector('[data-detail]');
      detail.hidden = !detail.hidden;
      more.setAttribute('aria-expanded', String(!detail.hidden));
      return;
    }
    const chip = e.target.closest('.chip[data-cat]');
    if (chip) {
      category = chip.dataset.cat;
      view.querySelectorAll('.chip[data-cat]').forEach((c) => c.setAttribute('aria-pressed', String(c === chip)));
      applyFilter();
      return;
    }
    if (e.target.closest('[data-clear]')) {
      q.value = '';
      applyFilter();
      q.focus();
      return;
    }
    if (e.target.closest('[data-review]') && !cart.isEmpty()) router.go(`#/review/${o.id}`);
  });

  view.addEventListener('input', (e) => {
    if (e.target === q) return applyFilter();
    if (e.target.matches('.qty')) {
      // Whole cases 0–999 only. Anything else ("12.5", "1,200", "-5", a 4th digit) is refused:
      // the field keeps its last valid value and a small hint says why.
      const input = e.target;
      const li = input.closest('.sku');
      const value = input.value;
      const prev = lastValid.get(input) ?? String(cart.get(li.dataset.sku));
      // Digits typed right after a refused character belong to it (the ".5" of "12.5", the "5"
      // of "-5"): ignore them too, until the rep deletes or taps the field again.
      if (afterSeparator.has(input) && value.startsWith(prev) && /^\d+$/.test(value.slice(prev.length))) {
        input.value = prev;
        showHint(li, t('book.hintWhole'));
        return;
      }
      if (Number(value) > 0 && !sku.isOrderable(li.dataset.sku)) {
        input.value = '0';
        showHint(li, t('f.sku.outHint'));
        return;
      }
      if (/^\d*$/.test(value) && (value === '' || Number(value) <= MAX_CASES)) {
        const clean = value === '' ? '' : String(Number(value));   // "045" → "45"
        if (clean !== value) input.value = clean;
        afterSeparator.delete(input);
        lastValid.set(input, clean);
        cart.set(li.dataset.sku, clean === '' ? 0 : Number(clean));
        return;
      }
      input.value = prev;
      const tooBig = /^\d+$/.test(value);
      if (!tooBig) afterSeparator.add(input);
      showHint(li, tooBig ? t('book.hintMax', { max: MAX_CASES }) : t('book.hintWhole'));
    }
  });
  view.addEventListener('focusin', (e) => {
    if (!e.target.matches('.qty')) return;
    lastValid.set(e.target, e.target.value);
    afterSeparator.delete(e.target);
    e.target.select();
  });
  view.addEventListener('focusout', (e) => {
    if (!e.target.matches('.qty')) return;
    afterSeparator.delete(e.target);
    e.target.value = String(cart.get(e.target.closest('.sku').dataset.sku));
  });
  view.addEventListener('keydown', (e) => { if (e.target.matches('.qty') && e.key === 'Enter') e.target.blur(); });

  return unsubscribe;
}

function skuRow(p, o, today, pastAndDemo) {
  const unit = t(p.caseLabel === 'crate' ? 'unit.crate' : 'unit.case');
  const size = p.pack?.ml >= 1000 ? `${p.pack.ml / 1000} L` : `${p.pack?.ml} ml`;
  const pack = `${p.unitsPerCase} × ${size}${p.returnable ? ` · ${t('book.returnable')}` : ''}`;
  const search = [p.name, p.sku, p.category, label('cat', p.category), p.flavour, p.pack?.type, `${p.pack?.ml}`].filter(Boolean).join(' ').toLowerCase();
  const chips = schemes.schemesForSku(p.sku, today).map((s) => {
    const st = schemes.statusFor(s, o, today, pastAndDemo);
    if (st.kind === 'not') return '';           // schemes this shop can't get aren't shown
    if (st.kind === 'used') {
      return html`<span class="scheme-chip is-used">${icon('tag')}${t('book.capUsed', { chip: schemes.chipText(s), cap: st.cap, month: fmt.monthName(today) })}</span>`;
    }
    const n = schemes.quickAdd(s);
    return html`<button type="button" class="scheme-chip is-add" data-quick="${n}" data-scheme="${s.id}" aria-label="${t('book.chipAdd', { n, unit, name: p.name, scheme: s.name })}">${icon('tag')}<span>${schemes.chipText(s)}</span><span class="chip-plus" aria-hidden="true">+${n}</span></button>`;
  }).filter(Boolean);

  return html`<li class="sku ${sku.isOrderable(p.sku) ? '' : 'is-out'}" data-sku="${p.sku}" data-category="${p.category}" data-search="${search}">
    <div class="sku-text">
      <p class="sku-name">${p.focus ? html`<span class="focus-mark" title="${t('f.sku.focus')}">★</span>` : ''}${p.name}${sku.isNewer(p.sku) ? html`<span class="new-tag">${t('f.sku.newer')}</span>` : ''}</p>
      <p class="sku-pack">${pack}</p>
      <p class="sku-rate"><strong>${fmt.rupees(p.ptrPerCase)}</strong><span class="sku-unit">/${unit}</span> · ${t('book.mrp', { mrp: fmt.rupees(p.mrpPerUnit) })} ${sku.statusShort(p.sku)}
        <button type="button" class="sku-more" data-more aria-expanded="false" aria-label="${t('f.sku.details')}">${icon('chevron')}</button></p>
    </div>
    <div class="stepper">
      <button type="button" class="step" data-step="-1" aria-label="${t('book.fewer', { unit, name: p.name })}">−</button>
      <input class="qty" type="text" inputmode="numeric" pattern="[0-9]*" value="0" aria-label="${t('book.qty', { unit, name: p.name })}" autocomplete="off">
      <button type="button" class="step" data-step="1" aria-label="${t('book.more', { unit, name: p.name })}">+</button>
    </div>
    <p class="qty-hint" data-qty-hint role="status" hidden></p>
    <p class="ration-warn" data-ration role="status" hidden>${icon('alert')}<span></span></p>
    ${chips.length ? html`<div class="sku-chips">${chips}</div>` : ''}
    ${sku.detailHtml(p, o)}
    ${slot('sku-hint', { tag: 'div', attrs: { 'data-sku': p.sku } })}
  </li>`;
}

return { render };
})();

/* ==================== js/screens/review.js ==================== */
modules['screens/review'] = (() => {
// Order review: lines, totals and the scheme estimate; edit or submit.
//
// Schemes are informational (fa-data schemes.json → assumption): thresholds and benefits are
// settled later by the distributor, never applied at booking. So the order is booked and
// submitted at its full value, and scheme benefits are shown as an estimate beside it.

const { app, router } = modules['app'];
const data = modules['data'];
const orders = modules['orders'];
const schemes = modules['schemes'];
const { cart } = modules['cart'];
const fmt = modules['format'];
const { t, label } = modules['i18n'];
const { html, mount, fresh, icon, appBar, pill, tierBadge, slot, emptyState, toast } = modules['ui'];

function render(root, { id }) {
  const o = data.outlet(id);
  let unsubscribe = null;

  const draw = () => {
    const view = fresh(root);
    if (!o) {
      mount(view, html`${appBar({ title: t('review.title'), back: '#/outlets' })}
        <div class="page">${emptyState({ icon: 'store', title: t('outlet.notFound'), body: t('outlet.notFoundBody', { id: id ?? '' }), action: html`<a class="btn btn-primary" href="#/outlets">${t('outlet.openList')}</a>` })}</div>`);
      return;
    }
    if (cart.outletId !== o.id || cart.isEmpty()) {
      mount(view, html`${appBar({ title: t('review.title'), sub: o.name, back: `#/outlet/${o.id}` })}
        <div class="page">${emptyState({ icon: 'box', title: t('review.nothing'), body: t('review.nothingBody', { name: o.name }), action: html`<a class="btn btn-primary" href="#/book/${o.id}">${t('review.goBook')}</a>` })}</div>`);
      return;
    }
    drawReview(view, o);
  };

  function drawReview(view, o) {
    const today = data.demoDate();
    const cfg = data.config();
    const pastAndDemo = orders.allOrdersFor(o.id);
    const p = schemes.price(cart.lines(), o, today, pastAndDemo);
    const delivery = fmt.addDays(today, cfg.distributor?.deliveryLeadDays ?? 1);
    const notes = schemeNotes(p);

    mount(view, html`
      ${appBar({ title: t('review.title'), sub: o.name, back: `#/book/${o.id}` })}
      <div class="page">
        <section class="card review-head">
          <p class="review-outlet">${o.name}</p>
          <p class="muted">${label('area', o.area)} · ${label('ch', o.channel)}</p>
          <div class="row-tags">${tierBadge(o)}${pill(t('review.delivery', { date: fmt.shortDate(delivery), rel: fmt.relative(delivery, today) }), 'info', 'truck')}</div>
        </section>

        <section class="card">
          <h2 class="card-title">${icon('box')}<span>${t('n.line', { n: p.lines.filter((l) => l.cases).length })}</span></h2>
          <ul class="lines">${p.lines.map((l) => html`<li class="line">
            ${l.cases ? html`<div class="line-main">
              <p class="line-name">${l.product.name}</p>
              <p class="line-qty">${t('review.qtyRate', { qty: fmt.unitsText(l.cases, l.product.caseLabel), rate: fmt.rupees(l.rate) })}</p>
            </div>
            <p class="line-value num">${fmt.rupees(l.gross)}</p>` : ''}
            ${l.freeCases ? html`<p class="line-free">${icon('check')}<span>${t('review.free', { n: l.freeCases, name: l.product.name })}</span></p>` : ''}
          </li>`)}</ul>
          <a class="btn btn-ghost btn-block" href="#/book/${o.id}">${t('review.edit')}</a>
        </section>

        ${notes.length ? html`<section class="card">
          <h2 class="card-title">${icon('tag')}<span>${t('review.schemes')}</span></h2>
          <ul class="scheme-notes">${notes}</ul>
        </section>` : ''}

        <section class="card">
          <h2 class="card-title">${icon('wallet')}<span>${t('review.totals')}</span></h2>
          <dl class="kv totals">
            <div class="kv-total"><dt>${t('review.booked')}</dt><dd>${fmt.rupees(p.gross)}</dd></div>
            <div><dt>${t('review.totalCases')}</dt><dd>${fmt.num(p.paidCases)}</dd></div>
          </dl>
          ${p.discount || p.freeCases ? html`<div class="est-box">
            <p class="est-title">${icon('tag')}<span>${t('review.estTitle')}</span></p>
            <dl class="kv">
              ${p.freeCases ? html`<div><dt>${t('review.estFree')}</dt><dd>${t('n.freeCase', { n: p.freeCases })}</dd></div>` : ''}
              ${p.discount ? html`<div><dt>${t('review.estOff')}</dt><dd>${fmt.rupees(p.discount)}</dd></div>` : ''}
            </dl>
            <p class="fine">${t('review.estNote')}</p>
          </div>` : ''}
        </section>

        ${slot('review-check')}
      </div>
      <div class="bottom-bar bottom-bar-split">
        <a class="btn btn-secondary" href="#/book/${o.id}">${t('review.editShort')}</a>
        <button type="button" class="btn btn-primary" data-submit>${t('review.submit', { net: fmt.rupees(p.gross) })}</button>
      </div>`);

    let busy = false;
    view.querySelector('[data-submit]').addEventListener('click', (e) => {
      if (busy) return;          // a double tap saves once
      busy = true;
      e.currentTarget.disabled = true;
      e.currentTarget.textContent = t('review.saving');
      unsubscribe?.();
      unsubscribe = null;
      const final = schemes.price(cart.lines(), o, today, orders.allOrdersFor(o.id));
      const saved = orders.saveOrder({
        outletId: o.id,
        lines: final.lines.map((l) => ({ sku: l.sku, cases: l.cases, freeCases: l.freeCases })),
        grossValue: final.gross,
        discountValue: 0,
        netValue: final.gross,          // booked value; schemes are settled later
        schemeIds: final.schemeIds,
        schemeEstimate: { discount: final.discount, freeCases: final.freeCases, settledBy: 'distributor' },
      });
      cart.clear();
      toast(t('review.toast', { name: o.name }));
      router.go(`#/saved/${saved.id}`, { replace: true });
    });
  }

  draw();
  // If anything (e.g. the feature) edits the cart while review is open, redraw and let slots refill.
  unsubscribe = cart.subscribe(() => {
    draw();
    app.emit('screen:rendered', { screen: 'review', outletId: id, root });
  });
  return () => unsubscribe?.();
}

/** Plain lines about each scheme that touches the cart. No "add N more" nudges here. */
function schemeNotes(p) {
  return p.schemes.map((x) => {
    const s = x.scheme;
    if (!x.eligible) {
      if (s.type === 'first-order') return '';
      return html`<li class="scheme-note is-off">${icon('info')}<span>${t('rn.off', { name: s.name, reason: x.reason })}</span></li>`;
    }
    if (x.kind === 'free') {
      if (x.granted > 0) {
        const sku = data.product(x.freeSku)?.name ?? x.freeSku;
        const text = t('rn.free', { name: s.name, free: t('n.freeCase', { n: x.granted }), sku })
          + (x.cap ? t('rn.cap', { used: x.usedAfter, cap: x.cap }) : '') + (x.capHit ? t('rn.capReached') : '');
        return html`<li class="scheme-note is-on">${icon('check')}<span>${text}</span></li>`;
      }
      if (x.cap && x.usedBefore >= x.cap) {
        return html`<li class="scheme-note is-warn">${icon('alert')}<span>${t('rn.capFull', { name: s.name, used: x.usedBefore, cap: x.cap })}</span></li>`;
      }
      return '';
    }
    if (x.amount > 0) {
      const key = s.type === 'first-order' ? 'rn.pctFirst' : 'rn.pct';
      return html`<li class="scheme-note is-on">${icon('check')}<span>${t(key, { name: s.name, pct: s.rule.percent, amt: fmt.rupees(-x.amount) })}</span></li>`;
    }
    return '';
  }).filter(Boolean);
}

return { render };
})();

modules['screens/scheme'] = (() => {
// Scheme details: #/scheme/SCH-SS26/OUT-01 (the outlet part is optional).
// What the offer is, who can get it, dates, limits, how it's paid, the products it covers,
// and — for an outlet — its status there, uses this month and the orders that used it.

const { nav } = modules['app'];
const data = modules['data'];
const orders = modules['orders'];
const schemes = modules['schemes'];
const fmt = modules['format'];
const { t, label, lang } = modules['i18n'];
const { schemeArt } = modules['feature/scheme-art'];
const { html, mount, fresh, icon, appBar, emptyState, tiles } = modules['ui'];

function render(root, { id, sub }) {
  const view = fresh(root);
  const s = data.schemes().find((x) => x.id === id);
  const o = sub ? data.outlet(sub) : null;
  const back = o ? `#/outlet/${o.id}` : nav.hub;

  if (!s) {
    mount(view, html`${appBar({ title: t('sd.title'), back })}
      <div class="page">${emptyState({ icon: 'tag', title: t('sd.notFound'), body: t('sd.notFoundBody', { id: id ?? '' }), action: html`<a class="btn btn-primary" href="${back}">${t('common.back')}</a>` })}</div>`);
    return;
  }

  const today = data.demoDate();
  const all = o ? orders.allOrdersFor(o.id) : [];
  const st = o ? schemes.statusFor(s, o, today, all) : null;
  const r = s.rule ?? {};
  const month = fmt.monthName(today, true);

  mount(view, html`
    ${appBar({ title: s.name, sub: o?.name ?? t('sd.title'), back })}
    <div class="page">
      <section class="sd-art" style="${schemeArt(s)}">
        <p class="sd-type">${t(`sd.type.${s.type}`)}</p>
        <h1 class="sd-art-name">${s.name}</h1>
        <p class="sd-art-offer">${s.type === 'program' ? t('f.sch.program', { amt: schemes.payoutAmount(s) }) : schemes.chipText(s)}</p>
      </section>
      ${st ? html`<div class="sd-status-wrap">${statusBanner(st, o, s, today, month)}</div>` : ''}

      <details class="card collapse fold" open>
        <summary class="collapse-head"><span class="card-title"><span class="fold-ico ic-amber">${icon('chat')}</span><span>${t('sd.offer')}</span></span>${icon('chevron', 'collapse-chev')}</summary>
        <div class="collapse-body">${offerBody(s)}</div>
      </details>

      <details class="card collapse fold">
        <summary class="collapse-head"><span class="card-title"><span class="fold-ico ic-blue">${icon('info')}</span><span>${t('sd.details')}</span></span>
          <span class="collapse-sum">${s.validTo ? t('common.till', { date: fmt.shortDate(s.validTo) }) : t('common.ongoing')}</span>${icon('chevron', 'collapse-chev')}</summary>
        <div class="collapse-body">
          ${tiles([
            { icon: 'calendar', label: t('sd.valid'), value: s.validTo ? t('common.till', { date: fmt.shortDate(s.validTo) }) : t('common.ongoing'), sub: s.validTo ? t('sd.daysLeft', { n: Math.max(0, fmt.daysBetween(today, s.validTo)) }) : '', tone: 'blue' },
            { icon: 'store', label: t('sd.who'), value: whoShort(s) },
            s.capUsesPerMonth ? { icon: 'box', label: t('sd.limit'), value: t('n.freeCase', { n: s.capUsesPerMonth }), sub: t('sd.perShop') } : null,
            o && st?.cap ? { icon: 'check', label: t('sd.used', { month }), value: t('sd.usedVal', { used: st.used, cap: st.cap }), tone: st.used >= st.cap ? 'warn' : '' } : null,
          ])}
          <ul class="sd-notes">
            ${s.type === 'free-goods' ? html`<li>${icon('tag')}<span><b>${t('sd.freeAs')}:</b> ${freeAs(r)}</span></li>` : ''}
            <li>${icon('wallet')}<span><b>${t('sd.paid')}:</b> ${lang() === 'en' && s.payout && s.type !== 'program' ? s.payout : t(`sd.pay.${s.type}`)}</span></li>
            ${s.extras ? html`<li>${icon('plus')}<span><b>${t('sd.also')}:</b> ${schemes.extrasText(s)}</span></li>` : ''}
          </ul>
        </div>
      </details>

      ${o && s.type === 'program' && o.cooler?.type === 'bottler' ? auditCard(o, today) : ''}
      ${o ? historyCard(s, all) : ''}
    </div>
    ${o ? html`<div class="bottom-bar">${st.kind === 'applicable' && s.type !== 'program'
      ? html`<a class="btn btn-primary btn-block" href="#/book/${o.id}" data-focus-scheme="${s.id}" data-focus-outlet="${o.id}">${t('sd.book')}</a>`
      : html`<a class="btn btn-secondary btn-block" href="#/outlet/${o.id}">${t('sd.backOutlet')}</a>`}</div>` : ''}`);
}

function statusBanner(st, o, s, today, month) {
  const nextMonth = `${fmt.addMonths(fmt.monthKey(today), 1)}-01`;
  const text = {
    applicable: [t('sd.st.applicable', { outlet: o.name }), t('sd.st.applicableBody'), 'tag'],
    enrolled: [t('sd.st.enrolled', { outlet: o.name }), t('sd.st.enrolledBody'), 'check'],
    used: [t('sd.st.used', { outlet: o.name, month }), t('sd.st.usedBody', { cap: st.cap, date: fmt.shortDate(nextMonth) }), 'alert'],
    not: [t('sd.st.not', { outlet: o.name }), st.reason, 'info'],
  }[st.kind];
  return html`<div class="sd-status sd-status-${st.kind}">
    <span class="sd-status-icon">${icon(text[2])}</span>
    <div>
      <p class="sd-status-title">${text[0]}</p>
      <p class="sd-status-body">${text[1]}</p>
    </div>
  </div>`;
}

/** Who can get it, short enough for a tile: "Diamond, Gold, Silver" or "All shops". */
function whoShort(s) {
  if (s.type === 'first-order') return t('sd.firstShort', { days: s.rule?.withinDaysOfRegistration ?? 90 });
  const tiers = Array.isArray(s.eligibleTiers) ? s.eligibleTiers.map((x) => label('tier', x)).join(', ') : t('sd.allOutlets');
  return s.requiresBottlerCooler ? `${tiers} · ${t('sd.coolerShort')}` : tiers;
}

function whoCanGet(s) {
  const parts = [];
  if (s.type === 'first-order') parts.push(t('sd.firstDays', { days: s.rule?.withinDaysOfRegistration ?? 90 }));
  else if (Array.isArray(s.eligibleTiers)) parts.push(t('sd.tiers', { tiers: s.eligibleTiers.map((x) => label('tier', x)).join(', ') }));
  if (s.requiresBottlerCooler) parts.push(t('sd.coolerOnly'));
  return parts.length ? parts.join(' · ') : t('sd.allOutlets');
}

function freeAs(r) {
  if (r.freeSku === 'same' || !r.pooled) return t('sd.freeSame');
  if (r.freeSku === 'largest-line' || !r.freeSku) return t('sd.freeLargest');
  return data.product(r.freeSku)?.name ?? r.freeSku;
}

/** The offer in one short line, then its packs as pills with their rate (no long sentence). */
function offerBody(s) {
  const r = s.rule ?? {};
  const list = Array.isArray(s.skus) ? s.skus.map((sku) => data.product(sku)).filter(Boolean) : [];
  const line = s.type === 'free-goods' ? t('sd.offerFree', { buy: r.buyCases, free: r.freeCases })
    : s.type === 'percent-off' ? t('sd.offerPct', { min: r.minCases, pct: r.percent })
    : schemes.offerText(s);
  if (!list.length) return html`<p class="sd-offer">${line}</p>`;
  const unit = (p) => t(p.caseLabel === 'crate' ? 'unit.crate' : 'unit.case');
  return html`<p class="sd-offer">${line}</p>
    <p class="tp-packs-l">${list.length > 1 ? (r.pooled ? t('tp.f.anyMix') : t('tp.f.together')) : t('tp.f.pack')}</p>
    <ul class="sd-packs">${list.map((p) => html`<li><span>${p.name}</span><b class="num">${fmt.rupees(p.ptrPerCase)}/${unit(p)}</b></li>`)}</ul>`;
}

function auditCard(o, today) {
  const a = o.cooler.lastAudit;
  return html`<section class="card">
    <h2 class="card-title">${icon('cooler')}<span>${t('sd.audit')}</span></h2>
    ${a ? tiles([
      { icon: 'calendar', label: t('cooler.lastAudit'), value: fmt.shortDate(a.date), sub: fmt.relative(a.date, today) },
      { icon: 'check', label: t('cooler.onlyOurs'), value: a.pure ? t('cooler.yes') : t('cooler.otherBrands'), tone: a.pure ? '' : 'warn' },
      { icon: 'cooler', label: t('cooler.fillTemp'), value: `${a.fillPct}% · ${a.tempC}°C` },
    ]) : html`<p class="muted">${t('cooler.noAudit')}</p>`}
  </section>`;
}

function historyCard(s, all) {
  const used = all.filter((x) => Array.isArray(x.schemeIds) && x.schemeIds.includes(s.id));
  const freeOf = (x) => x.lines.filter((l) => schemes.coversSku(s, l.sku)).reduce((n, l) => n + (l.freeCases || 0), 0);
  const free = used.reduce((n, x) => n + freeOf(x), 0);
  return html`<section class="card">
    <h2 class="card-title">${icon('history')}<span>${t('sd.history')}</span></h2>
    ${used.length ? html`${tiles([
      { icon: 'check', label: t('sd.timesUsed'), value: fmt.num(used.length), tone: 'blue' },
      s.type === 'free-goods' ? { icon: 'box', label: t('sd.freeGot'), value: t('n.freeCase', { n: free }) } : { icon: 'calendar', label: t('sd.lastUsed'), value: fmt.shortDate(used[0].date) },
    ])}
    <ul class="recent sd-recent">${used.slice(0, 4).map((x) => html`<li>
      <span class="recent-d">${fmt.shortDate(x.date)}</span>
      <span>${fmt.casesText(orders.paidCases(x))}</span>
      <b class="num">${s.type === 'free-goods' ? `+${t('n.freeCase', { n: freeOf(x) })}` : t('sd.historyApplied')}</b>
    </li>`)}</ul>` : html`<p class="muted">${t('sd.historyEmpty')}</p>`}
  </section>`;
}

return { render };
})();

/* ==================== js/feature/metrics.js ==================== */
modules['feature/metrics'] = (() => {
// The rep's own numbers: pre-season placement, month progress, today's calls and the
// leaderboard figures. Always computed from orders.json + visits.json + the orders placed
// in the demo, so they move when the rep submits an order. Other reps' figures are the
// synthetic ones in data/field.json (labelled on screen).

const data = modules['data'];
const orders = modules['orders'];
const fmt = modules['format'];

const LOOKBACK = 30;   // "last 30 days" for calls and coverage

/** Outlets assigned to the signed-in rep. */
const myOutlets = () => data.outlets().filter((o) => (o.repId ?? data.myRepId()) === data.myRepId());
const isMine = (outletId) => (data.outlet(outletId)?.repId ?? data.myRepId()) === data.myRepId();

/** Every order the rep gets credit for: past orders at their outlets, plus demo orders
 *  (at another rep's outlet a demo order earns 50% credit, per field.crossTerritory). */
function creditedOrders() {
  const share = (data.field().crossTerritory?.incentiveCreditPct ?? 50) / 100;
  const past = myOutlets().flatMap((o) => data.pastOrders(o.id)).map((o) => ({ order: o, weight: 1 }));
  const demo = orders.demoOrders().map((o) => ({ order: o, weight: isMine(o.outletId) ? 1 : share }));
  return [...past, ...demo];
}

const casesIn = (list, { from, to, skus = null }) => list
  .filter(({ order }) => order.date >= from && order.date <= to)
  .reduce((n, { order, weight }) => n + weight * order.lines
    .filter((l) => !skus || skus.includes(l.sku))
    .reduce((m, l) => m + (l.cases || 0), 0), 0);

function progress(target, achieved, to) {
  const today = data.demoDate();
  const pct = target ? Math.round((achieved / target) * 100) : 0;
  const daysLeft = Math.max(0, fmt.daysBetween(today, to));
  const remaining = Math.max(0, Math.round(target - achieved));
  return { target, achieved: Math.round(achieved), remaining, pct, daysLeft, perDay: daysLeft ? Math.ceil(remaining / daysLeft) : remaining };
}

/** Pre-season placement: focus-SKU cases booked across the rep's outlets in the window. */
function preSeason() {
  const t = data.field().targets.preSeason;
  const to = t.to < data.demoDate() ? t.to : data.demoDate();
  return { ...t, ...progress(t.target, casesIn(creditedOrders(), { from: t.from, to, skus: t.skus }), t.to) };
}

function month() {
  const t = data.field().targets.month;
  return { ...t, ...progress(t.target, casesIn(creditedOrders(), { from: t.from, to: data.demoDate() }), t.to) };
}

/** Today's route work: visits with an order, focus SKUs placed. */
function today() {
  const d = data.demoDate();
  const route = data.route();
  const todays = orders.demoOrders().filter((o) => o.date === d);
  const visited = new Set(todays.map((o) => o.outletId));
  const focus = data.config().focusSkus;
  const withFocus = new Set(todays.filter((o) => o.lines.some((l) => focus.includes(l.sku) && l.cases)).map((o) => o.outletId));
  const focusCases = todays.reduce((n, o) => n + o.lines.filter((l) => focus.includes(l.sku)).reduce((m, l) => m + l.cases, 0), 0);
  const next = route.find((o) => !visited.has(o.id)) ?? null;
  return { routeCount: route.length, visited: visited.size, productive: todays.length ? visited.size : 0, withFocus: withFocus.size, focusCases, next };
}

/** The leaderboard metrics for the signed-in rep (definitions in field.json). */
function myMetrics() {
  const d = data.demoDate();
  const from = fmt.addDays(d, -LOOKBACK);
  const mine = myOutlets();
  const focus = data.config().focusSkus;
  const all = creditedOrders();
  const recent = all.filter(({ order }) => order.date >= from && order.date <= d);
  const active = new Set(recent.map(({ order }) => order.outletId));
  const withFocus = new Set(recent.filter(({ order }) => order.lines.some((l) => focus.includes(l.sku) && l.cases)).map(({ order }) => order.outletId));
  let calls = 0; let productive = 0;
  mine.forEach((o) => (data.visits(o.id)?.visits ?? []).forEach((v) => {
    if (v.date >= from && v.date < d && v.done) { calls += 1; if (v.outcome === 'order') productive += 1; }
  }));
  const todayOrders = orders.demoOrders().filter((o) => o.date === d);
  calls += new Set(todayOrders.map((o) => o.outletId)).size;
  productive += new Set(todayOrders.map((o) => o.outletId)).size;
  const pre = preSeason();
  return {
    repId: data.myRepId(), name: null, isMe: true, outlets: mine.length,
    preSeasonPct: pre.pct,
    productiveCallsPct: calls ? Math.round((productive / calls) * 100) : 0,
    activeOutletsPct: Math.round((active.size / mine.length) * 100),
    focusCoveragePct: active.size ? Math.round((withFocus.size / active.size) * 100) : 0,
    casesOrdered: Math.round(casesIn(all, { from: pre.from, to: d })),
    monthTargetPct: month().pct,
  };
}

/** → { rows (ranked), me, rank, total, metric } ranked by pre-season placement %, the priority metric. */
function leaderboard(name) {
  const lb = data.field().leaderboard;
  const me = { ...myMetrics(), name, territory: data.config().region.name };
  const rows = [...lb.reps.map((r) => ({ ...r, isMe: false })), me]
    .sort((a, b) => b.preSeasonPct - a.preSeasonPct || b.productiveCallsPct - a.productiveCallsPct);
  rows.forEach((r, i) => { r.rank = i + 1; });
  return { rows, me, rank: me.rank, total: rows.length, lb };
}

// ---- today's gain and milestones ---------------------------------------------------------

/** Focus-pack cases added to the summer target by today's orders (demo orders only). */
function targetToday() {
  const d = data.demoDate();
  const t = data.field().targets.preSeason;
  const share = (data.field().crossTerritory?.incentiveCreditPct ?? 50) / 100;
  return Math.round(orders.demoOrders().filter((o) => o.date === d)
    .reduce((n, o) => n + (isMine(o.outletId) ? 1 : share) * o.lines.filter((l) => t.skus.includes(l.sku)).reduce((m, l) => m + l.cases, 0), 0));
}

/**
 * Small wins for today, in the order they are usually reached. Each is { id, icon, text key, vars }.
 * Test them in the demo: book the first order; book at 3 outlets with a focus pack; reach 5 outlets;
 * add 100 focus cases in a day; every 5% step of the summer target.
 */
function milestones() {
  const day = today();
  const pre = preSeason();
  const gain = targetToday();
  const startPct = pre.target ? Math.floor(((pre.achieved - gain) / pre.target) * 100) : 0;
  const out = [];
  if (day.visited >= 1) out.push({ id: 'first-order', icon: 'check', key: 'f.ms.first' });
  if (day.withFocus >= 3) out.push({ id: 'focus-3', icon: 'target', key: 'f.ms.focus3' });
  if (day.visited >= 5) out.push({ id: 'five', icon: 'route', key: 'f.ms.five' });
  if (day.visited >= 10) out.push({ id: 'ten', icon: 'route', key: 'f.ms.ten' });
  if (gain >= 100) out.push({ id: 'gain-100', icon: 'trend', key: 'f.ms.gain100' });
  for (let step = Math.ceil((startPct + 1) / 5) * 5; step <= pre.pct; step += 5) {
    out.push({ id: `step-${step}`, icon: 'trophy', key: 'f.ms.step', vars: { pct: step } });
  }
  return out;
}

return { myOutlets, preSeason, month, today, myMetrics, leaderboard, targetToday, milestones };
})();

/* ==================== js/feature/landing.js ==================== */
modules['feature/landing'] = (() => {
// Landing additions, filled into home.js's slots:
//   landing-hero  clock in/out, rank chip and the summer target, inside the branded header
//   landing-top   alert banners (new schemes, distributor stock changes); all of them on #/updates
//   landing-next  the next outlet on the route, and today's small wins
// Everything is computed from the data, the demo orders and what the rep recorded in this browser.

const { app, session } = modules['app'];
const data = modules['data'];
const schemes = modules['schemes'];
const fmt = modules['format'];
const { t, label } = modules['i18n'];
const { html, mount, icon, openSheet, toast } = modules['ui'];
const store = modules['feature/store'];
const metrics = modules['feature/metrics'];
const { quickActions } = modules['feature/outlet-tools'];

const NEW_SCHEME_DAYS = 30;   // a scheme is "new" for 30 days after it starts
const SOON_DAYS = 7;          // …and announced 7 days before it starts
const MAX_ALERTS = 3;         // never more than three banners at once

function install() {
  app.on('screen:rendered', ({ screen, root }) => {
    if (screen !== 'home') return;
    fillHero(root);
    fillAlerts(root);
    fillNext(root);
  });
}

const hm = (mins) => (mins >= 60 ? t('f.clock.hm', { h: Math.floor(mins / 60), m: mins % 60 }) : t('f.clock.m', { m: mins }));

// ---- header: clock, rank, summer target -------------------------------------------------------

function fillHero(root) {
  const slot = root.querySelector('[data-slot="landing-hero"]');
  if (!slot) return;
  const draw = () => {
    const st = store.clockState();
    const mins = store.dutyMinutes();
    const board = metrics.leaderboard(session.name());
    const pre = metrics.preSeason();
    const gain = metrics.targetToday();
    const mon = metrics.month();
    const clock = st.state === 'in'
      ? html`<button type="button" class="hchip is-on" data-clock="out"><span class="live-dot"></span><span>${t('f.clock.onFor', { dur: hm(mins) })}</span><span class="hchip-act">${t('f.clock.out')}</span></button>`
      : st.state === 'closed'
        ? html`<button type="button" class="hchip is-closed" data-clock="in">${icon('check')}<span>${t('f.clock.dayDone', { dur: hm(mins) })}</span></button>`
        : html`<button type="button" class="hchip is-start" data-clock="in">${icon('clock')}<span>${t('f.clock.in')}</span></button>`;
    mount(slot, html`
      <div class="hero-chips">
        ${clock}
        <a class="hchip is-rank" href="#/leaderboard">${icon('trophy')}<span>${t('f.rank.chip', { rank: board.rank, total: board.total })}</span>${icon('chevron')}</a>
      </div>
      <details class="goal">
        <summary>
          <span class="ring" style="--p:${Math.min(100, pre.pct)}" aria-hidden="true"><span>${pre.pct}%</span></span>
          <span class="goal-main">
            <span class="goal-title">${t('f.target.title')}</span>
            <span class="goal-nums"><strong>${fmt.num(pre.achieved)}</strong> / ${fmt.num(pre.target)} ${t('f.target.cases')}</span>
            <span class="goal-meta">${gain ? html`<span class="goal-gain">${icon('trend')}+${fmt.num(gain)} ${t('f.target.today')}</span>` : ''}<span>${t('f.target.daysLeft', { n: pre.daysLeft })}</span></span>
          </span>
          ${icon('chevron', 'collapse-chev')}
        </summary>
        <div class="goal-body">
          <p class="goal-line">${icon('target')}<span>${pre.remaining ? t('f.target.pace', { n: fmt.num(pre.perDay) }) : t('f.target.done')}</span></p>
          <p class="goal-line">${icon('box')}<span>${t('f.target.counts', { skus: pre.skus.map((s) => shortName(s)).join(', ') })}</span></p>
          <p class="goal-line">${icon('calendar')}<span>${t('f.target.window', { from: fmt.shortDate(pre.from), to: fmt.shortDate(pre.to) })}</span></p>
          <div class="goal-sub"><span>${t('f.target.month')}</span><span class="num"><strong>${fmt.num(mon.achieved)}</strong> / ${fmt.num(mon.target)} · ${mon.pct}%</span></div>
        </div>
      </details>`);
    slot.hidden = false;
  };
  draw();
  slot.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-clock]');
    if (!btn) return;
    if (btn.dataset.clock === 'in') { store.clockIn(); toast(t('f.clock.inToast', { time: store.timeNow() }), 'clock'); }
    else { store.clockOut(); toast(t('f.clock.outToast', { dur: hm(store.dutyMinutes()) }), 'clock'); }
    draw();
  });
}

/** "Cola 250 ml" from "Cola 250 ml PET". */
const shortName = (sku) => String(data.product(sku)?.name ?? sku).replace(/\s+(PET|Tetra|returnable glass|can)$/i, (m) => (/glass/i.test(m) ? ' glass' : ''));

// ---- alerts ------------------------------------------------------------------------------------

function schemeAlerts(today) {
  return data.schemes()
    .filter((s) => s.type !== 'program' && s.validFrom && s.validTo >= today)
    .filter((s) => fmt.daysBetween(s.validFrom, today) <= NEW_SCHEME_DAYS && fmt.daysBetween(today, s.validFrom) <= SOON_DAYS)
    .map((s) => ({
      id: `scheme:${s.id}`, kind: 'scheme', tone: 'scheme', icon: 'tag', scheme: s,
      tag: s.validFrom > today ? t('f.alert.tagSoon') : t('f.alert.tagNew'),
      title: s.name,
      sub: `${schemes.chipText(s)} · ${s.validFrom > today ? t('f.alert.from', { date: fmt.shortDate(s.validFrom) }) : t('f.alert.till', { date: fmt.shortDate(s.validTo) })}`,
    }));
}

const statusRank = { 'out-of-stock': 0, rationed: 1, 'rationed-against-empties': 1, low: 2, available: 3 };

/** Only real changes since yesterday's sync: a ration raised or cut, a pack going out, low or back. */
function stockAlerts() {
  const before = new Map((data.field().stockYesterday?.items ?? []).map((x) => [x.sku, x]));
  const out = [];
  for (const now of data.stock().items) {
    const st = now.sourceStatus ?? 'available';
    const prev = before.get(now.sku);
    const prevSt = prev?.status ?? 'available';
    const name = data.product(now.sku)?.name ?? now.sku;
    let title = null; let up = false;
    if (st === prevSt && st === 'rationed' && prev.rationPerOutletCases !== now.maxCasesPerOutlet) {
      up = now.maxCasesPerOutlet > prev.rationPerOutletCases;
      title = t(up ? 'f.alert.rationUp' : 'f.alert.rationDown', { name, n: now.maxCasesPerOutlet });
    } else if (st !== prevSt) {
      up = statusRank[st] > statusRank[prevSt];
      title = t(`f.alert.stock.${st}`, { name });
    }
    // The tag follows the pack's status now: anything still limited is a stock alert, even when
    // the limit was raised; only a pack that is fully available again is "back in stock".
    // Colour follows how bad it is: out of stock (red), limited per shop (orange), running low (amber).
    const tone = st === 'available' ? 'up' : st === 'out-of-stock' ? 'crit' : st === 'low' ? 'low' : 'down';
    const tag = { up: t('f.alert.tagUp'), crit: t('f.alert.tagOut'), low: t('f.alert.tagLow'), down: t('f.alert.tagDown') }[tone];
    if (title) out.push({ id: `stock:${now.sku}:${st}:${now.maxCasesPerOutlet ?? ''}`, kind: 'stock', tone, icon: tone === 'up' ? 'check' : 'alert', item: now,
      tag, title, sub: now.note, rank: { crit: 0, down: 1, low: 2, up: 3 }[tone] });
  }
  return out.sort((a, b) => a.rank - b.rank);
}

async function openAlert(a) {
  store.markSeen(a.id);
  if (a.kind === 'scheme') {
    const s = a.scheme;
    const r = s.rule ?? {};
    const threshold = s.type === 'free-goods' ? t('f.sch.thrFree', { n: r.buyCases, pooled: r.pooled && s.skus.length > 1 ? t('f.sch.pooled') : '' })
      : s.type === 'percent-off' ? t('f.sch.thrPct', { n: r.minCases }) : t('f.sch.thrFirst', { days: r.withinDaysOfRegistration });
    const benefit = s.type === 'free-goods' ? t('f.sch.benFree', { n: r.freeCases }) : t('f.sch.benPct', { pct: r.percent });
    const tiers = Array.isArray(s.eligibleTiers) ? s.eligibleTiers.map((x) => label('tier', x)).join(', ') : t('f.sch.allTiers');
    const packs = Array.isArray(s.skus) ? s.skus.map((k) => data.product(k)?.name ?? k) : null;
    const say = s.type === 'free-goods' ? t('f.sch.sayFree', { buy: r.buyCases, free: r.freeCases, mix: r.pooled && s.skus.length > 1 ? t('f.sch.sayMix') : '' })
      : s.type === 'percent-off' ? t('f.sch.sayPct', { min: r.minCases, pct: r.percent }) : t('f.sch.sayFirst', { pct: r.percent });
    await openSheet({
      title: s.name,
      body: html`<div class="tiles sheet-tiles">
          <div class="tile"><span class="tile-l">${icon('target')}${t('f.sch.threshold')}</span><span class="tile-row"><b class="tile-v">${threshold}</b></span></div>
          <div class="tile is-blue"><span class="tile-l">${icon('tag')}${t('f.sch.benefit')}</span><span class="tile-row"><b class="tile-v">${benefit}</b></span></div>
          <div class="tile"><span class="tile-l">${icon('calendar')}${t('f.sch.valid')}</span><span class="tile-row"><b class="tile-v">${t('common.till', { date: fmt.shortDate(s.validTo) })}</b><span class="tile-s">${t('f.alert.from', { date: fmt.shortDate(s.validFrom) })}</span></span></div>
          <div class="tile"><span class="tile-l">${icon('store')}${t('f.sch.tiers')}</span><span class="tile-row"><b class="tile-v">${tiers}</b>${s.requiresBottlerCooler ? html`<span class="tile-s">${t('f.sch.cooler')}</span>` : ''}</span></div>
        </div>
        <p class="fold-sub">${t('f.sch.skus')}</p>
        ${packs ? html`<ul class="pack-list">${packs.map((n) => html`<li>${n}</li>`)}</ul>` : html`<p class="muted">${t('f.sch.allSkus')}</p>`}
        <div class="say-box"><p class="say-label">${icon('chat')}<span>${t('f.sch.say')}</span></p><p>${say}</p></div>`,
      actions: [{ key: 'close', label: t('f.common.ok'), tone: 'primary' }],
      dismissKey: 'close',
    });
  } else {
    const it = a.item;
    await openSheet({
      title: data.product(it.sku)?.name ?? it.sku,
      body: html`<div class="facts">
          <p>${icon('box')}<span><b>${t('f.stock.status')}</b>${t(`f.stock.s.${it.sourceStatus ?? 'available'}`)}</span></p>
          ${it.maxCasesPerOutlet ? html`<p>${icon('store')}<span><b>${t('f.stock.ration')}</b>${t('f.stock.perOutlet', { n: it.maxCasesPerOutlet })}</span></p>` : ''}
          ${it.note ? html`<p>${icon('info')}<span><b>${t('f.stock.note')}</b>${it.note}</span></p>` : ''}
        </div>
        <p class="fine">${t('f.stock.sync', { time: String(data.stock().syncedAt ?? '').slice(11, 16) })}</p>`,
      actions: [{ key: 'close', label: t('f.common.ok'), tone: 'primary' }],
      dismissKey: 'close',
    });
  }
}

/** Every update for today, newest kind first. The landing shows the unread ones (up to three);
 *  #/updates shows them all again. */
const allAlerts = () => [...schemeAlerts(data.demoDate()), ...stockAlerts()];
const currentAlerts = () => allAlerts().filter((a) => !store.seen(a.id)).slice(0, MAX_ALERTS);

const alertCard = (a, i) => html`<button type="button" class="alert tone-${a.tone}" data-alert="${i}">
  <span class="alert-icon">${icon(a.icon)}</span>
  <span class="alert-text"><span class="alert-tag">${a.tag}</span><span class="alert-title">${a.title}</span>${a.sub ? html`<span class="alert-sub">${a.sub}</span>` : ''}</span>
  <span class="alert-go">${t('f.alert.view')}</span>
</button>`;

function fillAlerts(root) {
  const slot = root.querySelector('[data-slot="landing-top"]');
  if (!slot) return;
  const alerts = currentAlerts();
  if (!allAlerts().length) { slot.hidden = true; return; }
  const draw = () => {
    const left = [...slot.querySelectorAll('[data-alert]')].length;
    const head = slot.querySelector('[data-head]');
    if (head) head.textContent = left ? t('f.alert.head', { n: left }) : t('f.alert.none');
  };
  mount(slot, html`<div class="alerts">
    <div class="alerts-head"><p class="${alerts.length ? '' : 'is-quiet'}">${icon('bell')}<span data-head>${alerts.length ? t('f.alert.head', { n: alerts.length }) : t('f.alert.none')}</span></p>
      <a class="alerts-all" href="#/updates">${t('f.alert.viewAll')}${icon('chevron')}</a></div>
    ${alerts.map(alertCard)}</div>`);
  slot.hidden = false;
  slot.querySelectorAll('[data-alert]').forEach((btn) => btn.addEventListener('click', async () => {
    await openAlert(alerts[Number(btn.dataset.alert)]);
    btn.remove();
    draw();
  }));
}

// ---- next outlet and today's wins ------------------------------------------------------------------

function fillNext(root) {
  const slot = root.querySelector('[data-slot="landing-next"]');
  if (!slot) return;
  const day = metrics.today();
  const wins = metrics.milestones();
  const fresh = wins.filter((w) => !store.seen(`ms:${w.id}`));
  fresh.forEach((w) => store.markSeen(`ms:${w.id}`));
  const latest = wins.at(-1);
  const n = day.next;
  mount(slot, html`
    ${latest ? html`<p class="win is-reward ${fresh.length ? 'is-new' : ''}"><span class="win-ico">${icon(latest.icon)}</span><span>${t(latest.key, latest.vars ?? {})}</span>${wins.length > 1 ? html`<span class="win-count">+${wins.length - 1}</span>` : ''}</p>` : ''}
    ${n ? html`<section class="next">
      <p class="next-label">${t('f.next.label', { stop: data.visits(n.id)?.routeOrder ?? '' })}</p>
      <div class="next-row">
        <a class="next-main" href="#/outlet/${n.id}"><span class="next-name">${n.name}</span><span class="next-meta">${label('area', n.area)} · ${label('ch', n.channel)}</span></a>
        ${quickActions(n)}
      </div>
      <a class="btn next-go" href="#/outlet/${n.id}">${t('f.next.open')}${icon('chevron')}</a>
    </section>` : html`<p class="win is-new">${icon('check')}<span>${t('f.next.allDone')}</span></p>`}`);
  slot.hidden = false;
}

return { install, openAlert, allAlerts, alertCard };
})();

/* ==================== js/screens/updates.js ==================== */
modules['screens/updates'] = (() => {
// Updates: every alert for today (new schemes, distributor stock changes), read or not, so the rep
// can look at them again after tapping them away on Landing. Same cards, grouped by kind.

const data = modules['data'];
const fmt = modules['format'];
const { t } = modules['i18n'];
const { html, mount, fresh, icon, appBar, emptyState } = modules['ui'];
const store = modules['feature/store'];
const { allAlerts, alertCard, openAlert } = modules['feature/landing'];

function render(root) {
  const view = fresh(root);
  const list = allAlerts();
  const groups = [
    { key: 'stock', title: t('f.upd.stock'), items: list.filter((a) => a.kind === 'stock') },
    { key: 'scheme', title: t('f.upd.schemes'), items: list.filter((a) => a.kind === 'scheme') },
  ].filter((g) => g.items.length);
  const unread = list.filter((a) => !store.seen(a.id)).length;

  mount(view, html`
    ${appBar({ title: t('f.upd.title'), sub: fmt.date(data.demoDate()), back: '#/home' })}
    <div class="page page-upd">
      ${list.length ? html`
        <p class="upd-sum">${unread ? t('f.upd.unread', { n: unread }) : t('f.alert.none')}</p>
        ${groups.map((g) => html`<section class="upd-group">
          <h2 class="section-title">${g.title} · ${g.items.length}</h2>
          <div class="alerts upd-list">${g.items.map((a) => html`<div class="upd-item ${store.seen(a.id) ? 'is-read' : ''}">${alertCard(a, list.indexOf(a))}</div>`)}</div>
        </section>`)}`
      : emptyState({ icon: 'bell', title: t('f.alert.none'), body: '' })}
    </div>`);

  view.querySelectorAll('[data-alert]').forEach((btn) => btn.addEventListener('click', async () => {
    await openAlert(list[Number(btn.dataset.alert)]);
    btn.closest('.upd-item')?.classList.add('is-read');
  }));
}

return { render };
})();

/* ==================== js/screens/leaderboard.js ==================== */
modules['screens/leaderboard'] = (() => {
// Leaderboard: every rep in the district, ranked by summer target %, the priority this season.
// Compact rows that open to show the other numbers. The rep's own card shows all five at once.
// The rep's own row is computed live (feature/metrics.js); the other reps are demo data.

const { session } = modules['app'];
const data = modules['data'];
const fmt = modules['format'];
const { t } = modules['i18n'];
const { html, mount, fresh, icon, appBar } = modules['ui'];
const metrics = modules['feature/metrics'];

const METRICS = [
  { key: 'productiveCallsPct', icon: 'check', pct: true },
  { key: 'activeOutletsPct', icon: 'store', pct: true },
  { key: 'focusCoveragePct', icon: 'target', pct: true },
  { key: 'monthTargetPct', icon: 'calendar', pct: true },
  { key: 'casesOrdered', icon: 'box', pct: false },
];
const MEDAL = ['#f4c542', '#c9d1dc', '#d9925a'];
const TINTS = ['#e8f0ff', '#e3f5ea', '#fff1dc', '#f0ebfb', '#fde8ee', '#e0f4f7'];

/** A small 'i' next to a metric's name; tapping it shows what the metric means. */
const info = (key) => html`<button type="button" class="tip-i" data-tip="${key}" aria-label="${t('f.lb.defs')}: ${t(`f.lb.short.${key}`)}">i</button>`;

const value = (m, r) => (m.pct ? `${r[m.key]}%` : fmt.num(r[m.key]));
const initials = (name) => String(name).split(' ').map((w) => w[0]).slice(0, 2).join('').toUpperCase();

function render(root) {
  const view = fresh(root);
  const { rows, me, total, lb } = metrics.leaderboard(session.name());
  const ahead = rows[rows.indexOf(me) - 1];

  mount(view, html`
    ${appBar({ title: t('f.lb.title'), sub: `${lb.district} · ${fmt.dateRange(lb.period.from, lb.period.to, data.demoDate())}`, back: '#/home' })}
    <div class="page page-lb">
      <section class="lb-me">
        <div class="lb-me-top">
          <span class="lb-me-rank">#${me.rank}<small>/${total}</small></span>
          <div class="lb-me-text">
            <p class="lb-me-name">${t('f.lb.youAre', { name: me.name })}</p>
            <p class="lb-me-gap">${ahead ? t('f.lb.gap', { gap: ahead.preSeasonPct - me.preSeasonPct, name: ahead.name.split(' ')[0] }) : t('f.lb.top')}</p>
          </div>
          <span class="lb-me-pct"><b>${me.preSeasonPct}%</b><small>${t('f.lb.short.preSeasonPct')}${info('preSeasonPct')}</small></span>
        </div>
        <div class="lb-tiles">${METRICS.map((m) => html`<div class="lb-tile">${icon(m.icon)}<b>${value(m, me)}</b><span>${t(`f.lb.short.${m.key}`)}${info(m.key)}</span></div>`)}</div>
      </section>

      <p class="lb-list-head"><span>${t('f.lb.rep')}</span><span>${t('f.lb.short.preSeasonPct')}${info('preSeasonPct')}</span></p>
      <ol class="lb-list">
        ${rows.map((r, i) => html`<li class="${r.isMe ? 'is-me' : ''}">
          <details class="lb-row">
            <summary>
              <span class="lb-pos" style="${i < 3 ? `background:${MEDAL[i]}` : ''}">${r.rank}</span>
              <span class="lb-avatar" style="background:${TINTS[i % TINTS.length]}">${initials(r.name)}</span>
              <span class="lb-main"><span class="lb-name">${r.isMe ? t('f.lb.you', { name: r.name }) : r.name}</span><span class="lb-terr">${r.territory} · ${t('f.lb.outlets', { n: r.outlets })}</span></span>
              <span class="lb-score"><b>${r.preSeasonPct}%</b></span>
            </summary>
            <div class="lb-more">${METRICS.map((m) => html`<span>${icon(m.icon)}<b>${value(m, r)}</b> ${t(`f.lb.short.${m.key}`)}</span>`)}</div>
          </details>
        </li>`)}
      </ol>

    </div>`);

  // One definition bubble at a time, under the 'i' that was tapped; any other tap closes it.
  let bubble = null;
  const close = () => { bubble?.remove(); bubble = null; view.querySelector('.tip-i.is-open')?.classList.remove('is-open'); };
  view.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-tip]');
    const wasOpen = btn?.classList.contains('is-open');
    close();
    if (!btn || wasOpen) return;
    e.stopPropagation();
    e.preventDefault();
    btn.classList.add('is-open');
    bubble = document.createElement('div');
    bubble.className = 'tip-bubble';
    bubble.setAttribute('role', 'tooltip');
    bubble.innerHTML = String(html`<b>${t(`f.lb.short.${btn.dataset.tip}`)}</b><span>${t(`f.lb.def.${btn.dataset.tip}`)}</span>`);
    view.append(bubble);
    const r = btn.getBoundingClientRect();
    const host = view.getBoundingClientRect();
    const w = Math.min(280, host.width - 24);
    const left = Math.max(12, Math.min(r.left + r.width / 2 - host.left - w / 2, host.width - w - 12));
    bubble.style.width = `${w}px`;
    bubble.style.left = `${left}px`;
    bubble.style.top = `${r.bottom - host.top + 8}px`;
    bubble.style.setProperty('--arrow', `${r.left + r.width / 2 - host.left - left}px`);
  });
}

return { render };
})();

/* ==================== js/feature/season-engine.js ==================== */
modules['feature/season-engine'] = (() => {
// Season Check engine v2: how much an outlet should order today, pack by pack, and what in the
// live cart needs a word. Pure calculation (no DOM): screens call need() and check() and render.
//
//   Expected(pack) = recent rate × season ratio × heat × rain × events, over the selling days
//                    this order must cover (delivery → the next delivery).
//   Modes:  forward (normal) · closing (closure ahead: selling days only) · bookings (event-led)
//           · peers (thin history: similar shops) · silent (wholesale).
//   Realisable = Expected after the gates, in rules v1.1 order:
//                closure → de-load → distributor → cooler → credit → safe cap.
//   Leaked = Expected − Realisable (before and after swaps).
//
// Only three numbers come from the paper (Keleş, Gómez-Acevedo & Shaikh 2018, IJPE 195), which uses
// US data in °F: +2.1% per °F in a heat wave (= 3.78% per °C), −0.4% per °F in a cold wave
// (= 0.72% per °C), and the asymmetry. 1 °C = 1.8 °F, so per-°C effects are 1.8 × the per-°F ones. Everything else is
// in PARAMS and labelled. Full spec: docs/season-check-algo-v2.md.
//
// APP ADDITION (marked "APP:" below): stock already on the shelf (current_stock.json, the rep's
// count where there is one) is netted off each pack after rounding and before the gates, and
// reported as `totals.onHand`, not as leak. Switch it off with PARAMS.netOnHand = false.

const data = modules['data'];
const orders = modules['orders'];
const schemes = modules['schemes'];
const fmt = modules['format'];

const PARAMS = {
  rateWeeks: 4,                     // v1.1 forward baseline: the last 4 complete weeks of this year
  seasonRatioClamp: [0.5, 2.0],     // guard against a bad index week
  amplitudeClamp: [0.2, 2.0],       // outlet's season amplitude vs the region's (from its own 2025 history)
  heat: {
    paperPerF: 0.021,               // PAPER: +2.1% weekly demand per °F above normal, in a heat wave (US data)
    paperColdPerF: 0.004,           // PAPER: −0.4% per °F below normal, in a cold wave
    slopeAvg: 0.021 * 1.8,          // = 0.0378 per °C (our temperatures are °C; 1 °C = 1.8 °F)
    coldSlope: 0.004 * 1.8,         // = 0.0072 per °C
    slopeClamp: [0.009, 0.072],     // ASSUMPTION: exposure scaling kept within 0.9–7.2%/°C (0.5–4%/°F)
    // Pune mean daily maximum by month, 1991–2020 (IMD via the Wikipedia climate table). Verify
    // against IMD's Shivajinagar station normals before quoting.
    normalMaxC: [29.8, 32.2, 35.6, 37.9, 37.3, 32.0, 28.3, 27.8, 29.5, 31.5, 30.7, 29.5],
    // Weekly maxima for the rate window (research Table A; IMD readings where found, else estimates).
    recentMaxC: { '2026-W14': 37.5, '2026-W15': 39.8, '2026-W16': 39.5, '2026-W17': 39.0 },
    // IMD heat-wave criteria (plains). A single forecast only shows "heat-wave conditions".
    imd: { minMaxC: 40, departure: 4.5, severeDeparture: 6.4, absoluteC: 45, severeAbsoluteC: 47 },
  },
  rain: { none: 1.0, low: 1.0, moderate: 0.85, high: 0.6 },   // ASSUMPTION (expected factor per day)
  deloadFactor: 0.7,                // ASSUMPTION: rain or monsoon phase inside the cover window
  thin: { minAgeDays: 90, minInSeasonOrders: 3 },           // v1.1 thin-history rule
  newOutletStart: 0.8,              // ASSUMPTION: first order = 80% of the similar-shop estimate, top up next visit
  coolerTurnsPerDay: 0.25,          // CALIBRATED: a normal peak order fits, a doubled one doesn't (research Table F turns don't fit our volumes)
  safeCap: 1.5,                     // v1.1: a suggestion ≤ 1.5 × the best order in the last 8 weeks
  largerThanUsual: 1.5,             // v1.1: cart > 1.5 × expected → rep-only note
  pace: { minGap: 1, pct: 0.15, maxFindings: 3 },           // a pace gap must be ≥ 1 case and ≥ 15%
  missingRegular: { lastOrders: 4, minHits: 3 },            // v1.1
  thresholdWithin: 2,               // nudge when 1–2 cases short of a scheme the outlet can get
  substitutes: { CL250: ['CL200G', 'LL250', 'CL300C'], MG600: ['MG150T'] },   // first in stock wins; CL200G keeps Summer Single-Serve
  noFizzTags: ['school'],           // FSSAI 2020 school rule: no sparkling or energy drinks suggested
  noFizzCategories: ['Sparkling', 'Energy'],
  netOnHand: true,                  // APP: subtract estimated stock on hand (current_stock.json) from the order
};

// ---- small helpers -------------------------------------------------------------------------

const clamp = (x, [lo, hi]) => Math.min(hi, Math.max(lo, x));
const mean = (xs) => (xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : 0);
const multOf = (m) => (Array.isArray(m) ? mean(m.filter((v) => v != null)) : Number(m ?? 1));
const r1 = (x) => Math.round(x * 10) / 10;
const productName = (sku) => data.product(sku)?.name ?? sku;
const isChilledSS = (p) => p?.chilled === 'yes' && p?.singleServe;
const isFizz = (p) => PARAMS.noFizzCategories.includes(p?.category);

const eventApplies = (e, o) => {
  const ch = e.appliesTo?.channels ?? [];
  const tags = e.appliesTo?.tags ?? [];
  return (!ch.length || ch.includes(o.channel)) && (!tags.length || tags.some((x) => (o.tags ?? []).includes(x)));
};
const isLocationEvent = (e) => !(e.appliesTo?.channels ?? []).length && (e.appliesTo?.tags ?? []).length > 0;

function daysFrom(from, n) {
  return Array.from({ length: Math.max(0, n) }, (_, i) => fmt.addDays(from, i));
}

/** Pune normal max for a date: monthly means pinned to mid-month, linearly interpolated. */
function normalMax(iso) {
  const N = PARAMS.heat.normalMaxC;
  const d = fmt.parseISO(iso);
  const m = d.getUTCMonth();
  const day = d.getUTCDate();
  const [a, b, w] = day >= 15 ? [m, (m + 1) % 12, (day - 15) / 30] : [(m + 11) % 12, m, (day + 15) / 30];
  return N[a] + (N[b] - N[a]) * w;
}

// ---- the order window ----------------------------------------------------------------------

/** { today, delivery, nextVisit, nextDelivery, days[] }: the days today's order must last. */
function coverFor(o) {
  const today = data.demoDate();
  const lead = data.config().distributor?.deliveryLeadDays ?? 1;
  const v = data.visits(o.id);
  const nextVisit = v?.nextVisitAfterToday ?? fmt.addDays(today, v?.cadenceDays ?? Math.round(28 / (o.visitsPerMonth || 4)));
  const delivery = fmt.addDays(today, lead);
  const nextDelivery = fmt.addDays(nextVisit, lead);
  return { today, delivery, nextVisit, nextDelivery, days: daysFrom(delivery, fmt.daysBetween(delivery, nextDelivery)) };
}

// ---- season index and amplitude ------------------------------------------------------------

function indexFor(week) {
  const ri = data.calendar()?.regionIndex ?? {};
  const year = week.slice(0, 4);
  const byYear = ri[year] ?? {};
  if (byYear[week] != null) return byYear[week];
  // No index past the demo week (no hindsight): hold the latest known week.
  const known = Object.keys(byYear).filter((k) => k <= week).sort();
  return known.length ? byYear[known.at(-1)] : 1;
}

const weekIdx = () => data.historyWeeks().weeks;
const weekStart = (i) => data.historyWeeks().weekStarts?.[i];

function totalsByWeek(outletId) {
  const h = data.history(outletId);
  const n = weekIdx().length;
  const out = Array(n).fill(0);
  Object.values(h).forEach((arr) => arr.forEach((v, i) => { out[i] += v || 0; }));
  return out;
}

const rolling4 = (xs) => xs.map((_, i) => (i >= 3 ? mean(xs.slice(i - 3, i + 1)) : null)).filter((x) => x != null);

/** Lift in 2025: best 4-week average ÷ Jan–Feb average. */
function lift2025(series) {
  const weeks = weekIdx();
  const jf = [];
  const yr = [];
  weeks.forEach((w, i) => {
    if (!w.startsWith('2025')) return;
    yr.push(series[i]);
    const ws = weekStart(i) ?? '';
    if (ws.startsWith('2025-01') || ws.startsWith('2025-02') || (!ws && Number(w.slice(6)) <= 9)) jf.push(series[i]);
  });
  const base = mean(jf);
  const peak = Math.max(0, ...rolling4(yr));
  return base > 0 ? peak / base : null;
}

const memo = new Map();
const cached = (key, fn) => (memo.has(key) ? memo.get(key) : (memo.set(key, fn()), memo.get(key)));

function regionLift() {
  return cached('regionLift', () => {
    const ri = data.calendar()?.regionIndex?.['2025'] ?? {};
    return lift2025(weekIdx().map((w) => ri[w] ?? 0)) ?? 2.2;
  });
}

/** How strongly this outlet's season follows the region's (k = 1: same shape). */
function amplitude(o) {
  return cached(`k:${o.id}`, () => {
    const L = lift2025(totalsByWeek(o.id));
    if (!L) return 1;
    return clamp((L - 1) / (regionLift() - 1), PARAMS.amplitudeClamp);
  });
}

// ---- heat exposure (per outlet × pack) -----------------------------------------------------

function sigma(sku) {
  const ps = data.products();
  const avg = mean(ps.map((p) => p.summerMultiplier ?? 1));
  const p = data.product(sku);
  return avg > 1 ? Math.max(0, ((p?.summerMultiplier ?? avg) - 1) / (avg - 1)) : 1;
}

function exposure(o, sku) {
  const L = lift2025(totalsByWeek(o.id));
  return Math.max(0, (L ?? regionLift()) - 1) * sigma(sku);
}

/** Volume-weighted normaliser so the average slope stays at the paper's 2.1%/°F (3.78%/°C). */
function exposureNorm() {
  return cached('Ebar', () => {
    let sw = 0;
    let swr = 0;
    data.outlets().forEach((o) => {
      const h = data.history(o.id);
      Object.entries(h).forEach(([sku, arr]) => {
        const w = arr.reduce((a, b) => a + (b || 0), 0);
        if (!w) return;
        sw += w;
        swr += w * Math.sqrt(exposure(o, sku));
      });
    });
    return sw ? (swr / sw) ** 2 : 1;
  });
}

function slopeFor(o, sku) {
  const E = exposure(o, sku);
  return clamp(PARAMS.heat.slopeAvg * Math.sqrt(E / exposureNorm()), PARAMS.heat.slopeClamp);
}

const heatOf = (slope, a) => 1 + slope * Math.max(0, a) - PARAMS.heat.coldSlope * Math.max(0, -a);

// ---- weather ---------------------------------------------------------------------------------

function forecastFor(iso, whatIf) {
  if (whatIf?.forecastMaxC != null) return { maxC: whatIf.forecastMaxC, rainChance: whatIf.rainChance ?? 'none' };
  const p = (data.calendar()?.forecast?.periods ?? []).find((x) => x.from <= iso && iso <= x.to);
  if (!p) return null;
  const maxC = Array.isArray(p.maxC) ? mean(p.maxC) : p.maxC;
  return { maxC, rainChance: p.rainChance ?? 'none' };
}

function heatWaveFlag(maxC, anomaly) {
  const k = PARAMS.heat.imd;
  if (maxC >= k.severeAbsoluteC || (maxC >= k.minMaxC && anomaly > k.severeDeparture)) return 'severe';
  if (maxC >= k.absoluteC || (maxC >= k.minMaxC && anomaly >= k.departure)) return 'conditions';
  return 'none';
}

/** Average anomaly of the rate window (recent weeks already carry their own weather). */
function recentAnomaly(weeks) {
  const rec = PARAMS.heat.recentMaxC;
  const xs = weeks.filter((w) => rec[w] != null).map((w) => {
    const i = weekIdx().indexOf(w);
    const mid = weekStart(i) ? fmt.addDays(weekStart(i), 3) : null;
    return mid ? rec[w] - normalMax(mid) : null;
  }).filter((x) => x != null);
  return xs.length ? mean(xs) : 0;
}

// ---- events ------------------------------------------------------------------------------------

function eventFactor(o, sku, iso, { locationOnly = false } = {}) {
  let f = 1;
  (data.calendar()?.events ?? []).forEach((e) => {
    if (e.anchor || !(e.from <= iso && iso <= e.to) || !eventApplies(e, o)) return;
    if (locationOnly && !isLocationEvent(e)) return;
    if (Array.isArray(e.packs) && e.packs.length && !e.packs.includes(sku)) return;
    f *= multOf(e.multiplier);
  });
  return f;
}

function eventsIn(o, days, { locationOnly = false } = {}) {
  const from = days[0];
  const to = days.at(-1);
  if (!from) return [];
  return (data.calendar()?.events ?? [])
    .filter((e) => !e.anchor && e.from <= to && e.to >= from && eventApplies(e, o) && (!locationOnly || isLocationEvent(e)))
    .map((e) => ({ id: e.id, name: e.name, from: e.from, to: e.to, factor: r1(multOf(e.multiplier) * 100) / 100, packs: e.packs ?? null }));
}

// ---- history helpers -------------------------------------------------------------------------

const pastOnly = (o, today) => orders.allOrdersFor(o.id).filter((x) => x.source !== 'demo' && x.date < today);
const paid = (x) => orders.paidCases(x);

function isClosed(o, iso) {
  return (o.closures ?? []).some((c) => c.from <= iso && iso <= c.to);
}

function inSeasonOrders(o, today) {
  const ph = data.calendar()?.phases?.[today.slice(0, 4)] ?? {};
  const start = Object.keys(ph).sort().find((w) => ph[w] && ph[w] !== 'off-season');
  const past = pastOnly(o, today);
  if (!start) return past.length;
  return past.filter((x) => fmt.isoWeek(x.date) >= start).length;
}

function peerGroup(o) {
  const groups = data.peers()?.groups ?? [];
  const cool = o.cooler?.type ?? 'none';
  const coolKey = cool === 'none' ? 'none' : cool;
  return groups.find((g) => g.channel === o.channel && g.tier === o.tier && (g.cooler ?? 'none') === coolKey)
    ?? groups.find((g) => g.channel === o.channel && g.tier === o.tier)
    ?? groups.find((g) => (g.cooler ?? 'none') === coolKey && g.tier === o.tier)
    ?? null;
}

function recentMix(o, weeks = 12) {
  const h = data.history(o.id);
  const n = weekIdx().length;
  const mix = {};
  let tot = 0;
  Object.entries(h).forEach(([sku, arr]) => {
    const s = arr.slice(Math.max(0, n - weeks)).reduce((a, b) => a + (b || 0), 0);
    if (s > 0) { mix[sku] = s; tot += s; }
  });
  Object.keys(mix).forEach((k) => { mix[k] /= tot || 1; });
  return mix;
}

// ---- mode ------------------------------------------------------------------------------------

function modeFor(o, cover) {
  const today = cover.today;
  if (o.channel === 'Wholesale') return 'silent';
  if ((o.bookings ?? []).length) return 'bookings';
  if (cover.days.some((d) => isClosed(o, d))) return 'closing';
  const age = o.registeredOn ? fmt.daysBetween(o.registeredOn, today) : Infinity;
  if ((age < PARAMS.thin.minAgeDays || inSeasonOrders(o, today) < PARAMS.thin.minInSeasonOrders) && peerGroup(o)) return 'peers';
  return 'forward';
}

// ---- need(): the suggestion ------------------------------------------------------------------

/**
 * How much this outlet should order today, per pack, with the reasons.
