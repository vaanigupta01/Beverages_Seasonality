/* GT App prototype · "field assistant"
   Clean, light and readable in sunlight: white cards on a cool grey page, one blue for actions,
   green for done, amber for attention. Restyle the whole app from the tokens below.
   Colour always means something, and never on its own (an icon or word goes with it). */

:root {
  /* colour: cool light surfaces, one blue for actions and selection, green for done/positive,
     amber for attention, red only for real problems. Text contrast on card/paper ≥ 4.5:1. */
  --paper: #f3f6fb;  --card: #ffffff;  --ink: #0f1c2e;  --ink-2: #3d4b60;  --muted: #5d6b80;
  --line: #e6ebf3;   --line-strong: #d3dbe7;
  --accent: #1d5bd8; --accent-ink: #ffffff; --accent-tint: #e8f0ff;
  --accent-press: #1649b0;
  --brand: #0f2a5c;  --brand-2: #1d5bd8;
  --green: #138a4f;  --green-press: #0f7342;
  --warm: #b4431a;
  --info-bg: #e8f0ff;    --info-ink: #1a4bb0;
  --caution-bg: #fff4de; --caution-ink: #7a4a05;
  --neutral-bg: #eef2f7; --neutral-ink: #3d4b60;
  --ok-bg: #e3f5ea;      --ok-ink: #11663c;
  --thin-bg: #f0ebfb;    --thin-ink: #4b3a88;
  --danger-bg: #fdecea;  --danger-ink: #a3261b;
  --press: #eef2f8;
  --margin-rule: transparent;

  /* type: one family (Inter; Noto Sans Devanagari for Marathi and Hindi), weights do the hierarchy */
  --font-body: "Inter", "Noto Sans Devanagari", system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
  --font-display: var(--font-body);
  --font-mono: var(--font-body);
  --t-xs: 12px; --t-sm: 14px; --t-md: 16px; --t-lg: 18px; --t-xl: 22px; --t-2xl: 26px;

  /* spacing, radius, sizes */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
  --r1: 10px; --r2: 14px; --r3: 18px; --pill: 999px;
  --tap: 48px;
  --demo-h: 48px;
  --appbar-h: 56px;
  --shadow-card: 0 1px 2px rgba(15, 28, 46, 0.04), 0 4px 14px rgba(15, 28, 46, 0.05);
  --shadow-bar: 0 -6px 24px rgba(15, 28, 46, 0.08);
  --shadow-sheet: 0 -12px 40px rgba(15, 28, 46, 0.2);

  color-scheme: light;
}

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 400 var(--t-md)/1.45 var(--font-body);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
body.has-sheet { overflow: hidden; }
h1, h2, h3, p, ul, ol, dl, dd, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }
a { color: var(--accent); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
code, .mono { font-family: var(--font-mono); font-size: 0.9em; }
pre { background: var(--neutral-bg); padding: var(--s3); border-radius: var(--r1); overflow-x: auto; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.screen:focus { outline: none; }
.muted { color: var(--muted); }
.fine { font-size: var(--t-xs); color: var(--muted); line-height: 1.4; }
.num { font-variant-numeric: tabular-nums; }
.text-warn { color: var(--warm); display: inline-flex; align-items: center; gap: var(--s1); font-weight: 600; }

.icon { width: 20px; height: 20px; flex: none; }

.display {
  font-family: var(--font-display);
  font-weight: 750;
  font-size: var(--t-2xl);
  line-height: 1.2;
  letter-spacing: -0.02em;
  overflow-wrap: anywhere;
}
.eyebrow {
  font: 600 var(--t-xs)/1.3 var(--font-body);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--muted);
}

/* ---------- shell: a phone-width column (framed on wide screens) ---------- */
.shell { max-width: 480px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; background: var(--paper); }
@media (min-width: 560px) {
  body { background: #dfe6f1; }
  .shell { box-shadow: 0 0 0 1px var(--line-strong), 0 20px 60px rgba(15, 28, 46, 0.12); }
}
.view { display: flex; flex-direction: column; min-height: calc(100vh - var(--demo-h)); min-height: calc(100dvh - var(--demo-h)); }
.page { flex: 1; padding: var(--s4) 0 var(--s5); }
.page-end { display: flex; margin: var(--s5) var(--s4) 0; }

.boot { display: grid; place-items: center; gap: var(--s3); padding: 30vh var(--s4) 0; color: var(--muted); text-align: center; }
.boot-mark { font: 800 var(--t-lg)/1 var(--font-display); background: var(--accent); color: #fff; border-radius: var(--r2); padding: 12px 10px; }
.noscript { padding: var(--s4); text-align: center; }

/* ---------- demo bar ---------- */
.demo-bar {
  height: var(--demo-h);
  display: flex; align-items: center; justify-content: space-between; gap: var(--s2);
  padding: 0 var(--s2) 0 var(--s3);
  background: var(--brand); color: #fff;
  font: 500 var(--t-xs)/1.2 var(--font-body);
}
.demo-bar-text { display: flex; align-items: center; gap: 6px; min-width: 0; white-space: nowrap; }
.demo-bar-text > span { flex: none; }
.demo-bar-text > .demo-bar-region { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; margin-left: -2px; }
.demo-bar-tag { background: rgba(255, 255, 255, 0.14); border-radius: 6px; padding: 2px 6px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; }
.demo-bar-date { font-weight: 700; }
.demo-bar-stub { background: #f6ead6; color: #74460f; border-radius: 4px; padding: 1px 5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
.demo-bar-reset {
  flex: none;
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 44px; padding: 0 12px; white-space: nowrap;
  margin-right: -4px;
  border: 1px solid rgba(255, 255, 255, 0.35); border-radius: var(--pill);
  background: transparent; color: #fff;
  font: 600 var(--t-xs)/1.2 var(--font-body);
}
.demo-bar-reset .icon { width: 14px; height: 14px; }
.demo-bar-reset:active { background: rgba(255, 255, 255, 0.12); }

/* ---------- app bar ---------- */
.app-bar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: var(--s1);
  min-height: var(--appbar-h);
  padding: 0 var(--s2);
  background: rgba(255, 255, 255, 0.92);
  -webkit-backdrop-filter: saturate(1.4) blur(10px); backdrop-filter: saturate(1.4) blur(10px);
  border-bottom: 1px solid var(--line);
}
.app-bar-back {
  display: inline-flex; align-items: center; gap: 2px; flex: none;
  min-height: var(--tap); padding: 0 var(--s2) 0 var(--s1);
  color: var(--accent); font-weight: 600; text-decoration: none; border-radius: var(--r1);
}
.app-bar-back:active { background: var(--accent-tint); }
.app-bar-titles { min-width: 0; flex: 1; padding: var(--s2) 0; }
.app-bar-titles.is-flush { padding-left: var(--s2); }
.app-bar-title { font-size: var(--t-lg); font-weight: 700; letter-spacing: -0.01em; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.app-bar-sub { font-size: var(--t-xs); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.app-bar-action {
  display: inline-flex; align-items: center; gap: 6px; flex: none;
  min-height: var(--tap); padding: 0 var(--s3);
  color: var(--accent); font-weight: 600; font-size: var(--t-sm); text-decoration: none; border-radius: var(--r1);
}
.app-bar-action:active { background: var(--accent-tint); }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s2);
  min-height: var(--tap); padding: 0 20px;
  border: 1px solid transparent; border-radius: var(--r2);
  font-size: var(--t-md); font-weight: 650; line-height: 1.2; text-align: center; text-decoration: none;
  transition: background-color 120ms ease, transform 80ms ease;
}
.btn:active:not(:disabled) { transform: scale(0.985); }
.btn:disabled { cursor: not-allowed; }
.btn-block { display: flex; width: 100%; }
.btn-primary { background: var(--accent); color: var(--accent-ink); box-shadow: 0 6px 16px rgba(29, 91, 216, 0.22); }
.btn-success { background: var(--green); color: #fff; box-shadow: 0 6px 16px rgba(19, 138, 79, 0.22); }
.btn-success:active:not(:disabled) { background: var(--green-press); }
.btn-primary:active:not(:disabled) { background: var(--accent-press); }
.btn-primary:disabled { background: var(--neutral-bg); color: var(--muted); box-shadow: none; }
.btn-secondary { background: var(--card); color: var(--ink); border-color: var(--line-strong); }
.btn-secondary:active { background: var(--press); }
.btn-ghost { background: transparent; color: var(--accent); }
.btn-ghost:active { background: var(--accent-tint); }
.btn-danger { background: var(--warm); color: #fff; }
.btn-danger-quiet { background: var(--card); color: var(--warm); border-color: var(--line-strong); }
.btn .icon { width: 18px; height: 18px; }

/* ---------- cards, sections, callouts ---------- */
.card {
  margin: 0 var(--s4) var(--s3);
  padding: var(--s4);
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r3);
  box-shadow: var(--shadow-card);
}
.card-title, .section-title {
  display: flex; align-items: center; gap: var(--s2);
  font: 700 var(--t-sm)/1.3 var(--font-body);
  letter-spacing: -0.005em;
  color: var(--ink);
}
.card-title .icon, .section-title .icon { color: var(--accent); }
.card-title { margin-bottom: var(--s3); }
.card-title .icon, .section-title .icon { width: 16px; height: 16px; }
.section-title { margin: var(--s5) var(--s4) var(--s2); }
.sub-title { font-size: var(--t-sm); font-weight: 650; margin: var(--s4) 0 var(--s1); }

.callout {
  display: flex; gap: var(--s3); align-items: flex-start;
  margin: 0 var(--s4) var(--s3); padding: var(--s3) var(--s4);
  border-radius: var(--r2);
}
.callout .icon { margin-top: 1px; }
.callout-title { font-weight: 650; }
.callout-ok { background: var(--ok-bg); color: var(--ok-ink); }
.callout-caution { background: var(--caution-bg); color: var(--caution-ink); }

.inline-note {
  display: flex; gap: var(--s2); align-items: flex-start;
  margin-top: var(--s3); padding: var(--s2) var(--s3);
  background: var(--caution-bg); color: var(--caution-ink);
  border-radius: var(--r1); font-size: var(--t-sm);
}
.inline-note .icon { width: 18px; height: 18px; margin-top: 1px; }
.inline-note-info { background: var(--info-bg); color: var(--info-ink); margin: 0 var(--s4) var(--s3); }

/* key–value rows */
.kv > div {
  display: flex; justify-content: space-between; align-items: baseline; gap: var(--s3);
  padding: 10px 0; border-top: 1px solid var(--line);
}
.kv > div:first-child { border-top: 0; padding-top: 0; }
.kv > div:last-child { padding-bottom: 0; }
.kv + .kv { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.kv dt { color: var(--ink-2); flex: none; }
.kv dd { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.kv dd .muted { font-weight: 400; }
.kv .is-warn dt, .kv .is-warn dd { color: var(--warm); }
.kv .is-warn dd { display: inline-flex; align-items: center; gap: var(--s1); }
.kv .kv-total dt { color: var(--ink); font-weight: 650; }
.kv .kv-total dd { font-size: var(--t-xl); }

/* ---------- pills, badges, tags ---------- */
.pill {
  display: inline-flex; align-items: center; gap: 4px;
  max-width: 100%; min-height: 26px; padding: 2px 10px;
  border-radius: var(--pill);
  font-size: var(--t-xs); font-weight: 650; line-height: 1.3;
}
.pill .icon { width: 14px; height: 14px; }
.pill-info { background: var(--info-bg); color: var(--info-ink); }
.pill-caution { background: var(--caution-bg); color: var(--caution-ink); }
.pill-neutral { background: var(--neutral-bg); color: var(--neutral-ink); }
.pill-ok { background: var(--ok-bg); color: var(--ok-ink); }
.pill-thin { background: var(--thin-bg); color: var(--thin-ink); }
.pill-tier { background: var(--card); color: var(--ink); border: 1px solid var(--line-strong); }
.tier-gem { width: 8px; height: 8px; transform: rotate(45deg); border-radius: 1px; background: var(--ink-2); flex: none; margin: 0 2px; }
.pill-tier[data-tier="Diamond"] .tier-gem { background: var(--ink); }
.pill-tier[data-tier="Gold"] .tier-gem { background: #9a7417; }
.pill-tier[data-tier="Silver"] .tier-gem { background: #8e8b83; }
.pill-tier[data-tier="Bronze"] .tier-gem { background: #9b5a2f; }
.pill-tier[data-tier="Iron"] .tier-gem { background: #55524b; border-radius: 50%; transform: none; }

.persona-tag {
  display: inline-block; align-self: flex-start;
  margin-top: var(--s2); padding: 1px 6px;
  border: 1px dashed var(--line-strong); border-radius: 6px;
  font: 500 var(--t-xs)/1.5 var(--font-body); color: var(--muted);
}

/* ---------- lists and rows ---------- */
.list {
  margin: 0 var(--s4);
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r3);
  box-shadow: var(--shadow-card);
  overflow: hidden;
}
.list > li + li { border-top: 1px solid var(--line); }
.row {
  display: flex; align-items: center; gap: var(--s3);
  min-height: 72px; padding: 14px var(--s3) 14px var(--s4);
  color: inherit; text-decoration: none;
}
.row:active { background: var(--press); }
.row-main { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.row-title { font-size: var(--t-md); font-weight: 650; line-height: 1.3; overflow-wrap: anywhere; }
.row-meta { font-size: var(--t-sm); color: var(--ink-2); margin-top: 2px; }
.row-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: var(--s2); }
.row-chev { color: var(--muted); }
.list-count { margin: 0 var(--s4) var(--s2); font-size: var(--t-sm); color: var(--muted); }

.route-stop {
  flex: none; display: grid; place-items: center;
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--accent-tint); border: 0;
  font: 700 var(--t-sm)/1 var(--font-body); color: var(--accent);
}
.route-row.is-done .route-stop { background: var(--ok-bg); border-color: transparent; color: var(--ok-ink); }
.route-row.is-done .route-stop .icon { width: 18px; height: 18px; }

/* ---------- landing ---------- */
.hero { padding: var(--s2) var(--s4) var(--s4); }
.hero-title { margin-top: var(--s1); }
.hero-sub { margin-top: var(--s1); color: var(--ink-2); font-size: var(--t-sm); }
.progress-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); flex-wrap: wrap; }
.progress-title { font-size: var(--t-md); }
.progress-track { display: flex; gap: 4px; margin: var(--s3) 0 var(--s4); }
.progress-seg { flex: 1; height: 8px; border-radius: var(--pill); background: var(--line-strong); }
.progress-seg.is-on { background: var(--green); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s2); }
.stats > div { padding: var(--s2) var(--s3); background: var(--paper); border-radius: var(--r1); border: 1px solid var(--line); }
.stats dt { font-size: var(--t-xs); color: var(--muted); }
.stats dd { font-size: var(--t-lg); font-weight: 800; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.progress .fine { margin-top: var(--s3); }

/* ---------- toolbar: search + chips ---------- */
.toolbar {
  position: sticky; top: var(--appbar-h); z-index: 15;
  padding: var(--s3) 0 var(--s1);
  background: var(--paper);
  border-bottom: 1px solid var(--line);
}
.search {
  display: flex; align-items: center; gap: var(--s2);
  margin: 0 var(--s4);
  height: calc(var(--tap) + 2px); padding-left: var(--s3);
  background: var(--card);
  border: 1px solid var(--line-strong); border-radius: var(--r2);
}
.search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint); }
.search .icon { color: var(--muted); }
.search-input { flex: 1; min-width: 0; height: 100%; border: 0; background: transparent; font-size: var(--t-md); outline: none; }
.search-input::-webkit-search-cancel-button { display: none; }
.search-input::placeholder { color: var(--muted); }
.search-clear { height: 100%; padding: 0 var(--s4); border: 0; background: transparent; color: var(--accent); font-weight: 600; font-size: var(--t-sm); border-radius: 0 var(--r2) var(--r2) 0; }

.chips {
  display: flex; gap: var(--s2);
  padding: var(--s2) var(--s4);
  overflow-x: auto; overscroll-behavior-x: contain;
  scrollbar-width: none;
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none;
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 44px; padding: 0 14px;
  border: 1px solid var(--line-strong); border-radius: var(--pill);
  background: var(--card); color: var(--ink-2);
  font-size: var(--t-sm); font-weight: 600; white-space: nowrap;
}
.chip[aria-pressed="true"] { background: var(--accent-tint); border-color: var(--accent); color: var(--accent); }
.chip-count { font: 700 var(--t-xs)/1 var(--font-body); opacity: 0.75; }

/* ---------- empty states ---------- */
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--s2); padding: var(--s6) var(--s5); }
.empty.is-compact { padding: var(--s3) 0 var(--s1); }
.empty-icon { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 50%; background: var(--neutral-bg); color: var(--ink-2); }
.empty.is-compact .empty-icon { width: 40px; height: 40px; }
.empty-title { font-size: var(--t-lg); font-weight: 650; overflow-wrap: anywhere; }
.empty.is-compact .empty-title { font-size: var(--t-md); }
.empty-body { color: var(--ink-2); max-width: 32ch; }
.empty .btn { margin-top: var(--s2); }

/* ---------- login ---------- */
.login {
  padding: var(--s6) var(--s4) var(--s5);
  background: radial-gradient(120% 60% at 100% 0%, #dbe7ff 0, rgba(219, 231, 255, 0) 60%), linear-gradient(180deg, #eef3fc 0, var(--paper) 55%);
}
.login-brand { display: flex; align-items: center; gap: var(--s3); margin-left: var(--s5); }
.brand-mark {
  display: grid; place-items: center; flex: none;
  width: 52px; height: 52px; border-radius: var(--r2);
  background: linear-gradient(135deg, var(--brand-2), var(--brand)); color: #fff;
  font: 800 var(--t-xl)/1 var(--font-display);
  box-shadow: 0 8px 20px rgba(29, 91, 216, 0.3);
}
.login-title { display: flex; align-items: baseline; flex-wrap: wrap; gap: var(--s2); }
.proto-tag { font: 600 var(--t-xs)/1.4 var(--font-body); color: var(--muted); border: 1px dashed var(--line-strong); padding: 1px 6px; border-radius: 6px; letter-spacing: 0; background: var(--paper); }
.login-lede { margin: var(--s5) 0 var(--s4) var(--s5); color: var(--ink-2); font-size: var(--t-lg); line-height: 1.4; }
.login-form { margin: 0; display: grid; gap: var(--s4); padding: var(--s5) var(--s4); }
.login-foot { margin: var(--s5) 0 0 var(--s5); font-size: var(--t-sm); color: var(--muted); line-height: 1.6; }
.login-foot strong { color: var(--ink); }
.field { display: grid; gap: 6px; }
.field-label { font-size: var(--t-sm); font-weight: 650; color: var(--ink-2); }
.input {
  height: var(--tap); padding: 0 var(--s3);
  background: var(--card); border: 1px solid var(--line-strong); border-radius: var(--r2);
  font-size: var(--t-md);
}
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint); }
.input[aria-invalid="true"] { border-color: var(--warm); }
.field-error { display: flex; align-items: center; gap: 6px; color: var(--warm); font-size: var(--t-sm); font-weight: 600; }
.field-error .icon { width: 16px; height: 16px; }
.hint { display: flex; align-items: center; justify-content: center; gap: 6px; color: var(--muted); font-size: var(--t-sm); }
.hint .icon { width: 16px; height: 16px; }

/* ---------- outlet details ---------- */
.outlet-head { display: flex; flex-direction: column; padding: 0 var(--s4) var(--s4); }
.outlet-head .persona-tag { margin: 0 0 var(--s2); }
.outlet-addr { margin-top: var(--s2); color: var(--ink-2); }
.outlet-owner { margin-top: var(--s2); font-size: var(--t-sm); color: var(--ink-2); }
.outlet-head .row-tags { margin-top: var(--s3); }

.scheme-list { display: grid; gap: var(--s2); }
.scheme-row {
  display: flex; align-items: center; gap: var(--s2);
  min-height: 56px; padding: var(--s3) var(--s2) var(--s3) var(--s3);
  border: 1px solid var(--line); border-left: 4px solid var(--line-strong); border-radius: var(--r2);
  color: inherit; text-decoration: none; background: var(--card);
}
.scheme-row:active { background: var(--press); }
.scheme-row.st-enrolled { border-left-color: var(--green); background: #f4fbf7; }
.scheme-row.st-applicable { border-left-color: var(--info-ink); }
.scheme-row.st-used { border-left-color: var(--line-strong); }
.scheme-row.st-not { border-left-style: dashed; }
.scheme-row-main { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.scheme-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--s1) var(--s2); }
.scheme-name { font-weight: 650; }
.scheme-offer { margin-top: 2px; color: var(--ink-2); font-size: var(--t-sm); }
.scheme-meta { margin-top: var(--s1); font-size: var(--t-xs); color: var(--muted); }
.scheme-row.st-not .scheme-name, .scheme-row.st-not .scheme-offer { color: var(--muted); }
.scheme-legend { margin-top: var(--s3); }

.mini-list > li {
  display: grid; grid-template-columns: 1fr auto auto; gap: var(--s3); align-items: baseline;
  padding: 8px 0; border-top: 1px solid var(--line); font-size: var(--t-sm);
}
.mini-list > li:first-child { border-top: 0; }
.mini-list > li > span:last-child { text-align: right; font-weight: 600; min-width: 64px; }
.mini-list .pill { min-height: 20px; padding: 0 6px; margin-left: 4px; }

.strip { margin: 0; }
.strip-bars { display: grid; grid-template-columns: repeat(13, 1fr); gap: 4px; align-items: end; height: 76px; }
.strip-col { display: flex; flex-direction: column; justify-content: flex-end; align-items: stretch; height: 100%; min-width: 0; }
.strip-val { font: 600 var(--t-xs)/1.2 var(--font-body); letter-spacing: -0.02em; color: var(--ink-2); text-align: center; margin-bottom: 3px; min-height: 13px; }
.strip-bar { display: block; background: var(--accent); border-radius: 3px 3px 1px 1px; }
.strip-col.is-current .strip-bar {
  background: repeating-linear-gradient(135deg, var(--accent) 0 3px, #8fb0ee 3px 6px);
}
.strip-col.is-zero .strip-bar { background: var(--line-strong); }
.strip-labels { display: grid; grid-template-columns: repeat(13, 1fr); gap: 4px; margin-top: 4px; font: 500 var(--t-xs)/1 var(--font-body); color: var(--muted); text-align: center; }
.strip-labels .is-current { color: var(--ink); font-weight: 700; }
.strip figcaption { margin-top: var(--s2); }

.notes > li + li { margin-top: var(--s3); padding-top: var(--s3); border-top: 1px solid var(--line); }
.note-date { font: 600 var(--t-xs)/1.3 var(--font-body); color: var(--muted); margin-bottom: 2px; }

/* ---------- sticky bottom bars ---------- */
.bottom-bar, .cart-bar {
  position: sticky; bottom: 0; z-index: 15;
  padding: var(--s3) var(--s4) calc(var(--s3) + env(safe-area-inset-bottom));
  background: var(--card);
  border-top: 1px solid var(--line);
  box-shadow: var(--shadow-bar);
}
.bottom-bar-split { display: grid; grid-template-columns: auto 1fr; gap: var(--s2); }

/* ---------- booking ---------- */
.page-book { padding-top: var(--s3); }
.sku-list { margin: 0 var(--s4); display: grid; gap: var(--s2); }
.sku {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: var(--s3); align-items: center;
  padding: var(--s3) var(--s3) var(--s3) var(--s4);
  background: var(--card);
  border: 1px solid var(--line); border-radius: var(--r3);
  box-shadow: var(--shadow-card);
  position: relative;
}
.sku.has-qty { border-color: #b7cbf3; box-shadow: inset 4px 0 0 var(--accent), var(--shadow-card); }
.sku-text { min-width: 0; }
.sku-name { font-weight: 650; line-height: 1.3; overflow-wrap: anywhere; }
.sku-pack { margin-top: 2px; font: 500 var(--t-xs)/1.4 var(--font-body); color: var(--muted); }
.sku-rate { margin-top: 2px; font-size: var(--t-sm); color: var(--ink-2); }
.sku-rate strong { color: var(--ink); font-variant-numeric: tabular-nums; }
.sku-chips { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; margin-top: var(--s2); }
.sku .slot { grid-column: 1 / -1; }
.scheme-chip {
  display: inline-flex; align-items: center; gap: 4px;
  min-height: 26px; padding: 2px 10px 2px 8px;
  border-radius: var(--pill);
  background: var(--info-bg); color: var(--info-ink);
  font-size: var(--t-xs); font-weight: 650;
}
.scheme-chip .icon { width: 14px; height: 14px; }
.scheme-chip.is-off { background: transparent; color: var(--muted); border: 1px dashed var(--line-strong); padding-left: 10px; font-weight: 500; }
.scheme-chip.is-used { background: var(--neutral-bg); color: var(--neutral-ink); }

.stepper {
  display: inline-flex; align-items: stretch;
  border: 1px solid var(--line-strong); border-radius: var(--r2);
  background: var(--card); overflow: hidden;
}
.step {
  width: var(--tap); height: var(--tap);
  border: 0; background: transparent; color: var(--accent);
  font-size: 24px; font-weight: 500; line-height: 1;
}
.step:active:not(:disabled) { background: var(--accent-tint); }
.step:disabled { color: var(--line-strong); cursor: default; }
.qty {
  width: 52px; height: var(--tap);
  border: 0; border-left: 1px solid var(--line); border-right: 1px solid var(--line);
  background: transparent; text-align: center;
  font-size: var(--t-lg); font-weight: 700; font-variant-numeric: tabular-nums;
}
.qty:focus { outline: none; background: var(--accent-tint); }
.sku.has-qty .qty { color: var(--accent); }
.qty-hint { grid-column: 1 / -1; justify-self: end; margin-top: var(--s1); font-size: var(--t-xs); font-weight: 650; color: var(--warm); }

.cart-bar { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); }
.cart-sum { min-width: 0; }
.cart-main { display: flex; flex-wrap: wrap; gap: 0 var(--s2); font-size: var(--t-lg); font-variant-numeric: tabular-nums; }
.cart-main span { color: var(--ink-2); }
.cart-extra { font-size: var(--t-sm); color: var(--ok-ink); font-weight: 600; }
.cart-extra.is-quiet { color: var(--muted); font-weight: 400; }
.cart-bar .btn { flex: none; padding: 0 16px 0 20px; }

/* ---------- review ---------- */
.review-outlet { font-family: var(--font-display); font-size: var(--t-xl); font-weight: 750; letter-spacing: -0.015em; line-height: 1.2; }
.review-head .row-tags { margin-top: var(--s3); }
.lines { margin-bottom: var(--s2); }
.line { padding: 10px 0; border-top: 1px solid var(--line); }
.line:first-child { border-top: 0; padding-top: 0; }
.line { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px var(--s3); align-items: baseline; }
.line-name { font-weight: 600; overflow-wrap: anywhere; }
.line-qty { font-size: var(--t-sm); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.line-value { font-weight: 650; }
.line-free { grid-column: 1 / -1; display: inline-flex; align-items: center; gap: 6px; justify-self: start; margin-top: 4px; padding: 2px 10px 2px 8px; border-radius: var(--pill); background: var(--ok-bg); color: var(--ok-ink); font-size: var(--t-sm); font-weight: 650; }
.line-free .icon { width: 16px; height: 16px; }
.scheme-notes { display: grid; gap: var(--s2); }
.scheme-note { display: flex; gap: var(--s2); align-items: flex-start; font-size: var(--t-sm); padding: var(--s2) var(--s3); border-radius: var(--r1); }
.scheme-note .icon { width: 18px; height: 18px; flex: none; margin-top: 1px; }
.scheme-note.is-on { background: var(--ok-bg); color: var(--ok-ink); }
.scheme-note.is-warn { background: var(--caution-bg); color: var(--caution-ink); }
.scheme-note.is-off { background: var(--paper); color: var(--muted); }

/* scheme estimate on review: visibly separate from what is billed */
.est-box { margin-top: var(--s3); padding: var(--s3); border: 1px dashed #b7cbf3; border-radius: var(--r2); background: #f7faff; }
.est-title { display: flex; align-items: center; gap: 6px; font-size: var(--t-sm); font-weight: 700; color: var(--info-ink); margin-bottom: var(--s2); }
.est-title .icon { width: 16px; height: 16px; }
.est-box .fine { margin-top: var(--s2); }

/* ---------- saved ---------- */
.saved-hero { display: flex; flex-direction: column; align-items: center; text-align: center; padding: var(--s5) var(--s4) var(--s5); gap: var(--s2); }
.saved-icon { display: grid; place-items: center; width: 64px; height: 64px; border-radius: 50%; background: var(--ok-bg); color: var(--ok-ink); }
.saved-icon .icon { width: 32px; height: 32px; }
.saved-outlet { color: var(--ink-2); font-size: var(--t-lg); }
.stack { display: grid; gap: var(--s2); margin: var(--s4) var(--s4) 0; }

/* ---------- fatal ---------- */
.fatal { padding-top: var(--s6); }
.fatal .card { display: grid; gap: var(--s3); }
.fatal-icon { color: var(--warm); }
.fatal-icon .icon { width: 32px; height: 32px; }
.fatal .display { font-size: var(--t-xl); }

/* ---------- bottom sheet ---------- */
.sheet-wrap { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheet-backdrop { position: absolute; inset: 0; background: rgba(15, 28, 46, 0.45); animation: fade-in 160ms ease both; }
.sheet {
  position: relative; width: 100%; max-width: 480px;
  max-height: 88vh; max-height: 88dvh; overflow-y: auto; overscroll-behavior: contain;
  padding: var(--s3) var(--s4) calc(var(--s4) + env(safe-area-inset-bottom));
  background: var(--card); border-radius: var(--r3) var(--r3) 0 0;
  box-shadow: var(--shadow-sheet);
  animation: sheet-up 200ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
}
.sheet-handle { display: block; width: 40px; height: 4px; margin: 0 auto var(--s4); border-radius: var(--pill); background: var(--line-strong); }
.sheet-title { font-family: var(--font-display); font-size: var(--t-xl); font-weight: 750; letter-spacing: -0.015em; line-height: 1.2; }
.sheet-body { margin-top: var(--s2); color: var(--ink-2); display: grid; gap: var(--s2); }
.sheet-actions { display: grid; gap: var(--s2); margin-top: var(--s5); }
.sheet-wrap.is-leaving .sheet { animation: sheet-down 160ms ease both; }
.sheet-wrap.is-leaving .sheet-backdrop { animation: fade-out 160ms ease both; }
@keyframes sheet-up { from { transform: translateY(100%); } to { transform: none; } }
@keyframes sheet-down { from { transform: none; } to { transform: translateY(100%); } }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes fade-out { from { opacity: 1; } to { opacity: 0; } }

/* ---------- toast ---------- */
.toast {
  position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); z-index: 60;
  display: flex; align-items: center; gap: var(--s2);
  width: max-content; max-width: min(440px, calc(100vw - 32px));
  padding: var(--s3) var(--s4);
  background: var(--ink); color: #fff;
  border-radius: var(--r2); box-shadow: 0 10px 30px rgba(15, 28, 46, 0.25);
  font-size: var(--t-sm); font-weight: 600;
  opacity: 0; transform: translate(-50%, 8px);
  transition: opacity 200ms ease, transform 200ms ease;
}
.toast.is-in { opacity: 1; transform: translate(-50%, 0); }
.toast .icon { width: 18px; height: 18px; color: #9fd8b5; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; }
}

/* ---------- round 3: language, scheme states, collapsible, directions ---------- */
.lang-btn {
  flex: none; display: inline-flex; align-items: center; gap: 4px;
  min-height: 44px; padding: 0 10px; margin-left: 2px;
  border: 1px solid var(--line-strong); border-radius: var(--pill);
  background: var(--card); color: var(--ink-2);
  font-size: var(--t-xs); font-weight: 700;
}
.lang-btn .icon { width: 16px; height: 16px; }
.lang-btn:active { background: var(--press); }
.lang-seg { display: flex; gap: 4px; padding: 4px; margin: 0 0 var(--s5) var(--s5); border: 1px solid var(--line-strong); border-radius: var(--pill); background: var(--card); width: fit-content; }
.lang-seg-btn { min-height: 44px; padding: 0 14px; border: 0; border-radius: var(--pill); background: transparent; color: var(--ink-2); font-weight: 650; font-size: var(--t-sm); }
.lang-seg-btn[aria-pressed="true"] { background: var(--accent); color: #fff; }

.outlet-actions { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); margin-top: var(--s3); }
.outlet-actions .outlet-owner { margin: 0; min-width: 0; }
.btn-compact { flex: none; min-height: 44px; padding: 0 14px; font-size: var(--t-sm); border-radius: var(--pill); }
.btn-compact .icon { width: 18px; height: 18px; color: var(--accent); }

/* scheme states: each looks different at a glance */
.pill-applicable { background: var(--info-bg); color: var(--info-ink); border: 1px solid #c3d3f3; }
.pill-enrolled { background: var(--green); color: #fff; }
.pill-enrolled .icon { stroke-width: 2.6; }
.pill-used { background: var(--neutral-bg); color: var(--neutral-ink); }
.pill-off { background: transparent; color: var(--muted); border: 1px dashed var(--line-strong); font-weight: 600; }

/* collapsible card (cooler) */
details.collapse { padding: 0; }
.collapse-head {
  display: flex; align-items: center; gap: var(--s2);
  min-height: 56px; padding: var(--s3) var(--s3) var(--s3) var(--s4);
  list-style: none; cursor: pointer;
}
.collapse-head::-webkit-details-marker { display: none; }
.collapse-head .card-title { margin: 0; flex: none; }
.collapse-sum { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; font-size: var(--t-sm); color: var(--ink-2); text-align: right; min-width: 0; }
.collapse-sum .icon { width: 16px; height: 16px; }
.collapse-chev { color: var(--muted); transition: transform 150ms ease; flex: none; }
details[open] > summary .collapse-chev { transform: rotate(90deg); }
.collapse-body { padding: 0 var(--s4) var(--s4); }

/* scheme chips on Order booking: applicable ones are buttons that add the scheme's quantity */
button.scheme-chip { border: 0; font: inherit; font-size: var(--t-xs); font-weight: 650; cursor: pointer; }
.scheme-chip.is-add { min-height: 44px; padding: 4px 6px 4px 12px; gap: 6px; border: 1px solid #c3d3f3; }
.scheme-chip.is-add:active { background: #d3e0f8; }
.scheme-chip.is-add:disabled { opacity: 0.5; cursor: default; }
.chip-plus { display: inline-grid; place-items: center; min-width: 36px; height: 32px; padding: 0 6px; border-radius: var(--pill); background: var(--accent); color: #fff; font-weight: 700; font-variant-numeric: tabular-nums; }
.cart-sep { color: var(--muted); }

/* ---------- talking points ---------- */
.tp {
  margin: 0 var(--s4) var(--s3);
  border: 1px solid #d6e2fa; border-radius: var(--r3);
  background: linear-gradient(180deg, #edf3ff 0, #f7f9ff 64px, var(--card) 120px);
  box-shadow: 0 1px 2px rgba(29, 75, 176, 0.05), 0 8px 22px rgba(29, 75, 176, 0.08);
  overflow: hidden;
}
.tp-head { display: flex; align-items: center; gap: var(--s3); padding: var(--s4) var(--s4) var(--s2); }
.tp-mark { flex: none; display: grid; place-items: center; width: 40px; height: 40px; border-radius: var(--r2); background: var(--info-ink); color: #fff; }
.tp-mark .icon { width: 22px; height: 22px; }
.tp-title { font-family: var(--font-display); font-size: var(--t-lg); font-weight: 750; letter-spacing: -0.01em; line-height: 1.2; }
.tp-sub { font-size: var(--t-xs); color: var(--muted); margin-top: 2px; }
.tp-list { padding: 0 var(--s4); }
.tp-item { display: flex; gap: var(--s3); padding: var(--s3) 0; border-top: 1px solid var(--line); }
.tp-list > .tp-item:first-child { border-top: 0; }
.tp-extra { display: none; }
.tp-list.is-open .tp-extra { display: flex; }
.tp-icon { flex: none; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: var(--neutral-bg); color: var(--neutral-ink); }
.tp-icon .icon { width: 19px; height: 19px; }
.tone-sun .tp-icon { background: #fdebd3; color: #8a4a0c; }
.tone-thin .tp-icon { background: var(--thin-bg); color: var(--thin-ink); }
.tone-ok .tp-icon { background: var(--ok-bg); color: var(--ok-ink); }
.tone-info .tp-icon { background: var(--info-bg); color: var(--info-ink); }
.tone-warn .tp-icon { background: #f8e3d9; color: var(--warm); }
.tp-text { min-width: 0; flex: 1; }
.tp-cat { font-size: var(--t-xs); font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
.tone-warn .tp-cat { color: var(--warm); }
.tp-point { margin-top: 1px; font-weight: 650; line-height: 1.35; overflow-wrap: anywhere; }
.tp-detail { margin-top: 2px; font-size: var(--t-sm); color: var(--ink-2); }
.tp-src { margin-top: 4px; font-size: var(--t-xs); color: var(--muted); }
.tp-src a { font-weight: 650; display: inline-block; padding: 14px 4px; margin: -14px -4px; }
.tp-empty { padding: 0 var(--s4) var(--s4); color: var(--ink-2); }
.tp-more { display: block; width: calc(100% - 2 * var(--s4)); margin: 0 var(--s4) var(--s2); min-height: 44px; border: 1px solid var(--line-strong); border-radius: var(--r2); background: var(--card); color: var(--accent); font-weight: 650; }
.tp-rep { margin: var(--s1) var(--s4) var(--s3); border: 1px solid var(--line); border-radius: var(--r2); background: var(--paper); }
.tp-rep > summary { display: flex; align-items: center; gap: var(--s2); min-height: 48px; padding: 0 var(--s3); list-style: none; cursor: pointer; color: var(--ink-2); font-weight: 650; font-size: var(--t-sm); }
.tp-rep > summary::-webkit-details-marker { display: none; }
.tp-rep > summary .icon { width: 16px; height: 16px; }
.tp-rep-note { margin-left: auto; font-weight: 400; font-size: var(--t-xs); color: var(--muted); }
.tp-rep .tp-list { padding: 0 var(--s3); }
.sheet .tp-list { padding: 0; }
.sheet .tp-rep { margin: var(--s2) 0 0; }
.tp-open {
  display: flex; align-items: center; gap: var(--s3);
  width: calc(100% - 2 * var(--s4)); margin: var(--s3) var(--s4) 0; min-height: 52px; padding: 0 var(--s3);
  border: 1px solid #d3def3; border-radius: var(--r2);
  background: linear-gradient(90deg, #eaf1fd, var(--card)); color: var(--info-ink);
  font-weight: 650; text-align: left;
}
.tp-open-mark { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 10px; background: var(--info-ink); color: #fff; }
.tp-open-mark .icon { width: 18px; height: 18px; }
.tp-open-chev { margin-left: auto; color: var(--info-ink); }

/* ---------- scheme detail ---------- */
.sd-hero { margin: 0 var(--s4) var(--s3); padding: var(--s4); border-radius: var(--r3); background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow-card); }
.sd-hero.st-enrolled { border-top: 4px solid var(--green); }
.sd-hero.st-applicable { border-top: 4px solid var(--info-ink); }
.sd-name { margin-top: var(--s1); }
.sd-chip { display: inline-flex; align-items: center; gap: 6px; margin-top: var(--s3); padding: 6px 12px; border-radius: var(--pill); background: var(--info-bg); color: var(--info-ink); font-weight: 700; }
.sd-chip .icon { width: 16px; height: 16px; }
.sd-status { display: flex; align-items: flex-start; gap: var(--s3); margin-top: var(--s4); padding: var(--s3); border-radius: var(--r2); flex-wrap: wrap; }
.sd-status > div { flex: 1; min-width: 60%; }
.sd-status-icon { flex: none; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: rgba(255, 255, 255, 0.7); }
.sd-status-icon .icon { width: 18px; height: 18px; }
.sd-status-title { font-weight: 700; }
.sd-status-body { font-size: var(--t-sm); margin-top: 2px; }
.sd-status-applicable { background: var(--info-bg); color: var(--info-ink); }
.sd-status-enrolled { background: var(--ok-bg); color: var(--ok-ink); }
.sd-status-used { background: var(--neutral-bg); color: var(--neutral-ink); }
.sd-status-not { background: var(--paper); color: var(--ink-2); border: 1px dashed var(--line-strong); }
.sd-offer { font-size: var(--t-lg); line-height: 1.45; }
.sd-kv dd { max-width: 62%; }
.sd-products > li { grid-template-columns: 1fr auto; }

<script type="module">
// GT App prototype: single-file build, generated by scripts/build_single.py.
// Each block below is one file from js/. To change the app for good, edit js/ and rebuild.
const modules = {};

/* ==================== js/app.js ==================== */
modules['app'] = (() => {
// A tiny event bus, the sign-in session and navigation memory.
//
// Feature code listens here, for example:
//   app.on('screen:rendered', ({ screen, outletId, root }) => { … fill a [data-slot] … })
// Screens: login, home, outlets, outlet, book, review, saved.

const handlers = new Map();

const app = {
  on(event, fn) {
    if (!handlers.has(event)) handlers.set(event, new Set());
    handlers.get(event).add(fn);
    return () => app.off(event, fn);
  },
  off(event, fn) {
    handlers.get(event)?.delete(fn);
  },
  emit(event, payload) {
    handlers.get(event)?.forEach((fn) => {
      try { fn(payload); } catch (err) { console.error(`[app] "${event}" listener failed`, err); }
    });
  },
};

// Signed-in flag lives in sessionStorage; "Reset demo" clears it.
const SESSION_KEY = 'gtapp.session.v1';
let memory = null;

/** "rohit.jagtap" → "Rohit Jagtap". The signed-in username is the rep's name everywhere. */
function displayName(raw) {
  return String(raw ?? '').trim().replace(/[._]+/g, ' ').replace(/\s+/g, ' ')
    .replace(/(^|\s)([a-z])/g, (m, space, ch) => space + ch.toUpperCase());
}

const session = {
  /** The rep's display name, from the username they signed in with. */
  name() {
    return displayName(session.user()?.username);
  },
  user() {
    try {
      const raw = sessionStorage.getItem(SESSION_KEY);
      return raw ? JSON.parse(raw) : memory;
    } catch {
      return memory;
    }
  },
  signIn(username) {
    memory = { username };
    try { sessionStorage.setItem(SESSION_KEY, JSON.stringify(memory)); } catch { /* memory only */ }
  },
  signOut() {
    memory = null;
    try { sessionStorage.removeItem(SESSION_KEY); } catch { /* nothing stored */ }
  },
};

// Which list the rep came from, so Outlet details knows where "Back" goes.
const nav = { hub: '#/home' };

// Navigation. Routes live in the URL hash (#/outlet/OUT-01) when the page may change its URL.
// Some previews (a file opened as a data: URL, some sandboxes) silently refuse, so the current
// route is also kept in memory and every in-app link goes through router.go().
let currentHash = null;
let onRoute = () => {};

const router = {
  current: () => currentHash ?? location.hash,

  go(hash, { replace = false } = {}) {
    currentHash = hash;
    try {
      if (location.hash !== hash) history[replace ? 'replaceState' : 'pushState'](null, '', hash);
    } catch { /* URL can't change here; the route lives in memory */ }
    onRoute();
  },

  start(render) {
    onRoute = render;
    currentHash = location.hash || null;
    const sync = () => {
      if (location.hash && location.hash !== currentHash) {
        currentHash = location.hash;
        render();
      }
    };
    window.addEventListener('popstate', sync);      // back / forward
    window.addEventListener('hashchange', sync);    // URL typed by hand
    document.addEventListener('click', (e) => {
      const a = e.target.closest?.('a[href^="#/"]');
      if (!a || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      e.preventDefault();
      router.go(a.getAttribute('href'));
    });
  },
};

return { app, displayName, session, nav, router };
})();

/* ==================== js/data.js ==================== */
modules['data'] = (() => {
// Loads the demo data and exposes read-only selectors. The files follow the data contract in PROGRESS.md.
//
// Where the data comes from:
// - Served over http(s) (the hosted site): data/<name>.json next to the page. The data files are the
//   source, so editing one and reloading changes the screen. Relative paths keep a GitHub Pages
//   subfolder working.
// - Opened without a server (gt-app.html double-clicked, or a preview snapshot): the copy embedded
//   in the page by scripts/build_single.py, as <script type="application/json" id="data-<name>">.

const FILES = ['config', 'outlets', 'products', 'schemes', 'orders', 'history', 'visits', 'distributor_stock', 'calendar', 'peers', 'current_stock', 'field'];
const SERVED = location.protocol === 'http:' || location.protocol === 'https:';

const db = {};
const idx = { outlets: new Map(), products: new Map(), orders: new Map(), stock: new Map(), onHand: new Map() };

class DataError extends Error {
  constructor(file, detail) {
    super(`${file}: ${detail}`);
    this.file = file;
    this.detail = detail;
  }
}

async function fetchFile(name) {
  const file = `data/${name}.json`;
  let res;
  try {
    res = await fetch(file, { cache: 'no-cache' });
  } catch (err) {
    throw new DataError(file, `could not be fetched (${err.message})`);
  }
  if (!res.ok) throw new DataError(file, `HTTP ${res.status}. Is the data/ folder next to the page?`);
  try {
    return await res.json();
  } catch (err) {
    throw new DataError(file, `is not valid JSON (${err.message})`);
  }
}

function readEmbedded(name) {
  const el = document.getElementById(`data-${name}`);
  if (!el) throw new DataError(`data/${name}.json`, 'is not embedded in this page. Rebuild gt-app.html, or open the hosted link.');
  try {
    return JSON.parse(el.textContent);
  } catch (err) {
    throw new DataError(`data-${name} (embedded in the page)`, `is not valid JSON (${err.message})`);
  }
}

/** True when the page carries an embedded copy of the data (the single-file build). */
const hasEmbedded = () => Boolean(document.getElementById('data-config'));

function need(file, cond, what) {
  if (!cond) throw new DataError(`data/${file}.json`, `missing or wrong: ${what}`);
}

function validate() {
  const { config, outlets, products, schemes, orders, history, visits, distributor_stock: stock } = db;
  need('config', /^\d{4}-\d{2}-\d{2}$/.test(config?.demoDate ?? ''), 'demoDate (YYYY-MM-DD)');
  need('config', config.region?.name && config.rep?.name, 'region.name, rep.name');
  need('outlets', Array.isArray(outlets?.outlets) && outlets.outlets.length, 'outlets[]');
  outlets.outlets.forEach((o, i) => need('outlets', o.id && o.name && o.tier, `outlets[${i}].id / name / tier`));
  need('products', Array.isArray(products?.products) && products.products.length, 'products[]');
  products.products.forEach((p, i) => need('products', p.sku && p.name && Number.isFinite(p.ptrPerCase), `products[${i}].sku / name / ptrPerCase`));
  need('schemes', Array.isArray(schemes?.schemes), 'schemes[]');
  need('orders', Array.isArray(orders?.orders), 'orders[]');
  need('history', Array.isArray(history?.weeks) && history.outlets, 'weeks[], outlets');
  need('visits', visits?.outlets && typeof visits.outlets === 'object', 'outlets');
  need('distributor_stock', Array.isArray(stock?.items), 'items[]');
  need('peers', Array.isArray(db.peers?.groups), 'groups[]');
  need('current_stock', Array.isArray(db.current_stock?.rows), 'rows[]');
  need('field', db.field?.targets?.preSeason && Array.isArray(db.field?.reps), 'targets.preSeason, reps[]');
}

function buildIndexes() {
  db.outlets.outlets.forEach((o) => idx.outlets.set(o.id, o));
  db.products.products.forEach((p) => idx.products.set(p.sku, p));
  db.distributor_stock.items.forEach((s) => idx.stock.set(s.sku, s));
  db.orders.orders.forEach((o) => {
    if (!idx.orders.has(o.outletId)) idx.orders.set(o.outletId, []);
    idx.orders.get(o.outletId).push(o);
  });
  db.current_stock.rows.forEach((r) => {
    if (!idx.onHand.has(r.outletId)) idx.onHand.set(r.outletId, []);
    idx.onHand.get(r.outletId).push(r);
  });
}

async function loadData() {
  const read = SERVED ? fetchFile : readEmbedded;
  const loaded = await Promise.all(FILES.map(async (n) => [n, await read(n)]));
  loaded.forEach(([n, v]) => { db[n] = v; });
  validate();
  buildIndexes();
  console.info(`[data] ${FILES.length} files loaded from ${SERVED ? 'data/*.json' : 'the copy embedded in this page'}`);
}

// ---- selectors (the feature reuses these) ---------------------------------

const config = () => db.config;
const demoDate = () => db.config.demoDate;

const outlets = () => db.outlets.outlets;
const outlet = (id) => idx.outlets.get(id) ?? null;

const products = () => db.products.products;
const product = (sku) => idx.products.get(sku) ?? null;
const categories = () => db.products.categories ?? [...new Set(products().map((p) => p.category))];

const schemes = () => db.schemes.schemes;

/** Past orders from orders.json only. For past + demo orders use orders.allOrdersFor(). */
const pastOrders = (outletId) => idx.orders.get(outletId) ?? [];

/** { SKU: [weekly cases …] } aligned with historyWeeks(); SKUs never bought are absent. */
const history = (outletId) => db.history.outlets?.[outletId] ?? {};
const historyWeeks = () => ({ weeks: db.history.weeks, weekStarts: db.history.weekStarts ?? [] });

const visits = (outletId) => db.visits.outlets?.[outletId] ?? null;

/** Today's route, in route order. */
const route = () => outlets()
  .filter((o) => visits(o.id)?.todayOnRoute)
  .sort((a, b) => (visits(a.id).routeOrder ?? 99) - (visits(b.id).routeOrder ?? 99));

const stock = () => db.distributor_stock;
const stockFor = (sku) => idx.stock.get(sku) ?? null;
const calendar = () => db.calendar;
const peers = () => db.peers;

/** Estimated cases on hand today, per SKU: [{ sku, estimatedCasesOnHand, confidence, repCountedCases? … }]. */
const onHand = (outletId) => idx.onHand.get(outletId) ?? [];

/** Demo additions (synthetic, labelled on screen): reps, targets, leaderboard, newer SKUs, yesterday's stock. */
const field = () => db.field;
const myRepId = () => 'REP-01';
const repFor = (outletId) => db.field.reps.find((r) => r.id === (outlet(outletId)?.repId ?? 'REP-01')) ?? null;

/** True while data/ still holds the stub (any file's meta.note starts with "STUB"). */
const isStub = () => Object.values(db).some((f) => String(f?.meta?.note ?? '').startsWith('STUB'));

return { SERVED, DataError, hasEmbedded, loadData, config, demoDate, outlets, outlet, products, product, categories, schemes, pastOrders, history, historyWeeks, visits, route, stock, stockFor, calendar, peers, onHand, field, myRepId, repFor, isStub };
})();

/* ==================== js/cart.js ==================== */
modules['cart'] = (() => {
// The cart: one state object for one outlet, and a way to subscribe to every change.
//
//   const off = cart.subscribe(({ type, sku, cases, cart }) => …);
//   type: 'start' (new order for an outlet) · 'add' (+) · 'remove' (−) · 'set' (typed quantity) · 'clear'
//   sku/cases: the line that changed and its new quantity (null for start/clear)
//   cart: a snapshot { outletId, lines: { SKU: cases }, totalCases }

const MAX_CASES = 999;

const state = { outletId: null, lines: {} };
const listeners = new Set();

const clamp = (n) => Math.max(0, Math.min(MAX_CASES, Math.floor(Number(n) || 0)));
const total = () => Object.values(state.lines).reduce((a, b) => a + b, 0);

function snapshot() {
  return { outletId: state.outletId, lines: { ...state.lines }, totalCases: total() };
}

function emit(type, sku = null) {
  const event = { type, sku, cases: sku ? (state.lines[sku] ?? 0) : null, cart: snapshot() };
  listeners.forEach((fn) => {
    try { fn(event); } catch (err) { console.error('[cart] listener failed', err); }
  });
}

function write(sku, n, type) {
  const next = clamp(n);
  if (next === (state.lines[sku] ?? 0)) return;
  if (next === 0) delete state.lines[sku];
  else state.lines[sku] = next;
  emit(type, sku);
}

const cart = {
  get outletId() { return state.outletId; },
  get: (sku) => state.lines[sku] ?? 0,
  lines: () => ({ ...state.lines }),
  totalCases: total,
  isEmpty: () => total() === 0,
  snapshot,

  /** Start a fresh order for an outlet (drops any lines). */
  start(outletId) {
    state.outletId = outletId;
    state.lines = {};
    emit('start');
  },
  add(sku, n = 1) { write(sku, (state.lines[sku] ?? 0) + n, 'add'); },
  remove(sku, n = 1) { write(sku, (state.lines[sku] ?? 0) - n, 'remove'); },
  /** Typed quantity: whole numbers 0–999. */
  set(sku, n) { write(sku, n, 'set'); },
  clear() {
    state.outletId = null;
    state.lines = {};
    emit('clear');
  },

  subscribe(fn) {
    listeners.add(fn);
    return () => listeners.delete(fn);
  },
};

return { MAX_CASES, cart };
})();

modules['orders'] = (() => {
// Orders placed in the demo live in localStorage under one key, in the orders.json
// shape with source "demo". "Last order" anywhere = the latest from either source.

const data = modules['data'];

const KEY = 'gtapp.demo.v1';
let memory = [];        // used when localStorage is blocked (some private windows)
let useMemory = false;

function read() {
  if (useMemory) return memory;
  try {
    const parsed = JSON.parse(localStorage.getItem(KEY) ?? 'null');
    return Array.isArray(parsed?.orders) ? parsed.orders : [];
  } catch {
    return memory;
  }
}

function write(list) {
  memory = list;
  try {
    localStorage.setItem(KEY, JSON.stringify({ orders: list }));
  } catch {
    useMemory = true;
  }
}

const counter = (id) => Number(String(id).split('-').pop()) || 0;

/** Newest first: by date, then demo after history, then demo counter. */
function newestFirst(a, b) {
  if (a.date !== b.date) return a.date < b.date ? 1 : -1;
  if (a.source !== b.source) return a.source === 'demo' ? -1 : 1;
  return counter(b.id) - counter(a.id);
}

const demoOrders = () => read();
const demoOrdersFor = (outletId) => read().filter((o) => o.outletId === outletId);
const demoOrdersOn = (outletId, isoDate) => demoOrdersFor(outletId).filter((o) => o.date === isoDate);
const orderById = (id) => read().find((o) => o.id === id) ?? null;

/** Every order for an outlet, past and demo, newest first. */
const allOrdersFor = (outletId) => [...data.pastOrders(outletId), ...demoOrdersFor(outletId)].sort(newestFirst);

const lastOrder = (outletId) => allOrdersFor(outletId)[0] ?? null;

const paidCases = (order) => order.lines.reduce((n, l) => n + (l.cases || 0), 0);
const freeCases = (order) => order.lines.reduce((n, l) => n + (l.freeCases || 0), 0);

/** Saves a demo order and returns it with its id (DEMO-<outlet no>-<counter>). */
function saveOrder({ outletId, lines, grossValue, discountValue, netValue, schemeIds, schemeEstimate = null }) {
  const list = read();
  const no = String(outletId).split('-').pop();
  const n = Math.max(0, ...list.filter((o) => o.outletId === outletId).map((o) => counter(o.id))) + 1;
  const order = {
    id: `DEMO-${no}-${n}`,
    outletId,
    date: data.demoDate(),
    lines,
    grossValue,
    discountValue,
    netValue,
    schemeIds,
    schemeEstimate,
    source: 'demo',
    repId: data.myRepId(),
    outletRepId: data.outlet(outletId)?.repId ?? data.myRepId(),
  };
  write([...list, order]);
  return order;
}

/** "Reset demo": deletes only the orders placed in the demo. */
function resetDemo() {
  memory = [];
  try { localStorage.removeItem(KEY); } catch { /* nothing stored */ }
}

return { demoOrders, demoOrdersFor, demoOrdersOn, orderById, allOrdersFor, lastOrder, paidCases, freeCases, saveOrder, resetDemo };
})();

modules['i18n'] = (() => {
// Languages: English, Marathi (मराठी) and Hindi (हिंदी).
// All interface text comes from js/strings.js through t(). Data text (outlet, product and
// scheme names, visit notes, event names) stays as written in the data files; common data
// values (tiers, channels, categories, areas) are translated with label().
// Numbers stay in Western digits in every language, as reps and retailers read them fastest.

const { app } = modules['app'];
const { STRINGS } = modules['strings'];

const LANGS = [
  { code: 'en', label: 'English', short: 'EN' },
  { code: 'mr', label: 'मराठी', short: 'मरा' },
  { code: 'hi', label: 'हिंदी', short: 'हिं' },
];

const KEY = 'gtapp.lang.v1';   // per-viewer preference; Reset demo keeps it
const inr = new Intl.NumberFormat('en-IN', { maximumFractionDigits: 0 });
let current = 'en';
try {
  const saved = localStorage.getItem(KEY);
  if (LANGS.some((l) => l.code === saved)) current = saved;
} catch { /* default: English */ }

const lang = () => current;

/** Sets <html lang>, which also switches the Devanagari typography in the CSS. */
function applyLang() {
  document.documentElement.lang = current;
}

function setLang(code) {
  if (!LANGS.some((l) => l.code === code) || code === current) return;
  current = code;
  try { localStorage.setItem(KEY, code); } catch { /* this visit only */ }
  applyLang();
  app.emit('lang:changed', code);
}

const has = (code, key) => Object.prototype.hasOwnProperty.call(STRINGS[code] ?? {}, key);

/**
 * t('n.case', { n: 3 }) → "3 cases" / "3 पेट्या" / "3 पेटी".
 * An entry may be { one, other }; `n` picks the form and, when it is a number, is shown
 * with Indian grouping. Missing keys fall back to English, then to the key itself.
 */
function t(key, vars = {}) {
  let entry = has(current, key) ? STRINGS[current][key] : STRINGS.en[key];
  if (entry == null) return key;
  if (typeof entry === 'object') entry = vars.n === 1 ? entry.one : entry.other;
  return entry.replace(/\{(\w+)\}/g, (m, k) => {
    const v = vars[k];
    if (v == null) return '';
    return k === 'n' && typeof v === 'number' ? inr.format(v) : String(v);
  });
}

/** A data value in the current language when the dictionary knows it (e.g. label('tier', 'Gold')), else as written. */
function label(kind, value) {
  if (value == null || value === '') return '';
  const key = `${kind}.${value}`;
  return has(current, key) ? STRINGS[current][key] : String(value);
}

/** Keys that English has and a language lacks, for checking translations from the console. */
const missing = (code) => Object.keys(STRINGS.en).filter((k) => !has(code, k));

return { LANGS, lang, applyLang, setLang, t, label, missing };
})();

const NAMES = {
  en: {
    day: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'],
    dayLong: ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'],
    mon: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'],
    monLong: ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'],
    monTiny: ['J', 'F', 'M', 'A', 'M', 'J', 'J', 'A', 'S', 'O', 'N', 'D'],
  },
  mr: {

    dayLong: ['रविवार', 'सोमवार', 'मंगळवार', 'बुधवार', 'गुरुवार', 'शुक्रवार', 'शनिवार'],
    mon: ['जाने', 'फेब्रु', 'मार्च', 'एप्रि', 'मे', 'जून', 'जुलै', 'ऑग', 'सप्टें', 'ऑक्टो', 'नोव्हें', 'डिसें'],
    monLong: ['जानेवारी', 'फेब्रुवारी', 'मार्च', 'एप्रिल', 'मे', 'जून', 'जुलै', 'ऑगस्ट', 'सप्टेंबर', 'ऑक्टोबर', 'नोव्हेंबर', 'डिसेंबर'],
    monTiny: ['जा', 'फे', 'मा', 'ए', 'मे', 'जू', 'जु', 'ऑ', 'स', 'ऑ', 'नो', 'डि'],
  },
  hi: {
    day: ['रवि', 'सोम', 'मंगल', 'बुध', 'गुरु', 'शुक्र', 'शनि'],
    dayLong: ['रविवार', 'सोमवार', 'मंगलवार', 'बुधवार', 'गुरुवार', 'शुक्रवार', 'शनिवार'],
    mon: ['जन', 'फ़र', 'मार्च', 'अप्रै', 'मई', 'जून', 'जुला', 'अग', 'सित', 'अक्टू', 'नव', 'दिस'],
    monLong: ['जनवरी', 'फ़रवरी', 'मार्च', 'अप्रैल', 'मई', 'जून', 'जुलाई', 'अगस्त', 'सितंबर', 'अक्टूबर', 'नवंबर', 'दिसंबर'],
    monTiny: ['ज', 'फ़', 'मा', 'अ', 'म', 'जू', 'जु', 'अ', 'सि', 'अ', 'न', 'दि'],

function parseISO(iso) {
  const [y, m, d] = String(iso).split('-').map(Number);
  return new Date(Date.UTC(y, m - 1, d));
}
const toISO = (dt) => dt.toISOString().slice(0, 10);

function addDays(iso, n) {
  const dt = parseISO(iso);
  dt.setUTCDate(dt.getUTCDate() + n);
  return toISO(dt);
}

/** Whole days from `from` to `to` (positive when `to` is later). */
const daysBetween = (from, to) => Math.round((parseISO(to) - parseISO(from)) / 86400000);

const monthKey = (iso) => String(iso).slice(0, 7);

function addMonths(key, n) {
  let [y, m] = key.split('-').map(Number);
  m += n;
  while (m < 1) { m += 12; y -= 1; }
  while (m > 12) { m -= 12; y += 1; }
  return `${y}-${String(m).padStart(2, '0')}`;
}

const monthName = (key, long = false) => (long ? names().monLong : names().mon)[Number(String(key).slice(5, 7)) - 1];
/** One or two letters for chart axes. */
const monthTiny = (key) => names().monTiny[Number(String(key).slice(5, 7)) - 1];

/** "Tue 28 Apr 2026" by default; options drop the weekday or year, or spell names out. */
function date(iso, { weekday = true, year = true, long = false } = {}) {
  if (!iso) return '';
  const dt = parseISO(iso);
  const n = names();
  const parts = [];
  if (weekday) parts.push((long ? n.dayLong : n.day)[dt.getUTCDay()]);
  parts.push(String(dt.getUTCDate()), (long ? n.monLong : n.mon)[dt.getUTCMonth()]);
  if (year) parts.push(String(dt.getUTCFullYear()));
  return parts.join(' ');
}

/** "Tue 21 Apr" */
const shortDate = (iso) => date(iso, { year: false });

/** "1 May – 14 Jun" (years shown only when they differ from `today`'s). */
function dateRange(from, to, today) {
  const y = String(today).slice(0, 4);
  const opts = (iso) => ({ weekday: false, year: String(iso).slice(0, 4) !== y });
  return `${date(from, opts(from))} – ${date(to, opts(to))}`;
}

/** Relative to the demo date: "today", "yesterday", "7 days ago", "in 3 days". */
function relative(iso, today) {
  const d = daysBetween(iso, today);
  if (d === 0) return t('common.today');
  if (d === 1) return t('common.yesterday');
  if (d === -1) return t('common.tomorrow');
  return d > 0 ? t('common.daysAgo', { n: d }) : t('common.inDays', { n: -d });
}

/** ISO week label, e.g. "2026-W18". */
function isoWeek(iso) {
  const dt = parseISO(iso);
  const day = dt.getUTCDay() || 7;
  dt.setUTCDate(dt.getUTCDate() + 4 - day);
  const yearStart = new Date(Date.UTC(dt.getUTCFullYear(), 0, 1));
  const week = Math.ceil(((dt - yearStart) / 86400000 + 1) / 7);
  return `${dt.getUTCFullYear()}-W${String(week).padStart(2, '0')}`;
}

return { num, rupees, plural, casesText, unitsText, parseISO, toISO, addDays, daysBetween, monthKey, addMonths, monthName, monthTiny, date, shortDate, dateRange, relative, isoWeek };

modules['schemes'] = (() => {
// Scheme rules, written once. The base uses them to price the cart; the feature reuses them.
//
// Rules (PROGRESS.md → build plan):
// - Free goods: 1 free per full `buyCases`. Pooled schemes count any mix of their SKUs and
//   deliver the free case(s) as the largest line. A "use" = one free case; the monthly cap
//   counts uses across all of the outlet's orders that month (past + demo).
// - Percent off: taken off the scheme's lines when they total `minCases` or more.
// - First order: % off the whole order (after other discounts), first order only, within
//   N days of registration.
// - Programs (e.g. cooler purity) are never applied at the cart.
// - Schemes stack. Money is rounded to whole rupees.

const data = modules['data'];
const { daysBetween, monthKey } = modules['format'];
const { t, label, lang } = modules['i18n'];

const isActive = (s, date) => (!s.validFrom || s.validFrom <= date) && (!s.validTo || date <= s.validTo);
const coversSku = (s, sku) => s.skus === 'all' || (Array.isArray(s.skus) && s.skus.includes(sku));

/** Schemes valid on a date (default: the demo date). */
const activeSchemes = (date = data.demoDate()) => data.schemes().filter((s) => isActive(s, date));

/** SKU-level schemes to show on a product row (not programs or whole-order offers). */
const schemesForSku = (sku, date = data.demoDate()) =>
  activeSchemes(date).filter((s) => Array.isArray(s.skus) && s.skus.includes(sku) && s.type !== 'program');

/** → { eligible, reason }. `orders` = the outlet's orders (past + demo). */
function eligibility(scheme, outlet, date, orders = []) {
  if (!isActive(scheme, date)) return { eligible: false, reason: t('sch.reason.dates') };
  const tiers = scheme.eligibleTiers;
  if (Array.isArray(tiers) && !tiers.includes(outlet.tier)) return { eligible: false, reason: t('sch.reason.tier', { tier: label('tier', outlet.tier) }) };
  if (scheme.requiresBottlerCooler && outlet.cooler?.type !== 'bottler') return { eligible: false, reason: t('sch.reason.cooler') };
  if (scheme.type === 'first-order') {
    // Age first: an established outlet should read "first 90 days", not "first order only".
    const limit = scheme.rule?.withinDaysOfRegistration ?? 90;
    const age = outlet.registeredOn ? daysBetween(outlet.registeredOn, date) : Infinity;
    if (!(age >= 0 && age <= limit)) return { eligible: false, reason: t('sch.reason.age', { days: limit }) };
    if (orders.length > 0) return { eligible: false, reason: t('sch.reason.first') };
  }
  return { eligible: true, reason: '' };
}

/** Free cases this scheme already gave the outlet in the date's calendar month. */
function usesThisMonth(scheme, orders, date) {
  const month = monthKey(date);
  return orders
    .filter((o) => monthKey(o.date) === month && (!Array.isArray(o.schemeIds) || o.schemeIds.includes(scheme.id)))
    .reduce((n, o) => n + o.lines.filter((l) => coversSku(scheme, l.sku)).reduce((m, l) => m + (l.freeCases || 0), 0), 0);
}

/**
 * The scheme's state for one outlet today:
 *   'enrolled'   a program the outlet already receives (e.g. cooler purity)
 *   'applicable' can be used on an order ({ cap, used } when it has a monthly cap)
 *   'used'       eligible, but this month's cap is used up ({ cap, used })
 *   'not'        not for this outlet ({ reason })
 */
function statusFor(scheme, outlet, date, orders = []) {
  const el = eligibility(scheme, outlet, date, orders);
  if (!el.eligible) return { kind: 'not', reason: el.reason };
  if (scheme.type === 'program') return { kind: 'enrolled' };
  const cap = scheme.capUsesPerMonth || null;
  const used = cap ? usesThisMonth(scheme, orders, date) : 0;
  if (cap && used >= cap) return { kind: 'used', cap, used };
  return { kind: 'applicable', cap, used };
}

/** Cases a tap on the scheme's chip adds: its threshold (buy 10 → 10, 5+ cases → 5). */
const quickAdd = (s) => s.rule?.buyCases ?? s.rule?.minCases ?? 1;

const productName = (sku) => data.product(sku)?.name ?? sku;

/** "Cola 250 ml PET, Lemon-lime 250 ml PET and Cola 200 ml returnable glass" in the current language. */
function listNames(skus) {
  const names = (Array.isArray(skus) ? skus : []).map(productName);
  return names.length > 1 ? `${names.slice(0, -1).join(', ')} ${t('common.and')} ${names.at(-1)}` : names[0] ?? '';
}

/** Money amount written in a program's payout, e.g. "₹300". */
const payoutAmount = (s) => (String(s.payout ?? '').match(/₹\s?[\d,]+/) ?? [''])[0].replace(/\s/, '');

/** Short chip text, e.g. "Buy 10, get 1 free". */
function chipText(s) {
  const r = s.rule ?? {};
  switch (s.type) {
    case 'free-goods': return t('sch.chip.free', { buy: r.buyCases, free: r.freeCases }) + (r.pooled && s.skus.length > 1 ? t('sch.chip.mix') : '');
    case 'percent-off': return t('sch.chip.pct', { pct: r.percent, min: r.minCases });
    case 'first-order': return t('sch.chip.first', { pct: r.percent });
    default: return s.name;
  }
}

/** One plain sentence describing the offer. */
function offerText(s) {
  const r = s.rule ?? {};
  switch (s.type) {
    case 'free-goods':
      return r.pooled && s.skus.length > 1
        ? t('sch.offer.freePooled', { buy: r.buyCases, free: r.freeCases, skus: listNames(s.skus) })
        : t('sch.offer.free', { buy: r.buyCases, free: r.freeCases, skus: listNames(s.skus) });
    case 'percent-off':
      return t('sch.offer.pct', { pct: r.percent, min: r.minCases, skus: listNames(s.skus) });
    case 'first-order':
      return t('sch.offer.first', { pct: r.percent, days: r.withinDaysOfRegistration });
    default: {
      // Programs describe themselves in the data; translated when the dictionary knows the scheme.
      const translated = label('schOffer', s.id);
      return lang() !== 'en' && translated !== s.id ? translated.replace('{amt}', payoutAmount(s)) : s.payout ?? '';
    }
  }
}

/** The scheme's "also" line (e.g. a free shelf-strip), translated when known. */
function extrasText(s) {
  if (!s.extras) return '';
  const translated = label('schExtras', s.id);
  return lang() !== 'en' && translated !== s.id ? translated : s.extras;
}

/**
 * Prices a cart for an outlet on a date.
 * cart: { SKU: cases } · orders: the outlet's orders so far (past + demo), for caps and first-order.
 * → { lines, gross, discount, net, paidCases, freeCases, totalCases, schemes, schemeIds }
 *   lines:   [{ sku, product, cases, freeCases, rate, gross }] in catalogue order
 *   schemes: one entry per active scheme that touches the cart:
 *            { scheme, kind: 'free'|'discount', eligible, reason, qualifyingCases,
 *              earned, granted, freeSku, cap, usedBefore, usedAfter, capHit, amount }
 */
function price(cart, outlet, date = data.demoDate(), orders = []) {
  const lines = data.products()
    .filter((p) => (cart[p.sku] ?? 0) > 0)
    .map((p) => ({ sku: p.sku, product: p, cases: cart[p.sku], freeCases: 0, rate: p.ptrPerCase, gross: cart[p.sku] * p.ptrPerCase }));
  Object.keys(cart).forEach((sku) => { if (!data.product(sku) && cart[sku] > 0) console.warn(`[schemes] unknown SKU in cart: ${sku}`); });

  const gross = lines.reduce((n, l) => n + l.gross, 0);
  const result = [];
  let discount = 0;
  const active = activeSchemes(date).filter((s) => s.type !== 'program');

  for (const s of active.filter((x) => x.type === 'free-goods')) {
    const scoped = lines.filter((l) => coversSku(s, l.sku));
    if (!scoped.length) continue;
    const { eligible, reason } = eligibility(s, outlet, date, orders);
    const r = s.rule;
    const qualifyingCases = scoped.reduce((n, l) => n + l.cases, 0);
    const earned = r.pooled
      ? Math.floor(qualifyingCases / r.buyCases) * r.freeCases
      : scoped.reduce((n, l) => n + Math.floor(l.cases / r.buyCases) * r.freeCases, 0);
    const cap = s.capUsesPerMonth || null;
    const usedBefore = cap ? usesThisMonth(s, orders, date) : 0;
    const granted = eligible ? Math.min(earned, cap ? Math.max(0, cap - usedBefore) : earned) : 0;
    let freeSku = null;
    if (granted > 0) {
      if (r.pooled) {
        const order = Array.isArray(s.skus) ? s.skus : [];
        const pick = data.product(r.freeSku) && r.freeSku !== 'largest-line'
          ? (lines.find((l) => l.sku === r.freeSku) ?? addZeroLine(lines, r.freeSku))
          : [...scoped].sort((a, b) => b.cases - a.cases || order.indexOf(a.sku) - order.indexOf(b.sku))[0];
        pick.freeCases += granted;
        freeSku = pick.sku;
      } else {
        let left = granted;
        for (const l of scoped) {
          const give = Math.min(left, Math.floor(l.cases / r.buyCases) * r.freeCases);
          l.freeCases += give;
          left -= give;
          if (give && !freeSku) freeSku = l.sku;
        }
      }
    }
    result.push({
      scheme: s, kind: 'free', eligible, reason, qualifyingCases, earned, granted, freeSku,
      cap, usedBefore, usedAfter: usedBefore + granted, capHit: Boolean(cap && eligible && earned > granted), amount: 0,
    });
  }

  for (const s of active.filter((x) => x.type === 'percent-off')) {
    const scoped = lines.filter((l) => coversSku(s, l.sku));
    if (!scoped.length) continue;
    const { eligible, reason } = eligibility(s, outlet, date, orders);
    const qualifyingCases = scoped.reduce((n, l) => n + l.cases, 0);
    const meets = qualifyingCases >= (s.rule.minCases ?? 0);
    const amount = eligible && meets ? Math.round(scoped.reduce((n, l) => n + l.gross, 0) * s.rule.percent / 100) : 0;
    discount += amount;
    result.push({ scheme: s, kind: 'discount', eligible, reason, qualifyingCases, amount });
  }

  for (const s of active.filter((x) => x.type === 'first-order')) {
    if (!lines.length) continue;
    const { eligible, reason } = eligibility(s, outlet, date, orders);
    const amount = eligible ? Math.round((gross - discount) * s.rule.percent / 100) : 0;
    discount += amount;
    result.push({ scheme: s, kind: 'discount', eligible, reason, qualifyingCases: null, amount });
  }

  const paidCases = lines.reduce((n, l) => n + l.cases, 0);
  const freeCases = lines.reduce((n, l) => n + l.freeCases, 0);
  return {
    lines,
    gross,
    discount,
    net: gross - discount,
    paidCases,
    freeCases,
    totalCases: paidCases + freeCases,
    schemes: result,
    schemeIds: result.filter((x) => x.granted > 0 || x.amount > 0).map((x) => x.scheme.id),
  };
}

function addZeroLine(lines, sku) {
  const p = data.product(sku);
  const line = { sku, product: p, cases: 0, freeCases: 0, rate: p.ptrPerCase, gross: 0 };
  lines.push(line);
  return line;
}

return { isActive, coversSku, activeSchemes, schemesForSku, eligibility, usesThisMonth, statusFor, quickAdd, listNames, payoutAmount, chipText, offerText, extrasText, price };
})();

// ---- safe templating ------------------------------------------------------
class Html {
  constructor(s) { this.s = s; }
  toString() { return this.s; }
}
const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = (v) => String(v).replace(/[&<>"']/g, (c) => ESC[c]);
const raw = (s) => new Html(String(s));

// Booleans render as nothing (so `${cond && x}` is safe); wrap in String() for attribute values.
function part(v) {
  if (v == null || v === false || v === true) return '';
  if (v instanceof Html) return v.s;
  if (Array.isArray(v)) return v.map(part).join('');
  return esc(v);
}

/** html`<p>${value}</p>` escapes values unless they are html`` or raw(). */
function html(strings, ...values) {
  let out = strings[0];
  values.forEach((v, i) => { out += part(v) + strings[i + 1]; });
  return new Html(out);
}

const icon = (name, cls = '') =>
  raw(`<svg class="icon ${cls}" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[name] ?? ''}</svg>`);

// ---- components -----------------------------------------------------------

/** Top bar: optional back link, title (+ subtitle), an optional action, and the language button. */
function appBar({ title, sub = '', back = null, action = null, heading = true }) {
  const titleTag = heading ? raw('h1') : raw('p');
  return html`<header class="app-bar">
    ${back ? html`<a class="app-bar-back" href="${back}">${icon('back')}<span>${t('common.back')}</span></a>` : ''}
