// A tiny event bus, the sign-in session and navigation memory.
//
// Feature code listens here, for example:
//   app.on('screen:rendered', ({ screen, outletId, root }) => { … fill a [data-slot] … })
// Screens: login, home, outlets, outlet, book, review, saved.

const handlers = new Map();

const app = {
  on(event, fn) {
    if (!handlers.has(event)) handlers.set(event, new Set());
    handlers.get(event).add(fn);
    return () => app.off(event, fn);
  },
  off(event, fn) {
    handlers.get(event)?.delete(fn);
  },
  emit(event, payload) {
    handlers.get(event)?.forEach((fn) => {
      try { fn(payload); } catch (err) { console.error(`[app] "${event}" listener failed`, err); }
    });
  },
};

// Signed-in flag lives in sessionStorage; "Reset demo" clears it.
const SESSION_KEY = 'gtapp.session.v1';
let memory = null;

/** "rohit.jagtap" → "Rohit Jagtap". The signed-in username is the rep's name everywhere. */
function displayName(raw) {
  return String(raw ?? '').trim().replace(/[._]+/g, ' ').replace(/\s+/g, ' ')
    .replace(/(^|\s)([a-z])/g, (m, space, ch) => space + ch.toUpperCase());
}

const session = {
  /** The rep's display name, from the username they signed in with. */
  name() {
    return displayName(session.user()?.username);
  },
  user() {
    try {
      const raw = sessionStorage.getItem(SESSION_KEY);
      return raw ? JSON.parse(raw) : memory;
    } catch {
      return memory;
    }
  },
  signIn(username) {
    memory = { username };
    try { sessionStorage.setItem(SESSION_KEY, JSON.stringify(memory)); } catch { /* memory only */ }
  },
  signOut() {
    memory = null;
    try { sessionStorage.removeItem(SESSION_KEY); } catch { /* nothing stored */ }
  },
};

// Which list the rep came from, so Outlet details knows where "Back" goes.
const nav = { hub: '#/home' };

// Navigation. Routes live in the URL hash (#/outlet/OUT-01) when the page may change its URL.
// Some previews (a file opened as a data: URL, some sandboxes) silently refuse, so the current
// route is also kept in memory and every in-app link goes through router.go().
let currentHash = null;
let onRoute = () => {};

const router = {
  current: () => currentHash ?? location.hash,

  go(hash, { replace = false } = {}) {
    currentHash = hash;
    try {
      if (location.hash !== hash) history[replace ? 'replaceState' : 'pushState'](null, '', hash);
    } catch { /* URL can't change here; the route lives in memory */ }
    onRoute();
  },

  start(render) {
    onRoute = render;
    currentHash = location.hash || null;
    const sync = () => {
      if (location.hash && location.hash !== currentHash) {
        currentHash = location.hash;
        render();
      }
    };
    window.addEventListener('popstate', sync);      // back / forward
    window.addEventListener('hashchange', sync);    // URL typed by hand
    document.addEventListener('click', (e) => {
      const a = e.target.closest?.('a[href^="#/"]');
      if (!a || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      e.preventDefault();
      router.go(a.getAttribute('href'));
    });
  },
};

return { app, displayName, session, nav, router };
})();

/* ==================== js/data.js ==================== */
modules['data'] = (() => {
// Loads the demo data and exposes read-only selectors. The files follow the data contract in PROGRESS.md.
//
// Where the data comes from:
// - Served over http(s) (the hosted site): data/<name>.json next to the page. The data files are the
//   source, so editing one and reloading changes the screen. Relative paths keep a GitHub Pages
//   subfolder working.
// - Opened without a server (gt-app.html double-clicked, or a preview snapshot): the copy embedded
//   in the page by scripts/build_single.py, as <script type="application/json" id="data-<name>">.

const FILES = ['config', 'outlets', 'products', 'schemes', 'orders', 'history', 'visits', 'distributor_stock', 'calendar', 'peers', 'current_stock', 'field'];
const SERVED = typeof location !== 'undefined' && (location.protocol === 'http:' || location.protocol === 'https:');

const db = {};
const idx = { outlets: new Map(), products: new Map(), orders: new Map(), stock: new Map(), onHand: new Map() };

class DataError extends Error {
  constructor(file, detail) {
    super(`${file}: ${detail}`);
    this.file = file;
    this.detail = detail;
  }
}

async function fetchFile(name) {
  const file = `data/${name}.json`;
  let res;
  try {
    res = await fetch(file, { cache: 'no-cache' });
  } catch (err) {
    throw new DataError(file, `could not be fetched (${err.message})`);
  }
  if (!res.ok) throw new DataError(file, `HTTP ${res.status}. Is the data/ folder next to the page?`);
  try {
    return await res.json();
  } catch (err) {
    throw new DataError(file, `is not valid JSON (${err.message})`);
  }
}

function readEmbedded(name) {
  const el = document.getElementById(`data-${name}`);
  if (!el) throw new DataError(`data/${name}.json`, 'is not embedded in this page. Rebuild gt-app.html, or open the hosted link.');
  try {
    return JSON.parse(el.textContent);
  } catch (err) {
    throw new DataError(`data-${name} (embedded in the page)`, `is not valid JSON (${err.message})`);
  }
}

/** True when the page carries an embedded copy of the data (the single-file build). */
const hasEmbedded = () => Boolean(document.getElementById('data-config'));

function need(file, cond, what) {
  if (!cond) throw new DataError(`data/${file}.json`, `missing or wrong: ${what}`);
}

function validate() {
  const { config, outlets, products, schemes, orders, history, visits, distributor_stock: stock } = db;
  need('config', /^\d{4}-\d{2}-\d{2}$/.test(config?.demoDate ?? ''), 'demoDate (YYYY-MM-DD)');
  need('config', config.region?.name && config.rep?.name, 'region.name, rep.name');
  need('outlets', Array.isArray(outlets?.outlets) && outlets.outlets.length, 'outlets[]');
  outlets.outlets.forEach((o, i) => need('outlets', o.id && o.name && o.tier, `outlets[${i}].id / name / tier`));
  need('products', Array.isArray(products?.products) && products.products.length, 'products[]');
  products.products.forEach((p, i) => need('products', p.sku && p.name && Number.isFinite(p.ptrPerCase), `products[${i}].sku / name / ptrPerCase`));
  need('schemes', Array.isArray(schemes?.schemes), 'schemes[]');
  need('orders', Array.isArray(orders?.orders), 'orders[]');
  need('history', Array.isArray(history?.weeks) && history.outlets, 'weeks[], outlets');
  need('visits', visits?.outlets && typeof visits.outlets === 'object', 'outlets');
  need('distributor_stock', Array.isArray(stock?.items), 'items[]');
  need('peers', Array.isArray(db.peers?.groups), 'groups[]');
  need('current_stock', Array.isArray(db.current_stock?.rows), 'rows[]');
  need('field', db.field?.targets?.preSeason && Array.isArray(db.field?.reps), 'targets.preSeason, reps[]');
}

function buildIndexes() {
  db.outlets.outlets.forEach((o) => idx.outlets.set(o.id, o));
  db.products.products.forEach((p) => idx.products.set(p.sku, p));
  db.distributor_stock.items.forEach((s) => idx.stock.set(s.sku, s));
  db.orders.orders.forEach((o) => {
    if (!idx.orders.has(o.outletId)) idx.orders.set(o.outletId, []);
    idx.orders.get(o.outletId).push(o);
  });
  db.current_stock.rows.forEach((r) => {
    if (!idx.onHand.has(r.outletId)) idx.onHand.set(r.outletId, []);
    idx.onHand.get(r.outletId).push(r);
  });
}

async function loadData() {
  const read = SERVED ? fetchFile : readEmbedded;
  const loaded = await Promise.all(FILES.map(async (n) => [n, await read(n)]));
  loaded.forEach(([n, v]) => { db[n] = v; });
  validate();
  buildIndexes();
  console.info(`[data] ${FILES.length} files loaded from ${SERVED ? 'data/*.json' : 'the copy embedded in this page'}`);
}

/** Tests and scripts (Node): load the files directly, { config: {…}, outlets: {…}, … }. */
function useData(files) {
  Object.assign(db, files);
  validate();
  buildIndexes();
}

// ---- selectors (the feature reuses these) ---------------------------------

const config = () => db.config;
const demoDate = () => db.config.demoDate;

const outlets = () => db.outlets.outlets;
const outlet = (id) => idx.outlets.get(id) ?? null;

const products = () => db.products.products;
const product = (sku) => idx.products.get(sku) ?? null;
const categories = () => db.products.categories ?? [...new Set(products().map((p) => p.category))];

const schemes = () => db.schemes.schemes;

/** Past orders from orders.json only. For past + demo orders use orders.allOrdersFor(). */
const pastOrders = (outletId) => idx.orders.get(outletId) ?? [];

/** { SKU: [weekly cases …] } aligned with historyWeeks(); SKUs never bought are absent. */
const history = (outletId) => db.history.outlets?.[outletId] ?? {};
const historyWeeks = () => ({ weeks: db.history.weeks, weekStarts: db.history.weekStarts ?? [] });

const visits = (outletId) => db.visits.outlets?.[outletId] ?? null;

/** Today's route, in route order. */
const route = () => outlets()
  .filter((o) => visits(o.id)?.todayOnRoute)
  .sort((a, b) => (visits(a.id).routeOrder ?? 99) - (visits(b.id).routeOrder ?? 99));

const stock = () => db.distributor_stock;
const stockFor = (sku) => idx.stock.get(sku) ?? null;
const calendar = () => db.calendar;
const peers = () => db.peers;

/** Estimated cases on hand today, per SKU: [{ sku, estimatedCasesOnHand, confidence, repCountedCases? … }]. */
const onHand = (outletId) => idx.onHand.get(outletId) ?? [];

/** Demo additions (synthetic, labelled on screen): reps, targets, leaderboard, newer SKUs, yesterday's stock. */
const field = () => db.field;
const myRepId = () => 'REP-01';
const repFor = (outletId) => db.field.reps.find((r) => r.id === (outlet(outletId)?.repId ?? 'REP-01')) ?? null;

/** True while data/ still holds the stub (any file's meta.note starts with "STUB"). */
const isStub = () => Object.values(db).some((f) => String(f?.meta?.note ?? '').startsWith('STUB'));

return { SERVED, DataError, hasEmbedded, loadData, useData, config, demoDate, outlets, outlet, products, product, categories, schemes, pastOrders, history, historyWeeks, visits, route, stock, stockFor, calendar, peers, onHand, field, myRepId, repFor, isStub };
})();

/* ==================== js/cart.js ==================== */
modules['cart'] = (() => {
// The cart: one state object for one outlet, and a way to subscribe to every change.
//
//   const off = cart.subscribe(({ type, sku, cases, cart }) => …);
//   type: 'start' (new order for an outlet) · 'add' (+) · 'remove' (−) · 'set' (typed quantity) · 'clear'
//   sku/cases: the line that changed and its new quantity (null for start/clear)
//   cart: a snapshot { outletId, lines: { SKU: cases }, totalCases }

const MAX_CASES = 999;

const state = { outletId: null, lines: {} };
const listeners = new Set();

const clamp = (n) => Math.max(0, Math.min(MAX_CASES, Math.floor(Number(n) || 0)));
const total = () => Object.values(state.lines).reduce((a, b) => a + b, 0);

function snapshot() {
  return { outletId: state.outletId, lines: { ...state.lines }, totalCases: total() };
}

function emit(type, sku = null) {
  const event = { type, sku, cases: sku ? (state.lines[sku] ?? 0) : null, cart: snapshot() };
  listeners.forEach((fn) => {
    try { fn(event); } catch (err) { console.error('[cart] listener failed', err); }
  });
}

function write(sku, n, type) {
  const next = clamp(n);
  if (next === (state.lines[sku] ?? 0)) return;
  if (next === 0) delete state.lines[sku];
  else state.lines[sku] = next;
  emit(type, sku);
}

const cart = {
  get outletId() { return state.outletId; },
  get: (sku) => state.lines[sku] ?? 0,
  lines: () => ({ ...state.lines }),
  totalCases: total,
  isEmpty: () => total() === 0,
  snapshot,

  /** Start a fresh order for an outlet (drops any lines). */
  start(outletId) {
    state.outletId = outletId;
    state.lines = {};
    emit('start');
  },
  add(sku, n = 1) { write(sku, (state.lines[sku] ?? 0) + n, 'add'); },
  remove(sku, n = 1) { write(sku, (state.lines[sku] ?? 0) - n, 'remove'); },
  /** Typed quantity: whole numbers 0–999. */
  set(sku, n) { write(sku, n, 'set'); },
  clear() {
    state.outletId = null;
    state.lines = {};
    emit('clear');
  },

  subscribe(fn) {
    listeners.add(fn);
    return () => listeners.delete(fn);
  },
};

return { MAX_CASES, cart };
})();

/* ==================== js/orders.js ==================== */
modules['orders'] = (() => {
// Orders placed in the demo live in localStorage under one key, in the orders.json
// shape with source "demo". "Last order" anywhere = the latest from either source.

const data = modules['data'];

const KEY = 'gtapp.demo.v1';
let memory = [];        // used when localStorage is blocked (some private windows)
let useMemory = false;

function read() {
  if (useMemory) return memory;
  try {
    const parsed = JSON.parse(localStorage.getItem(KEY) ?? 'null');
    return Array.isArray(parsed?.orders) ? parsed.orders : [];
  } catch {
    return memory;
  }
}

function write(list) {
  memory = list;
  try {
    localStorage.setItem(KEY, JSON.stringify({ orders: list }));
  } catch {
    useMemory = true;
  }
}

const counter = (id) => Number(String(id).split('-').pop()) || 0;

/** Newest first: by date, then demo after history, then demo counter. */
function newestFirst(a, b) {
  if (a.date !== b.date) return a.date < b.date ? 1 : -1;
  if (a.source !== b.source) return a.source === 'demo' ? -1 : 1;
  return counter(b.id) - counter(a.id);
}

const demoOrders = () => read();
const demoOrdersFor = (outletId) => read().filter((o) => o.outletId === outletId);
const demoOrdersOn = (outletId, isoDate) => demoOrdersFor(outletId).filter((o) => o.date === isoDate);
const orderById = (id) => read().find((o) => o.id === id) ?? null;

/** Every order for an outlet, past and demo, newest first. */
const allOrdersFor = (outletId) => [...data.pastOrders(outletId), ...demoOrdersFor(outletId)].sort(newestFirst);

const lastOrder = (outletId) => allOrdersFor(outletId)[0] ?? null;

const paidCases = (order) => order.lines.reduce((n, l) => n + (l.cases || 0), 0);
const freeCases = (order) => order.lines.reduce((n, l) => n + (l.freeCases || 0), 0);

/** Saves a demo order and returns it with its id (DEMO-<outlet no>-<counter>). */
function saveOrder({ outletId, lines, grossValue, discountValue, netValue, schemeIds, schemeEstimate = null }) {
  const list = read();
  const no = String(outletId).split('-').pop();
  const n = Math.max(0, ...list.filter((o) => o.outletId === outletId).map((o) => counter(o.id))) + 1;
  const order = {
    id: `DEMO-${no}-${n}`,
    outletId,
    date: data.demoDate(),
    lines,
    grossValue,
    discountValue,
    netValue,
    schemeIds,
    schemeEstimate,
    source: 'demo',
    repId: data.myRepId(),
    outletRepId: data.outlet(outletId)?.repId ?? data.myRepId(),
  };
  write([...list, order]);
  return order;
}

/** "Reset demo": deletes only the orders placed in the demo. */
function resetDemo() {
  memory = [];
  try { localStorage.removeItem(KEY); } catch { /* nothing stored */ }
}

return { demoOrders, demoOrdersFor, demoOrdersOn, orderById, allOrdersFor, lastOrder, paidCases, freeCases, saveOrder, resetDemo };
})();

modules['i18n'] = (() => {
// Languages: English, Marathi (मराठी) and Hindi (हिंदी).
// All interface text comes from js/strings.js through t(). Data text (outlet, product and
// scheme names, visit notes, event names) stays as written in the data files; common data
// values (tiers, channels, categories, areas) are translated with label().
// Numbers stay in Western digits in every language, as reps and retailers read them fastest.

const { app } = modules['app'];
const { STRINGS } = modules['strings'];

const LANGS = [
  { code: 'en', label: 'English', short: 'EN' },
  { code: 'mr', label: 'मराठी', short: 'मरा' },
  { code: 'hi', label: 'हिंदी', short: 'हिं' },
];

const KEY = 'gtapp.lang.v1';   // per-viewer preference; Reset demo keeps it
const inr = new Intl.NumberFormat('en-IN', { maximumFractionDigits: 0 });
let current = 'en';
try {
  const saved = localStorage.getItem(KEY);
  if (LANGS.some((l) => l.code === saved)) current = saved;
} catch { /* default: English */ }

const lang = () => current;

/** Sets <html lang>, which also switches the Devanagari typography in the CSS. */
function applyLang() {
  document.documentElement.lang = current;
}

function setLang(code) {
  if (!LANGS.some((l) => l.code === code) || code === current) return;
  current = code;
  try { localStorage.setItem(KEY, code); } catch { /* this visit only */ }
  applyLang();
  app.emit('lang:changed', code);
}

const has = (code, key) => Object.prototype.hasOwnProperty.call(STRINGS[code] ?? {}, key);

/**
 * t('n.case', { n: 3 }) → "3 cases" / "3 पेट्या" / "3 पेटी".
 * An entry may be { one, other }; `n` picks the form and, when it is a number, is shown
 * with Indian grouping. Missing keys fall back to English, then to the key itself.
 */
function t(key, vars = {}) {
  let entry = has(current, key) ? STRINGS[current][key] : STRINGS.en[key];
  if (entry == null) return key;
  if (typeof entry === 'object') entry = vars.n === 1 ? entry.one : entry.other;
  return entry.replace(/\{(\w+)\}/g, (m, k) => {
    const v = vars[k];
    if (v == null) return '';
    return k === 'n' && typeof v === 'number' ? inr.format(v) : String(v);
  });
}

/** A data value in the current language when the dictionary knows it (e.g. label('tier', 'Gold')), else as written. */
function label(kind, value) {
  if (value == null || value === '') return '';
  const key = `${kind}.${value}`;
  return has(current, key) ? STRINGS[current][key] : String(value);
}

/** Keys that English has and a language lacks, for checking translations from the console. */
const missing = (code) => Object.keys(STRINGS.en).filter((k) => !has(code, k));

return { LANGS, lang, applyLang, setLang, t, label, missing };
})();

// Scheme rules, written once. The base uses them to price the cart; the feature reuses them.
//
// Rules (PROGRESS.md → build plan):
// - Free goods: 1 free per full `buyCases`. Pooled schemes count any mix of their SKUs and
//   deliver the free case(s) as the largest line. A "use" = one free case; the monthly cap
//   counts uses across all of the outlet's orders that month (past + demo).
// - Percent off: taken off the scheme's lines when they total `minCases` or more.
// - First order: % off the whole order (after other discounts), first order only, within
//   N days of registration.
// - Programs (e.g. cooler purity) are never applied at the cart.
// - Schemes stack. Money is rounded to whole rupees.

const data = modules['data'];
const { daysBetween, monthKey } = modules['format'];
const { t, label, lang } = modules['i18n'];

const isActive = (s, date) => (!s.validFrom || s.validFrom <= date) && (!s.validTo || date <= s.validTo);
const coversSku = (s, sku) => s.skus === 'all' || (Array.isArray(s.skus) && s.skus.includes(sku));

/** Schemes valid on a date (default: the demo date). */
const activeSchemes = (date = data.demoDate()) => data.schemes().filter((s) => isActive(s, date));

/** SKU-level schemes to show on a product row (not programs or whole-order offers). */
const schemesForSku = (sku, date = data.demoDate()) =>
  activeSchemes(date).filter((s) => Array.isArray(s.skus) && s.skus.includes(sku) && s.type !== 'program');

/** → { eligible, reason }. `orders` = the outlet's orders (past + demo). */
function eligibility(scheme, outlet, date, orders = []) {
  if (!isActive(scheme, date)) return { eligible: false, reason: t('sch.reason.dates') };
  const tiers = scheme.eligibleTiers;
  if (Array.isArray(tiers) && !tiers.includes(outlet.tier)) return { eligible: false, reason: t('sch.reason.tier', { tier: label('tier', outlet.tier) }) };
  if (scheme.requiresBottlerCooler && outlet.cooler?.type !== 'bottler') return { eligible: false, reason: t('sch.reason.cooler') };

    // Age first: an established outlet should read "first 90 days", not "first order only".
    const limit = scheme.rule?.withinDaysOfRegistration ?? 90;
    const age = outlet.registeredOn ? daysBetween(outlet.registeredOn, date) : Infinity;
    if (!(age >= 0 && age <= limit)) return { eligible: false, reason: t('sch.reason.age', { days: limit }) };
    if (orders.length > 0) return { eligible: false, reason: t('sch.reason.first') };
  }

function usesThisMonth(scheme, orders, date) {
  const month = monthKey(date);
  return orders
    .filter((o) => monthKey(o.date) === month && (!Array.isArray(o.schemeIds) || o.schemeIds.includes(scheme.id)))
    .reduce((n, o) => n + o.lines.filter((l) => coversSku(scheme, l.sku)).reduce((m, l) => m + (l.freeCases || 0), 0), 0);

/**
 * The scheme's state for one outlet today:
 *   'enrolled'   a program the outlet already receives (e.g. cooler purity)
 *   'applicable' can be used on an order ({ cap, used } when it has a monthly cap)
 *   'used'       eligible, but this month's cap is used up ({ cap, used })
 *   'not'        not for this outlet ({ reason })

  const el = eligibility(scheme, outlet, date, orders);
  if (!el.eligible) return { kind: 'not', reason: el.reason };
  if (scheme.type === 'program') return { kind: 'enrolled' };
  const cap = scheme.capUsesPerMonth || null;

const productName = (sku) => data.product(sku)?.name ?? sku;

/** "Cola 250 ml PET, Lemon-lime 250 ml PET and Cola 200 ml returnable glass" in the current language. */
function listNames(skus) {

const payoutAmount = (s) => (String(s.payout ?? '').match(/₹\s?[\d,]+/) ?? [''])[0].replace(/\s/, '');

function chipText(s) {

/**
 * Prices a cart for an outlet on a date.
 * cart: { SKU: cases } · orders: the outlet's orders so far (past + demo), for caps and first-order.
 * → { lines, gross, discount, net, paidCases, freeCases, totalCases, schemes, schemeIds }
 *   lines:   [{ sku, product, cases, freeCases, rate, gross }] in catalogue order
 *   schemes: one entry per active scheme that touches the cart:
 *            { scheme, kind: 'free'|'discount', eligible, reason, qualifyingCases,
 *              earned, granted, freeSku, cap, usedBefore, usedAfter, capHit, amount }
 */
function price(cart, outlet, date = data.demoDate(), orders = []) {
  const lines = data.products()
    .filter((p) => (cart[p.sku] ?? 0) > 0)
    .map((p) => ({ sku: p.sku, product: p, cases: cart[p.sku], freeCases: 0, rate: p.ptrPerCase, gross: cart[p.sku] * p.ptrPerCase }));
  Object.keys(cart).forEach((sku) => { if (!data.product(sku) && cart[sku] > 0) console.warn(`[schemes] unknown SKU in cart: ${sku}`); });

  const gross = lines.reduce((n, l) => n + l.gross, 0);
  const result = [];
  let discount = 0;
  const active = activeSchemes(date).filter((s) => s.type !== 'program');

  for (const s of active.filter((x) => x.type === 'free-goods')) {
    const scoped = lines.filter((l) => coversSku(s, l.sku));
    if (!scoped.length) continue;
    const { eligible, reason } = eligibility(s, outlet, date, orders);
    const r = s.rule;
    const qualifyingCases = scoped.reduce((n, l) => n + l.cases, 0);
    const earned = r.pooled
      ? Math.floor(qualifyingCases / r.buyCases) * r.freeCases
      : scoped.reduce((n, l) => n + Math.floor(l.cases / r.buyCases) * r.freeCases, 0);
    const cap = s.capUsesPerMonth || null;
    const usedBefore = cap ? usesThisMonth(s, orders, date) : 0;
    const granted = eligible ? Math.min(earned, cap ? Math.max(0, cap - usedBefore) : earned) : 0;
    let freeSku = null;
    if (granted > 0) {
      if (r.pooled) {
        const order = Array.isArray(s.skus) ? s.skus : [];
        const pick = data.product(r.freeSku) && r.freeSku !== 'largest-line'
          ? (lines.find((l) => l.sku === r.freeSku) ?? addZeroLine(lines, r.freeSku))
          : [...scoped].sort((a, b) => b.cases - a.cases || order.indexOf(a.sku) - order.indexOf(b.sku))[0];
        pick.freeCases += granted;
        freeSku = pick.sku;
      } else {
        let left = granted;
        for (const l of scoped) {
          const give = Math.min(left, Math.floor(l.cases / r.buyCases) * r.freeCases);
          l.freeCases += give;
          left -= give;
          if (give && !freeSku) freeSku = l.sku;
        }
      }
    }
    result.push({
      scheme: s, kind: 'free', eligible, reason, qualifyingCases, earned, granted, freeSku,
      cap, usedBefore, usedAfter: usedBefore + granted, capHit: Boolean(cap && eligible && earned > granted), amount: 0,
    });
  }

  for (const s of active.filter((x) => x.type === 'percent-off')) {
    const scoped = lines.filter((l) => coversSku(s, l.sku));
    if (!scoped.length) continue;
    const { eligible, reason } = eligibility(s, outlet, date, orders);
    const qualifyingCases = scoped.reduce((n, l) => n + l.cases, 0);
    const meets = qualifyingCases >= (s.rule.minCases ?? 0);
    const amount = eligible && meets ? Math.round(scoped.reduce((n, l) => n + l.gross, 0) * s.rule.percent / 100) : 0;
    discount += amount;
    result.push({ scheme: s, kind: 'discount', eligible, reason, qualifyingCases, amount });
  }

  for (const s of active.filter((x) => x.type === 'first-order')) {
    if (!lines.length) continue;
    const { eligible, reason } = eligibility(s, outlet, date, orders);
    const amount = eligible ? Math.round((gross - discount) * s.rule.percent / 100) : 0;
    discount += amount;
    result.push({ scheme: s, kind: 'discount', eligible, reason, qualifyingCases: null, amount });
  }

  const paidCases = lines.reduce((n, l) => n + l.cases, 0);
  const freeCases = lines.reduce((n, l) => n + l.freeCases, 0);
  return {
    lines,
    gross,
    discount,
    net: gross - discount,
    paidCases,
    freeCases,
    totalCases: paidCases + freeCases,
    schemes: result,
    schemeIds: result.filter((x) => x.granted > 0 || x.amount > 0).map((x) => x.scheme.id),
  };
}

  html`<span class="pill pill-tier" data-tier="${outlet.tier}">${raw(TIER_ICON[outlet.tier] ?? '')}<span>${label('tier', outlet.tier)}${visits && outlet.visitsPerMonth ? ` · ${t(visits === 'short' ? 'n.visitsShort' : 'n.visitsMonth', { n: outlet.visitsPerMonth })}` : ''}</span></span>`;

/** The kind of shop, e.g. "Cautious Kirana". */
function personaTag(outlet) {
  const kind = outlet.segment?.label ?? outlet.persona?.label;
  return kind ? html`<span class="persona-tag">${String(kind).replace(/^The /, '')}</span>` : '';
}

/**
 * A scheme's status for an outlet, from schemes.statusFor(). Each state looks different:
 * Enrolled = solid green (already receiving it) · Applicable = blue tag (can be used) ·
 * used up this month = grey · not applicable = dashed, with the reason.
 */
function schemePill(st) {
  switch (st.kind) {
    case 'enrolled': return html`<span class="pill pill-enrolled">${icon('check')}<span>${t('scheme.enrolled')}</span></span>`;
    case 'applicable': return html`<span class="pill pill-applicable">${icon('tag')}<span>${t('scheme.applicable')}</span></span>`;
    case 'used': return html`<span class="pill pill-used"><span>${t('scheme.usedUp', { used: st.used, cap: st.cap })}</span></span>`;
    default: return html`<span class="pill pill-off"><span>${st.reason}</span></span>`;
  }
}

const emptyState = ({ icon: name = 'box', title, body = '', action = null, compact = false }) =>
  html`<div class="empty ${compact ? 'is-compact' : ''}">
    <span class="empty-icon">${icon(name)}</span>
    <p class="empty-title">${title}</p>
    ${body ? html`<p class="empty-body">${body}</p>` : ''}
    ${action ?? ''}
  </div>`;

/**
 * A place for the feature. Empty and hidden until feature code fills it on 'screen:rendered'.
 * Names: landing-top, route-badge, outlet-brief, booking-live, sku-hint, review-check.
 */
function slot(name, { tag = 'section', attrs = {} } = {}) {
  const extra = Object.entries(attrs).map(([k, v]) => ` ${esc(k)}="${esc(v)}"`).join('');
  return raw(`<!-- FEATURE SLOT: ${esc(name)} --><${tag} class="slot" data-slot="${esc(name)}"${extra} hidden></${tag}>`);
}

// ---- bottom sheet (in-app confirmations, never browser pop-ups) -------------
let closeActive = null;

/**
 * openSheet({ title, body, actions: [{ key, label, tone }], dismissKey, onOpen(sheetEl) }) → Promise<key>
 * onOpen runs once the sheet is in the page (e.g. to focus a text box or wire a voice button).
 * Backdrop tap and Escape resolve with `dismissKey`. A route change resolves with 'route-change'.
 */
function openSheet({ title, body, actions, dismissKey = null, onOpen = null }) {
  closeSheets();
  return new Promise((resolve) => {
    const prevFocus = document.activeElement;
    const wrap = document.createElement('div');
    wrap.className = 'sheet-wrap';
    wrap.innerHTML = String(html`<div class="sheet-backdrop" data-dismiss></div>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
        <span class="sheet-handle" aria-hidden="true"></span>
        <h2 class="sheet-title" id="sheet-title">${title}</h2>
        <div class="sheet-body">${body}</div>
        <div class="sheet-actions">${actions.map((a) => html`<button type="button" class="btn btn-block btn-${a.tone ?? 'secondary'}" data-key="${a.key}">${a.label}</button>`)}</div>
      </div>`);

    const buttons = () => [...wrap.querySelectorAll('button')];
    const onKey = (e) => {
      if (e.key === 'Escape') close(dismissKey);
      if (e.key === 'Tab') {
        const list = buttons();
        const i = list.indexOf(document.activeElement);
        const next = e.shiftKey ? (i <= 0 ? list.length - 1 : i - 1) : (i + 1) % list.length;
        list[next]?.focus();
        e.preventDefault();
      }
    };
    function close(key) {
      if (closeActive !== close) return;
      closeActive = null;
      document.removeEventListener('keydown', onKey);
      document.body.classList.remove('has-sheet');
      wrap.classList.add('is-leaving');
      setTimeout(() => wrap.remove(), 160);
      if (key !== 'route-change') prevFocus?.focus?.({ preventScroll: true });
      resolve(key);
    }
    wrap.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-key]');
      if (btn) close(btn.dataset.key);
      else if (e.target.closest('[data-dismiss]')) close(dismissKey);
    });

    closeActive = close;
    document.addEventListener('keydown', onKey);
    document.body.append(wrap);
    document.body.classList.add('has-sheet');
    if (onOpen) onOpen(wrap.querySelector('.sheet'));
    else requestAnimationFrame(() => buttons()[0]?.focus());
  });
}

function closeSheets() {
  closeActive?.('route-change');
}

// ---- toast ----------------------------------------------------------------
let toastTimer = null;

function toast(message, iconName = 'check') {
  const el = document.getElementById('toast');
  if (!el) return;
  el.innerHTML = String(html`${icon(iconName)}<span>${message}</span>`);
  el.hidden = false;
  requestAnimationFrame(() => el.classList.add('is-in'));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    el.classList.remove('is-in');
    toastTimer = setTimeout(() => { el.hidden = true; }, 220);
  }, 3200);
}

/** Compact fact tiles: a small label with an icon, then the value with its note on the same line.
 *  A tile with `toggle` is a button (with a chevron) that opens the element [data-toggled=toggle]. */
const tiles = (items) => html`<div class="tiles">${items.filter(Boolean).map((i) => {
  const inner = html`<span class="tile-l">${icon(i.icon)}${i.label}</span><span class="tile-row"><b class="tile-v">${i.value}</b>${i.sub ? html`<span class="tile-s">${i.sub}</span>` : ''}</span>`;
  return i.toggle
    ? html`<button type="button" class="tile is-toggle ${i.tone ? `is-${i.tone}` : ''}" data-toggle="${i.toggle}" aria-expanded="false">${inner}<span class="tile-chev">${icon('chevron')}</span></button>`
    : html`<div class="tile ${i.tone ? `is-${i.tone}` : ''}">${inner}</div>`;
})}</div>`;

return { esc, raw, html, mount, fresh, icon, appBar, langButton, langSwitch, pill, tierBadge, personaTag, schemePill, emptyState, slot, openSheet, closeSheets, toast, tiles };
})();

          <span class="field-label">${t('login.password')}</span>

          <span class="field-error" id="err-password" hidden>${icon('alert')}<span>${t('login.errPass')}</span></span>
        </label>

}

modules['feature/store'] = (() => {
// What the rep records during the demo, kept in this browser only: clock-in sessions,
// outlet notes, retailer issues and which Landing alerts were already opened.
// One localStorage key; "Reset demo" clears it (with the demo orders).
//
// Times of day (clock in/out, when a note was written) use the device clock. The date
// always comes from config.demoDate, so the demo stays on Tue 28 Apr 2026.

const data = modules['data'];

const KEY = 'gtapp.field.v1';
const EMPTY = () => ({ clock: { sessions: [] }, notes: {}, issues: {}, seenAlerts: [] });
let memory = EMPTY();
let useMemory = false;

function read() {
  if (useMemory) return memory;
  try {
    const parsed = JSON.parse(localStorage.getItem(KEY) ?? 'null');
    return parsed ? { ...EMPTY(), ...parsed } : EMPTY();
  } catch {
    return memory;
  }
}

/** update((state) => { …mutate… }) → the saved state. */
function update(fn) {
  const state = read();
  fn(state);
  memory = state;
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch { useMemory = true; }
  return state;
}

function reset() {
  memory = EMPTY();
  useMemory = false;
  try { localStorage.removeItem(KEY); } catch { /* nothing stored */ }
}

/** "09:12" from the device clock. */
const timeNow = () => new Date().toTimeString().slice(0, 5);
const nowMs = () => Date.now();

// ---- clock in / out ----------------------------------------------------------

/** → { state: 'out'|'in'|'closed', since, sessions } for today. */
function clockState() {
  const { clock } = read();
  const open = clock.sessions.find((s) => !s.outAt);
  if (open) return { state: 'in', open, sessions: clock.sessions };
  return { state: clock.sessions.length ? 'closed' : 'out', sessions: clock.sessions };
}

const clockIn = () => update((s) => { s.clock.sessions.push({ inAt: nowMs(), inTime: timeNow(), outAt: null, outTime: null }); });
const clockOut = () => update((s) => {
  const open = s.clock.sessions.find((x) => !x.outAt);
  if (open) { open.outAt = nowMs(); open.outTime = timeNow(); }
});

/** Minutes on duty today, counting an open session up to now. */
const dutyMinutes = () => clockState().sessions
  .reduce((n, x) => n + Math.max(0, Math.round(((x.outAt ?? nowMs()) - x.inAt) / 60000)), 0);

// ---- notes and issues ------------------------------------------------------------

const notesFor = (outletId) => read().notes[outletId] ?? [];
const addNote = (outletId, text, via) => update((s) => {
  (s.notes[outletId] ??= []).unshift({ at: nowMs(), time: timeNow(), text, via });
});

/** Issues for an outlet, newest first: the ones raised today in this browser, then the ones
 *  already on record (data/field.json → issues). Resolving a recorded one is remembered here. */
function issuesFor(outletId) {
  const state = read();
  const local = state.issues[outletId] ?? [];
  const seeded = (data.field()?.issues?.[outletId] ?? []).map((x) => ({ ...x, seeded: true,
    status: state.resolvedSeeds?.includes(x.id) ? 'resolved' : x.status }));
  return [...local, ...seeded];
}
const openIssues = (outletId) => issuesFor(outletId).filter((i) => i.status === 'open');
const addIssue = (outletId, issue) => update((s) => {
  (s.issues[outletId] ??= []).unshift({ id: `ISS-${nowMs().toString(36)}`, at: nowMs(), time: timeNow(), status: 'open', ...issue });
});
const resolveIssue = (outletId, id) => update((s) => {
  const it = (s.issues[outletId] ?? []).find((x) => x.id === id);
  if (it) { it.status = 'resolved'; it.resolvedTime = timeNow(); return; }
  (s.resolvedSeeds ??= []).push(id);
});

// ---- alerts ----------------------------------------------------------------------

const seen = (id) => read().seenAlerts.includes(id);
const markSeen = (id) => update((s) => { if (!s.seenAlerts.includes(id)) s.seenAlerts.push(id); });

return { read, update, reset, timeNow, nowMs, clockState, clockIn, clockOut, dutyMinutes, notesFor, addNote, issuesFor, openIssues, addIssue, resolveIssue, seen, markSeen };
})();

modules['feature/outlet-tools'] = (() => {
// Outlet details tools: call before the visit, add a note (typed or spoken), report a
// retailer issue, see open issues, the other rep's territory and the last order's SKUs.
// Notes and issues are saved in this browser (feature/store.js).

const data = modules['data'];
const fmt = modules['format'];
const { t, lang } = modules['i18n'];
const { html, icon, pill, openSheet, toast } = modules['ui'];
const store = modules['feature/store'];

// The dataset has no phone numbers. Until outlets[].phone is filled, the dialer opens with a
// placeholder that can't ring anyone (Indian mobiles start with 6–9, never 0).
const phoneOf = (o) => o.phone ?? `+91 00000 ${String(o.id).replace(/\D/g, '').padStart(5, '0')}`;

// ---- territory ------------------------------------------------------------------

/** The other rep when this outlet isn't in the signed-in rep's territory, else null. */
function otherRep(o) {
  const rep = data.repFor(o.id);
  return rep && rep.id !== data.myRepId() ? rep : null;
}

const territoryPill = (o) => {
  const rep = otherRep(o);
  return rep ? pill(t('f.terr.pill', { name: rep.name }), 'caution', 'flag') : '';
};

/** Asks before booking at another rep's outlet → true to go ahead. */
async function confirmCrossTerritory(o) {
  const rep = otherRep(o);
  if (!rep) return true;
  const pct = data.field().crossTerritory?.incentiveCreditPct ?? 50;
  const key = await openSheet({
    title: t('f.terr.title'),
    body: html`<p class="sheet-lede">${t('f.terr.body', { name: o.name, rep: rep.name, territory: rep.territory })}</p>
      <div class="warn-box">${icon('alert')}<p>${t('f.terr.incentive', { pct })}</p></div>`,
    actions: [
      { key: 'go', label: t('f.terr.go', { pct }), tone: 'primary' },
      { key: 'back', label: t('f.terr.back'), tone: 'secondary' },
    ],
    dismissKey: 'back',
  });
  return key === 'go';
}

// ---- quick actions (lists and the outlet profile) ---------------------------------------

/**
 * Google Maps directions to the outlet (two-wheeler, as reps ride motorbikes). Uses exact
 * coordinates when the data has outlets[].geo { lat, lng }; otherwise the address.
 */
function directionsUrl(o) {
  const region = data.config().region ?? {};
  const address = o.area && !String(o.address ?? '').includes(o.area) ? `${o.address}, ${o.area}` : o.address;
  const destination = o.geo?.lat != null && o.geo?.lng != null
    ? `${o.geo.lat},${o.geo.lng}`
    : [address, region.city, region.state].filter(Boolean).join(', ');
  return `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(destination)}&travelmode=two-wheeler`;
}

/** Round Call and Directions buttons for an outlet card. */
const quickActions = (o) => html`<div class="row-acts">
  <button type="button" class="icon-btn is-call" data-call="${o.id}" aria-label="${t('f.tools.callName', { name: o.name })}">${icon('phone')}</button>
  <a class="icon-btn is-map" href="${directionsUrl(o)}" target="_blank" rel="noopener noreferrer" aria-label="${t('outlet.directionsLabel', { name: o.name })}">${icon('map')}</a>
</div>`;

/** One listener for every [data-call] button in the app. */
function install() {
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-call]');
    if (!btn) return;
    e.preventDefault();
    const o = data.outlet(btn.dataset.call);
    if (o) dial(o);
  });
}

// ---- header actions ----------------------------------------------------------------

const catsOf = (i) => i.categories ?? (i.category ? [i.category] : ['other']);

/** Open-problems capsule for the profile strip: how many are open and what they are about
 *  (every category across them, the first two named). Tap to see the list. */
function issuesBadge(o) {
  const open = store.openIssues(o.id);
  if (!open.length) return '';
  const cats = [...new Set(open.flatMap(catsOf))];
  const names = cats.slice(0, 2).map((c) => t(`f.issue.cat.${c}`)).join(', ');
  return html`<button type="button" class="issue-cap" data-tool="issues" aria-label="${t('f.issue.capLabel', { n: open.length })}">
    <span class="issue-cap-n">${open.length}</span>
    <span class="issue-cap-t">${names}${cats.length > 2 ? ` +${cats.length - 2}` : ''}</span>${icon('chevron')}
  </button>`;
}

/** Wires the tool buttons inside `root`. `refresh(part)` redraws 'notes' or 'issues'. */
function wire(root, o, refresh) {
  root.addEventListener('click', async (e) => {
    const btn = e.target.closest('[data-tool]');
    if (!btn) return;
    const tool = btn.dataset.tool;
    if (tool === 'call') dial(o);
    if (tool === 'note' && await noteSheet(o)) refresh('notes');
    if (tool === 'mic' && await noteSheet(o, { listen: true })) refresh('notes');
    if (tool === 'issue' && await issueSheet(o)) refresh('issues');
    if (tool === 'issues') { await issuesList(o); refresh('issues'); }
  });
  // A call logged from a list card elsewhere refreshes the notes if this outlet is open.
  document.addEventListener('gt:notes', (e) => { if (e.detail === o.id) refresh('notes'); });
}

// ---- call ------------------------------------------------------------------------

/** Straight to the phone's dialer with the shop's number filled in. */
function dial(o) {
  location.href = `tel:${phoneOf(o).replace(/\s/g, '')}`;
}

// ---- notes (typed or spoken) ----------------------------------------------------------

const Speech = typeof window !== 'undefined' ? (window.SpeechRecognition || window.webkitSpeechRecognition) : null;
const SPEECH_LANG = { en: 'en-IN', mr: 'mr-IN', hi: 'hi-IN' };

async function noteSheet(o, { listen = false } = {}) {
  let via = listen ? 'voice' : 'typed';
  let rec = null;
  let box = null;
  const key = await openSheet({
    title: listen ? t('f.note.titleVoice') : t('f.note.title'),
    body: html`<textarea class="input textarea" rows="3" data-text aria-label="${t('f.note.title')}" placeholder="${t('f.note.ph')}"></textarea>
      ${Speech
        ? html`<button type="button" class="mic-btn" data-mic aria-pressed="false">${icon('mic')}<span data-mic-label>${t('f.note.speak')}</span></button>`
        : html`<p class="fine">${t('f.note.noVoice')}</p>`}`,
    actions: [
      { key: 'save', label: t('f.note.save'), tone: 'primary' },
      { key: 'cancel', label: t('common.cancel'), tone: 'secondary' },
    ],
    dismissKey: 'cancel',
    onOpen(sheet) {
      box = sheet.querySelector('[data-text]');
      const mic = sheet.querySelector('[data-mic]');
      const label = () => mic.querySelector('[data-mic-label]');
      const stop = () => { rec = null; mic.setAttribute('aria-pressed', 'false'); mic.classList.remove('is-on'); label().textContent = t('f.note.speak'); };
      const start = () => {
        rec = new Speech();
        rec.lang = SPEECH_LANG[lang()] ?? 'en-IN';
        rec.interimResults = true;
        const before = box.value ? `${box.value.trim()} ` : '';
        rec.onresult = (ev) => { box.value = before + [...ev.results].map((r) => r[0].transcript).join(' '); via = 'voice'; };
        rec.onend = stop;
        rec.onerror = (ev) => { stop(); toast(ev.error === 'not-allowed' ? t('f.note.micBlocked') : t('f.note.micFail'), 'info'); };
        try { rec.start(); } catch { stop(); return; }
        mic.setAttribute('aria-pressed', 'true'); mic.classList.add('is-on');
        label().textContent = t('f.note.listening');
      };
      if (mic) mic.addEventListener('click', () => (rec ? rec.stop() : start()));
      // The Mic button in the header starts listening straight away; Note opens the keyboard.
      if (listen && mic) start();
      else box.focus();
    },
  });
  rec?.stop();
  const text = box?.value.trim();
  if (key !== 'save' || !text) return false;
  store.addNote(o.id, text, via);
  toast(t('f.note.saved'));
  return true;
}

/** Notes recorded today (this browser) first, then the rep's notes from past visits. */
function notesList(o, v, today) {
  const mine = store.notesFor(o.id).map((n) => ({ date: today, time: n.time, text: n.text, via: n.via, fresh: true }));
  const past = (v?.visits ?? []).filter((x) => x.note && x.date <= today).sort((a, b) => (a.date < b.date ? 1 : -1)).slice(0, 3)
    .map((x) => ({ date: x.date, text: x.note }));
  return [...mine, ...past];
}

const notesHtml = (list) => html`<ul class="notes">${list.map((n) => html`<li class="${n.fresh ? 'is-fresh' : ''}">
  <p class="note-date">${fmt.shortDate(n.date)}${n.time ? ` · ${n.time}` : ''}${n.via === 'voice' ? html` · ${icon('mic')} ${t('f.note.voice')}` : ''}${n.via === 'call' ? html` · ${icon('phone')} ${t('f.note.call')}` : ''}</p>
  <p>${n.text}</p></li>`)}</ul>`;

// ---- issues ------------------------------------------------------------------------

/** Deterministic keyword classifier: the category with the most keyword hits, else "other".
 *  Keywords include common Hinglish / Marathi spellings reps type. */
const ISSUE_CATEGORIES = {
  scheme: ['scheme', 'claim', 'free case', 'free cases', 'settle', 'settlement', 'credit note', 'offer', 'not received', 'incentive', 'shelf strip', 'purity', 'payout', 'scheme ka'],
  quality: ['quality', 'taste', 'flat', 'no gas', 'gas', 'fizz', 'expired', 'expiry', 'expire', 'smell', 'fungus', 'dirty', 'cloudy', 'bad', 'kharab', 'kharaab', 'kharab maal', 'kachra'],
  delay: ['late', 'delay', 'delayed', 'not delivered', 'no delivery', 'pending', 'did not come', "didn't come", 'not come', 'next day', 'waiting', 'nahi aaya', 'nahi aya', 'aala nahi', 'ushir', 'der'],
  missing: ['missing', 'short', 'less', 'damaged', 'damage', 'broken', 'crushed', 'leak', 'leaking', 'torn', 'dent', 'kam', 'toota', 'phuta', 'futla'],
  billing: ['bill', 'billing', 'invoice', 'price', 'rate', 'overcharged', 'charged', 'mrp', 'gst', 'amount', 'extra money', 'margin', 'paisa', 'paise', 'jyada', 'jast'],
};

/** Every category whose words appear in the text (at least "other"). */
function classifyAll(text) {
  const s = ` ${String(text).toLowerCase().replace(/[^a-z0-9\u0900-\u097f' ]+/g, ' ')} `;
  const hits = Object.entries(ISSUE_CATEGORIES).filter(([, words]) => words.some((w) => s.includes(` ${w} `) || (w.includes(' ') && s.includes(w)))).map(([c]) => c);
  return hits.length ? hits : ['other'];
}

function classifyIssue(text) {
  const s = ` ${String(text).toLowerCase().replace(/[^a-z0-9ऀ-ॿ' ]+/g, ' ')} `;
  let best = 'other'; let top = 0;
  for (const [cat, words] of Object.entries(ISSUE_CATEGORIES)) {
    const hits = words.reduce((n, w) => n + (s.includes(` ${w} `) || (w.includes(' ') && s.includes(w)) ? 1 : 0), 0);
    if (hits > top) { best = cat; top = hits; }
  }
  return best;
}

const CATS = [...Object.keys(ISSUE_CATEGORIES), 'other'];

const CAT_ICON = { scheme: 'tag', quality: 'alert', delay: 'truck', missing: 'box', billing: 'wallet', other: 'info' };

async function issueSheet(o) {
  let box = null;
  let picked = new Set();        // categories the rep tapped (several allowed)
  let touched = false;           // once the rep taps, the auto-guess stops changing the choice
  const key = await openSheet({
    title: t('f.issue.title'),
    body: html`<textarea class="input textarea" rows="3" data-text aria-label="${t('f.issue.title')}" placeholder="${t('f.issue.ph')}"></textarea>
      <p class="field-label">${t('f.issue.category')}</p>
      <div class="cat-chips" role="group">${CATS.map((c) => html`<button type="button" class="chip cat-chip" data-cat-pick="${c}" aria-pressed="false">${icon(CAT_ICON[c])}<span>${t(`f.issue.cat.${c}`)}</span></button>`)}</div>`,
    actions: [
      { key: 'save', label: t('f.issue.save'), tone: 'primary' },
      { key: 'cancel', label: t('common.cancel'), tone: 'secondary' },
    ],
    dismissKey: 'cancel',
    onOpen(sheet) {
      box = sheet.querySelector('[data-text]');
      const chips = [...sheet.querySelectorAll('[data-cat-pick]')];
      const show = () => chips.forEach((b) => b.setAttribute('aria-pressed', String(picked.has(b.dataset.catPick))));
      box.addEventListener('input', () => { if (!touched) { picked = new Set(classifyAll(box.value)); show(); } });
      chips.forEach((b) => b.addEventListener('click', () => {
        touched = true;
        const c = b.dataset.catPick;
        if (picked.has(c)) picked.delete(c); else picked.add(c);
        show();
      }));
      box.focus();
    },
  });
  const text = box?.value.trim() ?? '';
  if (key !== 'save' || (!text && !picked.size)) return false;
  const categories = picked.size ? [...picked] : classifyAll(text);
  store.addIssue(o.id, { text, categories, auto: !touched });
  toast(t('f.issue.saved', { cat: categories.map((c) => t(`f.issue.cat.${c}`)).join(', ') }));
  return true;
}

async function issuesList(o) {
  const list = store.issuesFor(o.id);
  await openSheet({
    title: t('f.issue.listTitle'),
    body: html`<ul class="issue-list">${list.map((i) => html`<li class="${i.status === 'open' ? 'is-open' : ''}">
      <div class="issue-cats">${catsOf(i).map((c) => html`<span class="issue-cat">${icon(CAT_ICON[c])}${t(`f.issue.cat.${c}`)}</span>`)}</div>
      ${i.text ? html`<p class="issue-text">${i.text}</p>` : ''}
      <p class="issue-meta">${i.seeded ? t('f.issue.earlier', { date: fmt.shortDate(i.date) }) : t('f.issue.today', { time: i.time })}${i.status === 'resolved' ? html` · <span class="ok-text">${icon('check')}${t('f.issue.resolved')}</span>` : ''}
        ${i.status === 'open' ? html`<button type="button" class="link-btn" data-resolve="${i.id}">${t('f.issue.resolve')}</button>` : ''}</p>
    </li>`)}</ul>`,
    actions: [{ key: 'add', label: t('f.issue.add'), tone: 'secondary' }, { key: 'close', label: t('common.close'), tone: 'primary' }],
    dismissKey: 'close',
    onOpen(sheet) {
      sheet.addEventListener('click', (e) => {
        const b = e.target.closest('[data-resolve]');
        if (!b) return;
        store.resolveIssue(o.id, b.dataset.resolve);
        b.closest('li').classList.remove('is-open');
        b.replaceWith(document.createTextNode(`· ${t('f.issue.resolved')}`));
      });
    },
  }).then((k) => (k === 'add' ? issueSheet(o) : null));
}

// ---- last order SKUs and stock on hand ---------------------------------------------------

/** The last order's lines: SKU, quantity, pack and value at today's rate. */
function orderLinesHtml(order) {
  const rows = order.lines.filter((l) => l.cases || l.freeCases).map((l) => {
    const p = data.product(l.sku);
    return { name: p?.name ?? l.sku, pack: p ? `${p.unitsPerCase} × ${p.pack.ml >= 1000 ? `${p.pack.ml / 1000} L` : `${p.pack.ml} ml`}` : '', cases: l.cases, free: l.freeCases, value: p ? l.cases * p.ptrPerCase : null, label: p?.caseLabel };
  });
  return html`<ul class="order-lines">${rows.map((r) => html`<li>
    <span class="ol-name">${r.name}<span class="ol-pack">${r.pack}</span></span>
    <span class="ol-qty num">${fmt.unitsText(r.cases, r.label)}${r.free ? html` <span class="muted">+${r.free}</span>` : ''}</span>
    <span class="ol-val num">${r.value != null ? fmt.rupees(r.value) : ''}</span>
  </li>`)}</ul>`;
}

return { otherRep, territoryPill, confirmCrossTerritory, directionsUrl, quickActions, install, issuesBadge, wire, dial, notesList, notesHtml, ISSUE_CATEGORIES, classifyAll, classifyIssue, orderLinesHtml };
})();

modules['feature/route-map'] = (() => {
// Today's route on an illustrated map of Pune West. Static and offline: no map API, no tiles.
// The four areas sit where they are in real life (Pashan north, Bavdhan west, Kothrud east,
// Warje south); the stops follow the beat's loop in route order, drawn like a navigation
// app's highlighted route.
// The map is bigger than its window: drag it in any direction.

const data = modules['data'];
const { html, raw } = modules['ui'];

const W = 720; const H = 460;               // map canvas (drawing units)
const SCALE = 0.7;                          // shown at 70%, so more of the beat fits the window
const AREAS = {                             // centre and spread of each area on the canvas
  Pashan: { x: 360, y: 90, rx: 150, ry: 55 },
  Bavdhan: { x: 150, y: 250, rx: 95, ry: 110 },
  Kothrud: { x: 450, y: 250, rx: 150, ry: 70 },
  Warje: { x: 380, y: 390, rx: 170, ry: 45 },
};
const DEPOT = { x: 560, y: 330 };           // the distributor's godown, where the day starts

/** Smooth path through points (Catmull-Rom → cubic Bézier). */
function smooth(pts) {
  if (pts.length < 2) return '';
  let d = `M${pts[0].x},${pts[0].y}`;
  for (let i = 0; i < pts.length - 1; i += 1) {
    const p0 = pts[i - 1] ?? pts[i]; const p1 = pts[i]; const p2 = pts[i + 1]; const p3 = pts[i + 2] ?? p2;
    const c1 = { x: p1.x + (p2.x - p0.x) / 6, y: p1.y + (p2.y - p0.y) / 6 };
    const c2 = { x: p2.x - (p3.x - p1.x) / 6, y: p2.y - (p3.y - p1.y) / 6 };
    d += ` C${c1.x.toFixed(1)},${c1.y.toFixed(1)} ${c2.x.toFixed(1)},${c2.y.toFixed(1)} ${p2.x},${p2.y}`;
  }
  return d;
}

// The beat as one clean loop from the godown through Kothrud, Pashan, Bavdhan and Warje and back.
// The map is illustrative (the data has no coordinates), so stops are spaced along this loop in
// route order, the way a planned beat reads on a navigation app.
const LOOP = [DEPOT, { x: 630, y: 240 }, { x: 540, y: 130 }, { x: 410, y: 70 }, { x: 270, y: 105 },
  { x: 150, y: 190 }, { x: 110, y: 310 }, { x: 210, y: 395 }, { x: 370, y: 420 }, { x: 490, y: 385 }];

function loopPoints(n) {
  // Sample the smooth loop densely, then place n stops at equal distances along it.
  const pts = [];
  const ring = [...LOOP, LOOP[0]];
  for (let i = 0; i < ring.length - 1; i += 1) {
    const p0 = ring[i - 1] ?? ring[ring.length - 2]; const p1 = ring[i]; const p2 = ring[i + 1]; const p3 = ring[i + 2] ?? ring[1];
    for (let k = 0; k < 24; k += 1) {
      const t = k / 24; const t2 = t * t; const t3 = t2 * t;
      const f = (a, b, c, d) => 0.5 * ((2 * b) + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t2 + (-a + 3 * b - 3 * c + d) * t3);
      pts.push({ x: f(p0.x, p1.x, p2.x, p3.x), y: f(p0.y, p1.y, p2.y, p3.y) });
    }
  }
  const len = [0];
  for (let i = 1; i < pts.length; i += 1) len.push(len[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y));
  const total = len.at(-1);
  return Array.from({ length: n }, (_, i) => {
    const target = ((i + 1) / (n + 1)) * total;
    const j = Math.max(1, len.findIndex((l) => l >= target));
    const a = pts[j - 1]; const b = pts[j];
    const nx = -(b.y - a.y); const ny = b.x - a.x; const nl = Math.hypot(nx, ny) || 1;
    const wob = (i % 2 ? 1 : -1) * 9;       // a small side-to-side step, like shops on either side of a road
    return { x: Math.round(b.x + (nx / nl) * wob), y: Math.round(b.y + (ny / nl) * wob) };
  });
}

/** rows: [{ outlet, saved: [] }] in route order. */
function routeMap(rows) {
  const spots = loopPoints(rows.length);
  const stops = rows.map((r, i) => ({ ...spots[i], n: data.visits(r.outlet.id)?.routeOrder ?? i + 1, done: r.saved.length > 0 }));
  const nextIdx = stops.findIndex((s) => !s.done);
  const path = smooth([DEPOT, ...stops, DEPOT]);
  const doneUpTo = nextIdx === -1 ? stops.length : nextIdx;
  const donePath = doneUpTo ? smooth([DEPOT, ...stops.slice(0, doneUpTo)]) : '';
  const svg = `<svg class="rmap-svg" viewBox="0 0 ${W} ${H}" width="${Math.round(W * SCALE)}" height="${Math.round(H * SCALE)}" aria-hidden="true">
    <defs>
      <pattern id="rm-dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="0.9" fill="#d9dfe8"/></pattern>
      <filter id="rm-shadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#0f1c2e" flood-opacity=".25"/></filter>
    </defs>
    <rect width="${W}" height="${H}" fill="#f4f1ea"/>
    <rect width="${W}" height="${H}" fill="url(#rm-dots)"/>
    <path d="M0,40 C120,70 200,20 320,55 S560,40 720,80 L720,0 L0,0z" fill="#e6efdc"/>
    <ellipse cx="90" cy="120" rx="80" ry="55" fill="#dcead0"/>
    <ellipse cx="640" cy="170" rx="70" ry="40" fill="#dcead0"/>
    <ellipse cx="250" cy="430" rx="90" ry="30" fill="#dcead0"/>
    <path d="M-10,180 C80,160 150,200 230,180 S380,150 470,175 S640,210 730,190" fill="none" stroke="#b9d9f0" stroke-width="16" stroke-linecap="round"/>
    <path d="M-10,180 C80,160 150,200 230,180 S380,150 470,175 S640,210 730,190" fill="none" stroke="#cfe6f7" stroke-width="8" stroke-linecap="round"/>
    <g fill="none" stroke-linecap="round">
      <path d="M40,330 C200,300 330,330 470,300 S650,260 720,250" stroke="#e3dccd" stroke-width="14"/>
      <path d="M40,330 C200,300 330,330 470,300 S650,260 720,250" stroke="#fffdf8" stroke-width="10"/>
      <path d="M300,0 C320,120 280,240 330,460" stroke="#e3dccd" stroke-width="12"/>
      <path d="M300,0 C320,120 280,240 330,460" stroke="#fffdf8" stroke-width="8"/>
      <path d="M600,0 C570,140 610,300 560,460" stroke="#f3d9a4" stroke-width="12"/>
      <path d="M600,0 C570,140 610,300 560,460" stroke="#fff3d3" stroke-width="7"/>
      <path d="M0,250 C120,240 200,270 300,245" stroke="#e8e2d4" stroke-width="7"/>
      <path d="M430,120 C470,200 520,220 600,230" stroke="#e8e2d4" stroke-width="7"/>
      <path d="M120,400 C220,380 300,410 420,395" stroke="#e8e2d4" stroke-width="7"/>
    </g>
    <text x="598" y="20" class="rm-road" transform="rotate(84 598 20)">NH-48</text>
    ${Object.entries(AREAS).map(([name, a]) => `<text x="${a.x}" y="${a.y - a.ry - 8}" class="rm-area" text-anchor="middle">${name.toUpperCase()}</text>`).join('')}
    <path d="${path}" fill="none" stroke="#fff" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="${path}" fill="none" stroke="#1d5bd8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 0"/>
    ${donePath ? `<path d="${donePath}" fill="none" stroke="#9aa6b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>` : ''}
    <g filter="url(#rm-shadow)"><rect x="${DEPOT.x - 13}" y="${DEPOT.y - 13}" width="26" height="26" rx="7" fill="#0f2a5c"/>
      <path d="M${DEPOT.x - 6},${DEPOT.y + 5}v-7l6-4 6 4v7z" fill="#fff"/></g>
    ${stops.map((s, i) => `<g class="rm-stop${s.done ? ' is-done' : ''}${i === nextIdx ? ' is-next' : ''}" transform="translate(${s.x} ${s.y})">
      ${i === nextIdx ? '<circle r="15" class="rm-pulse"/>' : ''}
      <circle r="9.5" filter="url(#rm-shadow)"/>
      <text y="3.4" text-anchor="middle">${s.done ? '✓' : s.n}</text></g>`).join('')}
  </svg>`;
  return html`<div class="rmap" data-rmap>
    <div class="rmap-canvas" data-rmap-canvas>${raw(svg)}</div>
    <span class="rmap-hint">⤧</span>
  </div>`;
}

/** Drag the map inside its window; starts centred on the next stop. */
function wireMap(root) {
  const box = root.querySelector('[data-rmap]');
  const canvas = root.querySelector('[data-rmap-canvas]');
  if (!box || !canvas) return;
  const vw = () => box.clientWidth; const vh = () => box.clientHeight;
  const clampX = (x) => Math.min(0, Math.max(vw() - W * SCALE, x));
  const clampY = (y) => Math.min(0, Math.max(vh() - H * SCALE, y));
  const next = canvas.querySelector('.is-next') ?? canvas.querySelector('.rm-stop');
  let x = 0; let y = 0;
  if (next) {
    const m = /translate\(([\d.]+) ([\d.]+)\)/.exec(next.getAttribute('transform') ?? '');
    if (m) { x = clampX(vw() / 2 - Number(m[1]) * SCALE); y = clampY(vh() / 2 - Number(m[2]) * SCALE); }
  }
  const put = () => { canvas.style.transform = `translate(${x}px, ${y}px)`; };
  put();
  let start = null;
  box.addEventListener('pointerdown', (e) => { start = { px: e.clientX, py: e.clientY, x, y }; box.setPointerCapture(e.pointerId); box.classList.add('is-drag'); });
  box.addEventListener('pointermove', (e) => {
    if (!start) return;
    x = clampX(start.x + e.clientX - start.px); y = clampY(start.y + e.clientY - start.py); put();
  });
  const end = () => { start = null; box.classList.remove('is-drag'); };
  box.addEventListener('pointerup', end);
  box.addEventListener('pointercancel', end);
}

return { routeMap, wireMap };
})();

  wireMap(view);

function routeRow({ outlet, saved }) {

    let shown = 0;
    items.forEach((li) => {
      const o = data.outlet(li.dataset.outlet);
      const hit = test(o) && tokens.every((tk) => li.dataset.search.includes(tk));
      li.hidden = !hit;
      if (hit) shown += 1;
    });
    const total = t('n.outlet', { n: all.length });
    count.textContent = shown === all.length ? total : t('outlets.count', { shown, total });
    count.hidden = shown === 0;
    if (shown) {
      empty.replaceChildren();
    } else if (query.trim()) {
      mount(empty, emptyState({
        icon: 'search',
        title: t('outlets.noMatch', { q: query.trim() }),
        body: filter === 'all' ? t('outlets.noMatchAll') : t('outlets.noMatchFilter'),
        action: html`<button type="button" class="btn btn-secondary" data-clear>${t('outlets.clearSearch')}</button>`,
      }));
    } else {
      mount(empty, emptyState({
        icon: 'store',
        title: t('outlets.noneInFilter'),
        action: html`<button type="button" class="btn btn-secondary" data-filter="all">${t('outlets.showAll')}</button>`,
      }));
    }
  }

  input.addEventListener('input', apply);
  view.addEventListener('click', (e) => {
    const chip = e.target.closest('[data-filter]');
    if (chip) {
      filter = chip.dataset.filter;
      view.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed', String(c.dataset.filter === filter)));
      apply();
      return;
    }
    if (e.target.closest('[data-clear]')) {
      input.value = '';
      apply();
      input.focus();
    }
  });
  apply();
}

// A colour per channel for the shop's monogram tile, so the list scans by type at a glance.
const CHANNEL_TINT = {
  'Traditional Kirana': ['#fff1dc', '#a35a00'], Convenience: ['#e6f0ff', '#1d4fb0'], 'Eating & Drinking (seating)': ['#fde8ee', '#b0275a'],
  'Eating & Drinking (standing)': ['#fdeede', '#b4431a'], 'Paan/Cigarette shop': ['#e7f6ec', '#11663c'], Education: ['#efe9fd', '#5a2fbf'],
  'At-work': ['#e5f4f6', '#0a6d7a'], 'Entertainment & Leisure': ['#fff4cf', '#8a6500'], 'Modern Trade (small format)': ['#eceff4', '#3d4b60'], Wholesale: ['#f1e8e2', '#6b3d1f'],
};
const monogram = (o) => {
  const [bg, fg] = CHANNEL_TINT[o.channel] ?? ['#eef2f7', '#3d4b60'];
  const letters = o.name.replace(/[^A-Za-z ]/g, '').split(' ').filter(Boolean).slice(0, 2).map((w) => w[0]).join('');
  return html`<span class="mono-tile" style="background:${bg};color:${fg}" aria-hidden="true">${letters}</span>`;
};

function row(o, onRoute, today) {
  const saved = orders.demoOrdersOn(o.id, today);
  // Searchable in English and in the current language.
  const search = [o.name, o.area, label('area', o.area), o.address, o.channel, label('ch', o.channel), o.shopType,
    label('shop', o.shopType), o.tier, label('tier', o.tier), o.id, o.persona?.label].filter(Boolean).join(' ').toLowerCase();
  const type = o.shopType && o.shopType !== o.channel ? ` · ${label('shop', o.shopType)}` : '';
  return html`<li class="row-wrap" data-outlet="${o.id}" data-search="${search}">
    <a class="row outlet-row" href="#/outlet/${o.id}">
      ${monogram(o)}
      <span class="row-main">
        <span class="row-title">${o.name}</span>
        <span class="row-meta">${label('area', o.area)} · ${label('ch', o.channel)}${type}</span>
        <span class="row-tags">
          ${tierBadge(o, { visits: 'short' })}
          ${saved.length ? pill(saved.length > 1 ? t('status.savedShortN', { n: saved.length }) : t('status.savedShort'), 'ok', 'check') : ''}
          ${onRoute ? '' : pill(t('outlets.notOnRoute'), 'neutral')}
        </span>
        ${personaTag(o)}
      </span>
    </a>
    ${quickActions(o)}
  </li>`;
}

return { render };
})();

// Stock photos (Unsplash, free licence, no brand marks): bold, ad-style colour, loaded online. Each sits above its
// illustration, so the card still looks right if the photo can't load (e.g. offline).
const PHOTO_IDS = {
  cola: 'YavhkwhRBoU',      // fizz bubbles on a bold red background
  mango: '8Q93Tun7uhM',     // mango juice topped with flowers
  water: 'DGZC_fn0aJM',     // studio shot: blue bottle, red ring, blue backdrop
  cooler: 'ODjUXmZZFwk',    // soda bottles packed in a cooler
  shop: 'YPpFk6niPf4',      // shopfront glowing with neon at night
  festival: 'xisPXJqwQkA',  // glowing festival lamps
};
const photo = (theme) => (PHOTO_IDS[theme] ? `url("https://unsplash.com/photos/${PHOTO_IDS[theme]}/download?w=720"), ` : '');

/** Which picture fits the scheme: by its packs first, then by its type. */
function themeOf(s) {
  const skus = Array.isArray(s.skus) ? s.skus.join(' ') : '';
  if (s.type === 'program') return 'cooler';
  if (s.type === 'first-order') return 'shop';
  if (/^(MG|MF|GV|AP)|\b(MG|MF|GV|AP)/.test(skus)) return 'mango';
  if (/\bWT/.test(` ${skus}`)) return 'water';
  if (/diwali/i.test(s.name)) return 'festival';
  return 'cola';
}

function schemeArt(s) {
  const theme = themeOf(s);
  return `background-image: linear-gradient(90deg, rgba(8, 14, 30, 0.72) 0%, rgba(8, 14, 30, 0.32) 55%, rgba(8, 14, 30, 0) 100%), ${photo(theme)}${THEMES[theme]};`;
}

return { schemeArt };
})();

modules['screens/outlet'] = (() => {
// Outlet details: who the outlet is, what it ordered, what it owes, which schemes apply.

const { nav } = modules['app'];
const data = modules['data'];
const orders = modules['orders'];
const schemes = modules['schemes'];
const { cart } = modules['cart'];
const fmt = modules['format'];
const { t } = modules['i18n'];
const { html, mount, fresh, icon, appBar, tierBadge, personaTag, schemePill, slot, emptyState, tiles } = modules['ui'];
const tools = modules['feature/outlet-tools'];
const { directionsUrl } = modules['feature/outlet-tools'];
const { schemeArt } = modules['feature/scheme-art'];

function render(root, { id }) {

            <h1 class="profile-name">${o.name}</h1>
            <p class="profile-addr">${icon('map')}<span>${address}</span></p>
          </div>
          <div class="profile-acts">
            <button type="button" class="icon-btn is-call" data-tool="call" aria-label="${t('f.tools.call')}">${icon('phone')}</button>
            <button type="button" class="icon-btn is-issue" data-tool="issue" aria-label="${t('f.tools.issue')}">${icon('flag')}</button>
            <a class="icon-btn is-map" href="${directionsUrl(o)}" target="_blank" rel="noopener noreferrer" aria-label="${t('outlet.directionsLabel', { name: o.name })}">${icon('map')}</a>
          </div>
        </div>
        <div class="row-tags">
          ${tierBadge(o, { visits: true })}
          ${tools.territoryPill(o)}
        </div>
        <div class="profile-foot">
          ${o.owner?.name ? html`<p class="profile-owner">${icon('store')}<span>${o.owner.name}</span></p>` : html`<span></span>`}
          <span data-part="issues">${tools.issuesBadge(o)}</span>
        </div>
      </header>

      ${savedToday.length ? html`<p class="strip-ok">${icon('check')}<span>${t('f.outlet.orderedToday', { cases: fmt.casesText(savedToday.reduce((n, x) => n + orders.paidCases(x), 0)), value: fmt.rupees(savedToday.reduce((n, x) => n + x.netValue, 0)) })}</span></p>` : ''}
      ${closures.map((c) => html`<p class="strip-warn">${icon('calendarX')}<span><b>${t('outlet.closed', { range: fmt.dateRange(c.from, c.to, today) })}</b> · ${c.reason}</span></p>`)}

      ${slot('outlet-season')}
      ${slot('outlet-brief')}
      ${schemesCard(o, all, today)}
      ${lastOrderCard(all, v, today, savedToday.length > 0)}
      ${paymentCard(o, today)}
      ${historyCard(all, today)}

  // A tile with a chevron opens the list that belongs to it (e.g. Value → what they ordered).
  view.addEventListener('click', (e) => {

    const more = view.querySelector(`[data-toggled="${tile.dataset.toggle}"]`);
    if (!more) return;
    more.hidden = !more.hidden;
    tile.setAttribute('aria-expanded', String(!more.hidden));
  });

  // Notes and issues redraw in place, so the rep keeps their scroll position.
  tools.wire(view, o, (part) => {
    const el = view.querySelector(`[data-part="${part}"]`);

function notFound(view, id) {
  mount(view, html`
    ${appBar({ title: t('outlet.title'), back: nav.hub })}
    <div class="page">${emptyState({
      icon: 'store',
      title: t('outlet.notFound'),
      body: t('outlet.notFoundBody', { id: id ?? '' }),
      action: html`<a class="btn btn-primary" href="#/outlets">${t('outlet.openList')}</a>`,
    })}</div>`);
}

/** A card that opens on tap: icon, title and a one-line summary when closed. */
const fold = (iconName, tone, title, summary, body, { open = false, cls = '', warn = false } = {}) =>
  html`<details class="card collapse fold ${cls}" ${open ? 'open' : ''}>
    <summary class="collapse-head">
      <span class="card-title"><span class="fold-ico ic-${tone}">${icon(iconName)}</span><span>${title}</span></span>
      <span class="collapse-sum ${warn ? 'text-warn' : ''}">${warn ? icon('alert') : ''}<span>${summary}</span></span>
      ${icon('chevron', 'collapse-chev')}
    </summary>
    <div class="collapse-body">${body}</div>
  </details>`;


function lastOrderCard(all, v, today, visitedToday) {
  const last = all[0];
  // A demo order today counts as today's visit (visits.json only holds past visits).
  const lastVisit = visitedToday
    ? { date: today, minutes: null }
    : (v?.visits ?? []).filter((x) => x.done && x.date <= today).sort((a, b) => (a.date < b.date ? 1 : -1))[0];
  const summary = last ? `${fmt.relative(last.date, today)} · ${fmt.casesText(orders.paidCases(last))}` : t('kv.noOrders');
  return fold('calendar', 'blue', t('card.lastOrder'), summary, html`
    ${tiles([
      last && { icon: 'box', label: t('kv.lastOrder'), value: fmt.shortDate(last.date), sub: fmt.relative(last.date, today) },
      last && { icon: 'wallet', label: t('kv.value'), value: fmt.rupees(last.netValue), sub: fmt.casesText(orders.paidCases(last)), toggle: 'last-lines' },
      { icon: 'check', label: t('kv.lastVisit'), value: lastVisit ? fmt.shortDate(lastVisit.date) : '—', sub: lastVisit ? fmt.relative(lastVisit.date, today) : t('kv.noVisits') },
      v?.nextVisitAfterToday && { icon: 'calendar', label: t('kv.nextVisit'), value: fmt.shortDate(v.nextVisitAfterToday), sub: fmt.relative(v.nextVisitAfterToday, today), tone: 'blue' },
    ])}
    ${last ? html`<div class="tile-more" data-toggled="last-lines" hidden><p class="fold-sub">${t('f.fold.lastLines')}</p>${tools.orderLinesHtml(last)}</div>` : ''}`);
}

function paymentCard(o, today) {
  const c = o.credit ?? {};
  const overdue = c.overdue ?? 0;
  const limit = c.limit ?? 0;
  const used = c.outstanding ?? 0;
  const room = Math.max(0, limit - used);
  const pct = limit ? Math.min(100, Math.round((used / limit) * 100)) : 0;
  const summary = overdue > 0 ? t('f.pay.due', { amt: fmt.rupees(overdue) }) : t('f.pay.room', { amt: fmt.rupees(room) });
  return fold('wallet', 'green', t('card.payment'), summary, html`
    <div class="credit-bar"><div class="credit-top"><span>${t('f.fold.creditUsed', { used: fmt.rupees(used), limit: fmt.rupees(limit) })}</span><b>${t('f.pay.room', { amt: fmt.rupees(room) })}</b></div>
      <div class="credit-track"><span style="width:${pct}%" class="${overdue > 0 ? 'is-due' : ''}"></span></div></div>
    ${tiles([
      { icon: 'alert', label: t('kv.overdue'), value: fmt.rupees(overdue), tone: overdue > 0 ? 'warn' : '' },
      { icon: 'calendar', label: t('kv.lastPayment'), value: c.lastPaymentDate ? fmt.shortDate(c.lastPaymentDate) : '—', sub: c.lastPaymentDate ? fmt.relative(c.lastPaymentDate, today) : t('kv.noneYet') },
      c.paymentMode === 'cash-and-credit' && { icon: 'wallet', label: t('f.fold.pays'), value: t('f.fold.cashAbove'), sub: t('f.fold.cashAboveSub', { amt: fmt.rupees(limit) }) },
    ])}`, { warn: overdue > 0 });
}

const ORDER = { enrolled: 0, applicable: 1, used: 2, not: 3 };

/** Schemes as illustrated cards: the art says what the scheme is about before the words do. */
function schemesCard(o, all, today) {
  const hasCooler = o.cooler?.type === 'bottler';
  const list = schemes.activeSchemes(today)
    .filter((s) => s.type !== 'program' || hasCooler)
    .map((s) => ({ s, st: schemes.statusFor(s, o, today, all) }))
    .filter(({ st }) => st.kind !== 'not')          // schemes this shop can't get aren't shown at all
    .sort((a, b) => ORDER[a.st.kind] - ORDER[b.st.kind]);
  if (!list.length) return '';
  const month = fmt.monthName(today, true);
  const usable = list.filter((x) => x.st.kind === 'applicable' || x.st.kind === 'enrolled').length;
  return html`<section class="sch-block">
    <h2 class="section-title">${t('f.sch.head', { n: usable })}</h2>
    <div class="sch-scroll">${list.map(({ s, st }) => html`<a class="sch-card st-${st.kind}" href="#/scheme/${s.id}/${o.id}" style="${schemeArt(s)}">
      <span class="sch-top">${schemePill(st)}</span>
      <span class="sch-name">${s.name}</span>
      <span class="sch-offer">${s.type === 'program' ? t('f.sch.program', { amt: schemes.payoutAmount(s) }) : schemes.chipText(s)}</span>
      <span class="sch-meta">${st.cap && st.kind !== 'not' ? t('f.sch.left', { left: Math.max(0, st.cap - st.used), cap: st.cap, month }) : st.kind === 'not' ? st.reason : s.validTo ? t('common.till', { date: fmt.shortDate(s.validTo) }) : ''}</span>
    </a>`)}</div>
  </section>`;
}

function historyCard(all, today) {
  if (!all.length) return fold('history', 'purple', t('card.history'), t('history.empty'), html`<p class="muted">${t('history.emptyBody')}</p>`);
  return fold('history', 'purple', t('card.history'), t('f.hist.sum', { n: all.length }), html`
    ${monthStrip(all, today)}
    <p class="fold-sub">${t('f.fold.recent')}</p>
    <ul class="recent">${all.slice(0, 3).map((x) => html`<li>
      <span class="recent-d">${fmt.shortDate(x.date)}${x.source === 'demo' ? html` <em>${t('f.fold.today')}</em>` : ''}</span>
      <span>${fmt.casesText(orders.paidCases(x))}</span>
      <b class="num">${fmt.rupees(x.netValue)}</b>
    </li>`)}</ul>`);
}

function monthStrip(all, today) {
  const end = fmt.monthKey(today);
  const months = Array.from({ length: 13 }, (_, i) => fmt.addMonths(end, i - 12));
  const totals = new Map(months.map((m) => [m, 0]));
  all.forEach((x) => {
    const k = fmt.monthKey(x.date);
    if (totals.has(k)) totals.set(k, totals.get(k) + orders.paidCases(x));
  });
  const max = Math.max(1, ...totals.values());
  const aria = `${t('history.stripAria')} ${months.map((m) => `${fmt.monthName(m)} ${m.slice(0, 4)}: ${totals.get(m)}`).join('; ')}`;
  const first = months[0];
  return html`<figure class="strip" role="img" aria-label="${aria}">
    <div class="strip-bars">${months.map((m) => {
      const val = totals.get(m);
      return html`<span class="strip-col ${m === end ? 'is-current' : ''} ${val ? '' : 'is-zero'}">
        <span class="strip-val">${val ? fmt.num(val) : ''}</span>
        <span class="strip-bar" style="height:${val ? Math.max(3, Math.round((val / max) * 52)) : 2}px"></span>
      </span>`;
    })}</div>
    <div class="strip-labels" aria-hidden="true">${months.map((m) => html`<span class="${m === end ? 'is-current' : ''}">${fmt.monthTiny(m)}</span>`)}</div>
    <figcaption class="fine">${t('history.strip', {
      from: `${fmt.monthName(first)} ${first.slice(0, 4)}`,
      to: `${fmt.monthName(end)} ${end.slice(0, 4)}`,
      month: fmt.monthName(end),
      date: fmt.date(today, { weekday: false, year: false }),
    })}</figcaption>
  </figure>`;
}

/** Collapsed by default; the summary row still shows what cooler it is and flags a bad audit. */
function coolerCard(o, today) {
  const c = o.cooler ?? { type: 'none' };
  const a = c.lastAudit;
  const kind = c.type === 'bottler' ? t('cooler.company', { count: c.count, litres: c.litres })
    : ({ 'own-fridge': `${t('cooler.ownFridge')}${c.litres ? ` · ${c.litres} L` : ''}`, 'ice-box': t('cooler.iceBox'), none: t('cooler.none') }[c.type] ?? c.type);
  const warn = Boolean(a && (!a.pure || a.tempC > 6)) || Boolean(c.afternoonOutage);
  return fold('cooler', 'teal', t('card.cooler'), kind, html`
    ${tiles([
      { icon: 'cooler', label: t('cooler.label'), value: c.type === 'bottler' ? `${c.count} × ${c.litres} L` : kind, sub: c.type === 'bottler' ? t('f.fold.company') : '' },
      c.slots ? { icon: 'box', label: t('f.fold.fits'), value: t('f.fold.fitsVal', { n: c.slots }), sub: t('f.fold.fitsSub') } : null,
      o.empties?.cratesHeld != null ? { icon: 'box', label: t('cooler.crates'), value: fmt.num(o.empties.cratesHeld) } : null,
      a ? { icon: 'check', label: t('cooler.lastAudit'), value: fmt.shortDate(a.date), sub: a.pure ? t('cooler.yes') : t('cooler.otherBrands'), tone: a.pure ? '' : 'warn' } : null,
    ])}
    ${c.afternoonOutage ? html`<p class="strip-warn fold-warn">${icon('alert')}<span>${t('f.fold.outage')}</span></p>` : ''}`, { warn });
}

function bookingsCard(o, today) {
  const upcoming = (o.bookings ?? []).filter((b) => b.date >= today).sort((a, b) => (a.date < b.date ? -1 : 1));
  if (!upcoming.length) return '';
  const total = upcoming.reduce((n, b) => n + (b.expectedCases ?? 0), 0);
  return fold('calendar', 'pink', t('card.bookings'), t('f.book.sum', { n: upcoming.length, cases: fmt.casesText(total) }), html`
    <ul class="mini-list">${upcoming.map((b) => html`<li>
      <span>${fmt.shortDate(b.date)}</span>
      <span>${b.event}</span>
      <span class="num">${b.expectedCases != null ? `~${fmt.casesText(b.expectedCases)}` : ''}</span>
    </li>`)}</ul>`);
}

function notesCard(o, v, today, open = false) {
  const notes = tools.notesList(o, v, today);
  return fold('note', 'amber', t('card.notes'), notes.length ? t('f.notes.sum', { n: notes.length }) : t('notes.empty'),
    notes.length ? tools.notesHtml(notes) : html`<p class="muted">${t('f.notes.empty')}</p>`, { open: open || notes.some((n) => n.fresh) });
}

return { render };
